name: MQTT Collection Integration

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: collection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collection:
    name: collection (${{ matrix.emqx }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        emqx: ["5.8.7", "6.3.1"]
    env:
      EMQX_TEST_IMAGE: emqx/emqx:${{ matrix.emqx }}
      OFFKEY_COLLECTION_INTEGRATION: "1"
      COMPOSE_FILE: backend/tests/collection_integration/compose.yml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.0"

      - name: Install backend dependencies
        run: uv sync --project backend --all-packages --all-groups --frozen

      - name: Use the production TimescaleDB image
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path("infra/ansible/inventories/prod/group_vars/all/release.yml").read_text())["release"]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"POSTGRES_TEST_IMAGE={release['images']['postgres']}\n")
          PY

      - name: Start isolated brokers and database
        run: docker compose up -d --wait --wait-timeout 120

      - name: Test schema, retention, membership and release transactions
        env:
          TEST_SCHEMA_DATABASE_URL: postgresql+asyncpg://collection_test:collection-test-password@127.0.0.1:25432/collection_test
        run: |
          uv run --project backend python -m pytest -m "postgres and not radar_integration" -q --tb=short --junitxml="$RUNNER_TEMP/database-results.xml"
          python3 .github/scripts/require_executed_tests.py "$RUNNER_TEMP/database-results.xml" "collection database"

      - name: Test routing, collection and recovery under load
        run: timeout 300 uv run --project backend python -m pytest backend/tests/collection_integration -q --tb=short

      - name: Show fixture diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 150

      - name: Remove fixture containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
