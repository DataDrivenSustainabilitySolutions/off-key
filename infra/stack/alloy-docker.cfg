# GET-only per-node Docker log API; no TCP listener. Readable container
# metadata remains sensitive: this proxy is not a tenant security boundary.
global
  maxconn 64
  log stdout format raw local0 warning

defaults
  mode http
  timeout connect 5s
  timeout http-request 10s
  timeout client 1h
  timeout server 1h

frontend log_reader
  bind /run/offkey-docker/docker.sock mode 0660
  acl read_method method GET HEAD
  # Docker discovery joins network labels onto container metadata.
  acl discovery path_reg ^(/v[0-9]+\.[0-9]+)?/(_ping|version|containers/json|networks)$
  acl log_target path_reg ^(/v[0-9]+\.[0-9]+)?/containers/[a-f0-9]{64}/(json|logs)$
  http-request deny unless read_method
  http-request deny unless discovery or log_target
  default_backend local_engine

backend local_engine
  server docker /var/run/docker.sock
