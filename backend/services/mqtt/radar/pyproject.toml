[project]
name = "off-key-mqtt-radar"
version = "0.1.0"
description = "MQTT Real-Time Anomaly Detector for Analysis and Reporting in off-key platform"
authors = [
    { name = "Oliver Hennhoefer", email = "oliver.hennhoefer@mail.de" },
    { name = "Fernando Saba", email = "fernando.saba@gmx.de" }
]
maintainers = [
    { name = "Oliver Hennhoefer", email = "oliver.hennhoefer@mail.de" },
    { name = "Fernando Saba", email = "fernando.saba@gmx.de" }
]
keywords = ["off-key", "mqtt", "anomaly", "detector", "telemetry", "analysis"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha"
]

dependencies = [
    "off-key-core",
    "paho-mqtt>=2.1,<3",
    "psutil>=5.9.0",
    "numpy>=1.24.0",
    "aberrant[faiss]==1.4.0",
    "nonconform[pyod]>=1.0.0,<3",
    "sqlalchemy[asyncio]>=2.0.38",
    "pydantic-settings>=2.7.1",
    "python-dotenv>=1.0.0",
    "janus>=2,<3",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
off-key-core = { workspace = true }
