name: Docker Images

# Called by CI: pull requests build every image, a main push publishes them.
on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean
      cache-scope-prefix:
        required: true
        type: string
      cache-fallback-scope-prefix:
        required: false
        type: string
        default: ""

jobs:
  build-images:
    name: build-${{ matrix.service }}
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ inputs.publish }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            image_name: off-key-frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            build_args: ""
          - service: api-gateway
            image_name: off-key-api-gateway
            context: ./backend
            file: ./backend/Dockerfile
            build_args: |
              SERVICE_NAME=off-key-api-gateway
              SERVICE_ROOT=services/api/gateway
          - service: tactic-middleware
            image_name: off-key-tactic-middleware
            context: ./backend
            file: ./backend/Dockerfile
            build_args: |
              SERVICE_NAME=off-key-tactic-middleware
              SERVICE_ROOT=services/middleware/tactic
          - service: mqtt-radar
            image_name: off-key-mqtt-radar
            context: ./backend
            file: ./backend/Dockerfile
            build_args: |
              SERVICE_NAME=off-key-mqtt-radar
              SERVICE_ROOT=services/mqtt/radar
          - service: mqtt-proxy
            image_name: off-key-mqtt-proxy
            context: ./backend
            file: ./backend/Dockerfile
            build_args: |
              SERVICE_NAME=off-key-mqtt-proxy
              SERVICE_ROOT=services/mqtt/proxy
          - service: db-sync
            image_name: off-key-db-sync
            context: ./backend
            file: ./backend/Dockerfile
            build_args: |
              SERVICE_NAME=off-key-db-sync
              SERVICE_ROOT=services/db/sync

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Normalize registry owner
        id: owner
        if: ${{ env.PUBLISH == 'true' }}
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Docker metadata
        id: meta
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.image_name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build_args }}
          push: ${{ env.PUBLISH == 'true' }}
          # Validation loads only the frontend, for the nginx startup check below.
          load: ${{ !inputs.publish && matrix.service == 'frontend' }}
          provenance: false
          sbom: false
          tags: ${{ env.PUBLISH == 'true' && steps.meta.outputs.tags || format('off-key-{0}:validation', matrix.service) }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ inputs.cache-scope-prefix }}-${{ matrix.service }}
            ${{ inputs.cache-fallback-scope-prefix && format('type=gha,scope={0}-{1}', inputs.cache-fallback-scope-prefix, matrix.service) || '' }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope-prefix }}-${{ matrix.service }}

      - name: Verify production frontend survives delayed API discovery
        if: ${{ !inputs.publish && matrix.service == 'frontend' }}
        run: python3 frontend/check_nginx_startup.py off-key-frontend:validation

      - name: Attest build provenance
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
