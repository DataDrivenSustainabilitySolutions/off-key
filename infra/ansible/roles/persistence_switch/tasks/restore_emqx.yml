---
# Keep the original EMQX export filename when importing.

- name: Discover the node running emqx-main
  include_role:
    name: swarm_task
  vars:
    svc: emqx-main

- name: emqx | wait for the broker to be up
  command: "docker exec {{ svc_container }} emqx ctl status"
  delegate_to: "{{ svc_node }}"
  register: emqx_status
  until: emqx_status.rc == 0 and 'is started' in emqx_status.stdout
  retries: 30
  delay: 5
  changed_when: false

- name: emqx | create the restore staging directory
  file:
    path: "{{ persistence_stage_dir }}/restore"
    state: directory
    mode: "0700"
  become: true
  delegate_to: "{{ svc_node }}"

- name: emqx | stage the archive on the node
  copy:
    src: "{{ persistence_backup_paths.emqx }}/{{ persistence_backup_files.emqx[0] }}"
    dest: "{{ persistence_stage_dir }}/restore/{{ persistence_backup_files.emqx[0] }}"
    mode: "0600"
  become: true
  delegate_to: "{{ svc_node }}"

- name: emqx | copy the archive into the container's backup directory
  shell: |
    set -euo pipefail
    cid="{{ svc_container }}"
    f="{{ persistence_backup_files.emqx[0] }}"
    docker exec "$cid" mkdir -p /opt/emqx/data/backup
    docker cp "{{ persistence_stage_dir }}/restore/$f" "$cid:/opt/emqx/data/backup/$f"
  args: {executable: /bin/bash}
  become: true
  delegate_to: "{{ svc_node }}"
  changed_when: true

- name: emqx | import
  command: >-
    docker exec {{ svc_container }}
    emqx ctl data import /opt/emqx/data/backup/{{ persistence_backup_files.emqx[0] }}
  delegate_to: "{{ svc_node }}"
  register: emqx_import
  changed_when: true

- name: emqx | report
  debug:
    msg: "{{ emqx_import.stdout_lines }}"
