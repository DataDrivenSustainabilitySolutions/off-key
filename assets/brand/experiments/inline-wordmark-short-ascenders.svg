<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 92" width="884" height="184" role="img" aria-labelledby="title desc">
  <title id="title">Aberration — single-line wordmark with aligned ascenders</title>
  <desc id="desc">Closer lowercase lettering with the b ascender aligned to the t and i dot. The a, e, and original paired-r outlines are preserved exactly.</desc>
  <g id="wordmark" fill="currentColor" transform="translate(16 16)">
    <path id="letter-a-first" fill-rule="evenodd" transform="translate(0 16)" d="M0 0H44V44H0V17H34V10H0ZM10 27V34H34V27Z"/>
    <path id="letter-b" fill-rule="evenodd" transform="translate(52 0)" d="M0 0H10V16H44V60H0ZM10 26V50H34V26Z"/>
    <path id="letter-e" fill-rule="evenodd" transform="translate(104 16)" d="M0 0H44V27H10V34H44V44H0ZM10 10V17H34V10Z"/>
    <path id="letter-rr" transform="translate(144 6)" d="M10 10H38V20H20V54H10ZM44 10H54V54H26V44H44Z"/>
    <path id="letter-a" fill-rule="evenodd" transform="translate(204 16)" d="M0 0H44V44H0V17H34V10H0ZM10 27V34H34V27Z"/>
    <path id="letter-t" transform="translate(256 16)" d="M10 -16H20V0H32V10H20V34H32V44H10V10H0V0H10Z"/>
    <path id="letter-i" transform="translate(296 16)" d="M0 -16H10V-6H0ZM0 0H10V44H0Z"/>
    <path id="letter-o" fill-rule="evenodd" transform="translate(314 16)" d="M0 0H44V44H0ZM10 10V34H34V10Z"/>
    <path id="letter-n" transform="translate(366 16)" d="M0 0H44V44H34V10H10V44H0Z"/>
  </g>
</svg>
