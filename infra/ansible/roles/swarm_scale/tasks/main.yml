---
# Submit every desired count before waiting, so independent services converge
# together. Keep Docker's synchronous failure reporting; zero desired replicas
# still need the caller's actual-task fence before a backup or replacement.
- name: Scale selected services together and wait for convergence
  command:
    argv: "{{ ['docker', 'service', 'scale', '--detach=false'] + (swarm_scale_replicas.items() | map('join', '=') | list) }}"
  when: swarm_scale_replicas | length > 0
