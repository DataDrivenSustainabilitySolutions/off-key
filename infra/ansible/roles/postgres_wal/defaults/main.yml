---
# Persistent PostgreSQL always archives WAL; these base backups make it restorable.
# See docs/operations/recovery.md.
# systemd OnCalendar expression for base backups, and how many complete ones to keep.
postgres_base_backup_schedule: "Sun *-*-* 03:30:00"
postgres_base_backup_keep: 2
postgres_wal_script: /usr/local/lib/offkey/postgres_base_backup.py
postgres_wal_unit: "offkey-{{ stack_name }}-postgres-base-backup"
