# This file configures the pre-commit hooks for the project.
# For more information, see https://pre-commit.com

repos:
  - repo: local
    hooks:
      - id: brand-assets
        name: Check brand asset exports
        entry: python assets/brand/export.py --check
        language: system
        pass_filenames: false
        files: ^(assets/brand/|frontend/public/(brand/|favicon\.svg)|docs/(assets/brand/|overrides/\.icons/brand/)|infra/stack/landing\.html\.j2)
      # Ruff comes from backend/uv.lock, the same pin local runs and Dependabot use.
      - id: ruff
        name: ruff (linter)
        entry: uv run --project backend --frozen ruff check --force-exclude
        args: [--fix, --exit-non-zero-on-fix]
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff (formatter)
        entry: uv run --project backend --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace # Trims trailing whitespace.
      - id: end-of-file-fixer # Ensures files end with a single newline.
      - id: check-yaml # Checks YAML files for parseable syntax.
        args: [--unsafe] # Required for Docker Compose extension tags like !reset.
      - id: check-toml # Checks TOML files for parseable syntax.
      - id: check-json # Checks JSON files for parseable syntax.
      - id: check-added-large-files # Prevents committing large files.
        # args: ['--maxkb=1024'] # Optional: set max file size (e.g., 1MB)
      - id: check-case-conflict # Checks for files that would conflict on case-insensitive filesystems.
      - id: check-merge-conflict # Checks for files that contain merge conflict strings.
      - id: debug-statements # Checks for leftover debugger imports and calls (e.g., pdb, breakpoint()).
      - id: detect-private-key
