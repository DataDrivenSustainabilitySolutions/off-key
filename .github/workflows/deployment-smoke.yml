name: Deployment Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/deployment-smoke.yml"
      - "backend/**"
      - "docker-compose*.yml"
      - "frontend/**"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deployment-smoke:
    name: deployment-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      COMPOSE_PROJECT_NAME: off-key-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Sync backend E2E dependencies
        run: uv sync --project backend --all-packages --all-groups --frozen

      - name: Configure local smoke environment
        run: cp .env.example .env

      - name: Validate deployment models
        env:
          INGRESS_UPSTREAM_MQTT_HOST: broker.example.ts.net
        run: |
          docker compose config --quiet
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.cluster.yml \
            config --quiet
          docker compose \
            --env-file .env \
            -f docker-compose.swarm.yml \
            config --quiet
          docker compose \
            --env-file .env \
            --env-file .env.ingress.example \
            -f docker-compose.swarm.yml \
            -f docker-compose.ingress.yml \
            config --quiet

      - name: Reset deployment smoke stack
        timeout-minutes: 3
        run: docker compose down -v --remove-orphans

      - name: Start base services
        timeout-minutes: 10
        run: |
          set -euo pipefail
          MQTT_BROKER_HOST=emqx-main docker compose up -d --build timescaledb socket-proxy mailpit emqx-main mqtt-proxy

      - name: Wait for base services
        run: |
          set -euo pipefail

          wait_for_container_health() {
            local container="$1"
            local timeout_seconds="$2"
            local deadline=$((SECONDS + timeout_seconds))

            while true; do
              local status
              local health
              status="$(docker inspect --format '{{.State.Status}}' "$container" 2>/dev/null || true)"
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container" 2>/dev/null || true)"

              if [[ "$status" == "running" && "$health" == "healthy" ]]; then
                echo "$container status=$status health=$health"
                return 0
              fi

              if (( SECONDS >= deadline )); then
                echo "::error::$container did not become healthy within ${timeout_seconds}s (status=$status health=$health)"
                docker inspect "$container" || true
                return 1
              fi

              echo "$container status=$status health=$health"
              sleep 5
            done
          }

          wait_for_http() {
            local name="$1"
            local url="$2"
            local timeout_seconds="$3"
            local interval_seconds="${4:-2}"
            local deadline=$((SECONDS + timeout_seconds))

            while true; do
              if curl -fsS "$url" > "/tmp/${name}.response"; then
                echo "$name ready at $url"
                cat "/tmp/${name}.response"
                echo
                return 0
              fi

              if (( SECONDS >= deadline )); then
                echo "::error::$name did not become ready within ${timeout_seconds}s at $url"
                curl -sS "$url" || true
                echo
                return 1
              fi

              sleep "$interval_seconds"
            done
          }

          wait_for_socket_proxy() {
            local timeout_seconds="$1"
            local interval_seconds="${2:-2}"
            local deadline=$((SECONDS + timeout_seconds))
            local network="${COMPOSE_PROJECT_NAME}_socket-network"

            while true; do
              if docker run --rm --network "$network" curlimages/curl:8.16.0 \
                -fsS http://socket-proxy:2375/_ping > /tmp/socket-proxy.response \
                && docker run --rm --network "$network" curlimages/curl:8.16.0 \
                  -fsS http://socket-proxy:2375/images/json \
                  > /tmp/socket-proxy-images.response; then
                echo "socket-proxy ready at http://socket-proxy:2375/_ping on $network"
                cat /tmp/socket-proxy.response
                echo
                echo "socket-proxy image API is available"
                return 0
              fi

              if (( SECONDS >= deadline )); then
                echo "::error::socket-proxy ping/image APIs did not become ready within ${timeout_seconds}s on $network"
                docker run --rm --network "$network" curlimages/curl:8.16.0 \
                  -sS http://socket-proxy:2375/_ping || true
                docker run --rm --network "$network" curlimages/curl:8.16.0 \
                  -sS http://socket-proxy:2375/images/json || true
                echo
                return 1
              fi

              sleep "$interval_seconds"
            done
          }

          wait_for_mqtt_proxy_ready() {
            local timeout_seconds="$1"
            local interval_seconds="${2:-2}"
            local deadline=$((SECONDS + timeout_seconds))

            while true; do
              local ready
              ready="$(docker exec mqtt_proxy \
                /app/bin/python -c \
                "import json, urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:8010/ready', timeout=2)).get('ready'))" \
                2>/dev/null || true)"

              if [[ "$ready" == "True" ]]; then
                echo "mqtt_proxy readiness check passed"
                return 0
              fi

              if (( SECONDS >= deadline )); then
                echo "::error::mqtt_proxy did not become ready within ${timeout_seconds}s"
                docker exec mqtt_proxy /app/bin/python -c \
                  "import json, urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:8010/ready', timeout=2)))" \
                  || true
                docker logs --no-color mqtt_proxy || true
                return 1
              fi

              sleep "$interval_seconds"
            done
          }

          wait_for_container_health timescaledb 240
          wait_for_container_health "$(docker compose ps -q emqx-main)" 240
          wait_for_container_health "$(docker compose ps -q mqtt-proxy)" 240
          wait_for_socket_proxy 120 2
          wait_for_mqtt_proxy_ready 240 2
          wait_for_http mailpit http://localhost:8025/api/v1/messages 120 2

      - name: Start db-sync
        timeout-minutes: 10
        run: docker compose up -d --build db-sync

      - name: Wait for db-sync schema readiness
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))

          while true; do
            status="$(docker inspect --format '{{.State.Status}}' db_sync 2>/dev/null || true)"
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' db_sync 2>/dev/null || true)"

            if [[ "$status" == "running" && "$health" == "healthy" ]]; then
              echo "db_sync status=$status health=$health"
              docker exec db_sync /app/bin/python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8009/ready/schema', timeout=2).read().decode())"
              break
            fi

            if (( SECONDS >= deadline )); then
              echo "::error::db_sync did not become schema-ready within 600s (status=$status health=$health)"
              docker inspect db_sync || true
              docker compose logs --no-color db-sync timescaledb || true
              exit 1
            fi

            echo "db_sync status=$status health=$health"
            sleep 5
          done

      - name: Start tactic middleware
        timeout-minutes: 10
        run: docker compose up -d --build tactic-middleware

      - name: Wait for tactic middleware readiness
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))

          while true; do
            if curl -fsS http://localhost:8001/ready; then
              break
            fi

            status="$(docker inspect --format '{{.State.Status}}' tactic_middleware 2>/dev/null || true)"
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' tactic_middleware 2>/dev/null || true)"
            restart_count="$(docker inspect --format '{{.RestartCount}}' tactic_middleware 2>/dev/null || echo 0)"
            echo "tactic_middleware status=$status health=$health restart_count=$restart_count"

            if [[ "$status" == "restarting" || "$status" == "exited" || "$status" == "dead" || "$restart_count" -gt 0 ]]; then
              echo "::error::tactic_middleware crashed during startup (status=$status health=$health restart_count=$restart_count)"
              docker inspect tactic_middleware || true
              docker compose logs --no-color --tail=200 tactic-middleware db-sync socket-proxy timescaledb || true
              exit 1
            fi

            if (( SECONDS >= deadline )); then
              echo "::error::tactic_middleware did not become ready within 600s (status=$status health=$health restart_count=$restart_count)"
              curl -sS http://localhost:8001/health || true
              echo
              docker inspect tactic_middleware || true
              docker compose logs --no-color --tail=200 tactic-middleware db-sync socket-proxy timescaledb || true
              exit 1
            fi

            curl -sS http://localhost:8001/health || true
            echo
            sleep 5
          done

      - name: Build RADAR image
        timeout-minutes: 10
        run: docker compose --profile standalone-radar build mqtt-radar

      - name: Start application services
        timeout-minutes: 10
        run: docker compose up -d --build api-gateway frontend

      - name: Wait for application readiness
        run: |
          set -euo pipefail

          timeout 600 bash -c '
            until curl -fsS http://localhost:8000/health; do
              echo "api-gateway not ready yet"
              docker inspect --format "api_gateway status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}" api_gateway 2>/dev/null || true
              sleep 5
            done
          '

      - name: Configure canonical EMQX MQTT Source
        env:
          AMBIBOX_MQTT_SERVER: source-broker:1883
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          dashboard_token="$(curl -fsS http://localhost:18083/api/v5/login \
            -H 'content-type: application/json' \
            -d "{\"username\":\"${EMQX_DASHBOARD_USERNAME}\",\"password\":\"${EMQX_DASHBOARD_PASSWORD}\"}" \
            | jq -r '.token')"
          test -n "$dashboard_token"
          EMQX_API_TOKEN="$dashboard_token" \
            uv run --project backend python dev/emqx/reconcile_ingress.py

          timeout 600 bash -c '
            until curl -fsS http://localhost:5173/login > /dev/null; do
              echo "frontend not ready yet"
              docker inspect --format "react_client status={{.State.Status}}" react_client 2>/dev/null || true
              sleep 5
            done
          '

      - name: Verify Docker Compose service states
        run: |
          set -euo pipefail

          required_running=(react_client socket_proxy mailpit source_broker mqtt_proxy)
          emqx_container="$(docker compose ps -q emqx-main)"
          mqtt_proxy_container="$(docker compose ps -q mqtt-proxy)"
          required_healthy=(api_gateway tactic_middleware db_sync timescaledb "$emqx_container" "$mqtt_proxy_container")

          for container in "${required_running[@]}"; do
            status="$(docker inspect --format '{{.State.Status}}' "$container" 2>/dev/null || true)"
            echo "$container status=$status"
            if [[ "$status" != "running" ]]; then
              exit 1
            fi
          done

          for container in "${required_healthy[@]}"; do
            status="$(docker inspect --format '{{.State.Status}}' "$container" 2>/dev/null || true)"
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container" 2>/dev/null || true)"
            echo "$container status=$status health=$health"
            if [[ "$status" != "running" || "$health" != "healthy" ]]; then
              exit 1
            fi
          done

      - name: Run deployment smoke test
        timeout-minutes: 10
        run: |
          set -euo pipefail

          playwright_version="$(node -p "require('./frontend/node_modules/@playwright/test/package.json').version")"
          playwright_image="mcr.microsoft.com/playwright:v${playwright_version}-noble"

          echo "Running visual smoke tests with ${playwright_image}"
          docker run --rm \
            --network host \
            --ipc host \
            --volume "${PWD}/frontend:/work" \
            --workdir /work \
            --env-file "${PWD}/.env" \
            --env CI=true \
            --env MQTT_SOURCE_URL=mqtt://localhost:1884 \
            --env PLAYWRIGHT_BASE_URL=http://localhost:5173 \
            "${playwright_image}" \
            npm run test:e2e

      - name: Run adaptive backend lifecycle E2E
        timeout-minutes: 5
        run: |
          set -euo pipefail
          export RUN_ADAPTIVE_E2E=1
          export E2E_GATEWAY_URL=http://localhost:8000
          export E2E_MQTT_HOST=localhost
          export E2E_MQTT_PORT=1883
          export E2E_AUTH_TOKEN="$(node -e "const state=require('./frontend/test-results/.auth/user.json'); const token=state.origins.flatMap(({localStorage=[]})=>localStorage).find(({name})=>name==='auth_token')?.value; if (!token) process.exit(1); process.stdout.write(token)")"
          uv run --project backend python -m pytest backend/tests/test_adaptive_lane_e2e.py -q

      - name: Collect deployment smoke diagnostics
        if: failure()
        timeout-minutes: 5
        run: |
          set +e
          mkdir -p deployment-smoke-diagnostics

          docker compose ps --all > deployment-smoke-compose-ps.txt
          docker compose logs --no-color \
            frontend api-gateway tactic-middleware db-sync timescaledb socket-proxy mailpit emqx-main \
            mqtt-proxy source-broker \
            > deployment-smoke-compose.log

          for container in react_client api_gateway tactic_middleware db_sync timescaledb socket_proxy mailpit mqtt_proxy source_broker; do
            docker inspect "$container" > "deployment-smoke-diagnostics/${container}.inspect.json" 2>&1
          done
          docker inspect "$(docker compose ps -q emqx-main)" > deployment-smoke-diagnostics/emqx-main.inspect.json 2>&1

          curl -sS http://localhost:8001/health > deployment-smoke-diagnostics/tactic-health.json 2>&1
          curl -sS http://localhost:8001/ready > deployment-smoke-diagnostics/tactic-ready.json 2>&1
          docker exec db_sync /app/bin/python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8009/health', timeout=2).read().decode())" > deployment-smoke-diagnostics/db-sync-health.json 2>&1
          docker exec db_sync /app/bin/python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8009/ready/schema', timeout=2).read().decode())" > deployment-smoke-diagnostics/db-sync-ready-schema.json 2>&1
          curl -sS http://localhost:8000/health > deployment-smoke-diagnostics/api-gateway-health.json 2>&1
          docker run --rm --network "${COMPOSE_PROJECT_NAME}_socket-network" curlimages/curl:8.16.0 \
            -sS http://socket-proxy:2375/_ping > deployment-smoke-diagnostics/socket-proxy-ping.txt 2>&1

      - name: Upload deployment smoke artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-smoke-artifacts
          if-no-files-found: ignore
          path: |
            deployment-smoke-compose-ps.txt
            deployment-smoke-compose.log
            deployment-smoke-diagnostics
            frontend/playwright-report
            frontend/test-results

      - name: Tear down deployment smoke stack
        if: always()
        timeout-minutes: 5
        run: docker compose down -v --remove-orphans
