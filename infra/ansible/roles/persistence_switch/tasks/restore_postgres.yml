---
# Logical restore into the freshly-mounted data directory.
#
# The sequence below is the documented TimescaleDB procedure and the order matters:
#   create db -> CREATE EXTENSION -> timescaledb_pre_restore() -> pg_restore -> post_restore()
# Skipping pre/post_restore corrupts the TimescaleDB catalogs.

- name: Discover the node running postgres
  include_role:
    name: swarm_task
  vars:
    svc: postgres

- name: postgres | wait for readiness
  command: "docker exec {{ svc_container }} pg_isready -U {{ postgres_user }}"
  delegate_to: "{{ svc_node }}"
  register: pg_ready
  until: pg_ready.rc == 0
  retries: 30
  delay: 5
  changed_when: false

- name: postgres | create the restore staging directory
  file:
    path: "{{ persistence_stage_dir }}/restore"
    state: directory
    mode: "0700"
  become: true
  delegate_to: "{{ svc_node }}"

- name: postgres | push only the verified backup artifacts back to the node
  copy:
    src: "{{ persistence_backup_paths.postgres }}/{{ item }}"
    dest: "{{ persistence_stage_dir }}/restore/{{ item }}"
    mode: "0600"
  become: true
  delegate_to: "{{ svc_node }}"
  loop: "{{ persistence_backup_files.postgres }}"

- name: postgres | restore roles and globals
  shell: >-
    docker exec -i {{ svc_container }}
    psql -U {{ postgres_user }} -d postgres
    < {{ persistence_stage_dir }}/restore/roles.sql
  args: {executable: /bin/bash}
  become: true
  delegate_to: "{{ svc_node }}"
  changed_when: true

- name: postgres | restore each database
  # NOTE: deliberately no -j on pg_restore. Parallel restore does not correctly restore the
  # TimescaleDB catalogs, and the corruption is silent. Do not "optimise" this.
  shell: |
    set -euo pipefail
    db={{ item | regex_replace('\.dump$', '') | quote }}
    cid="{{ svc_container }}"
    docker exec "$cid" dropdb -U {{ postgres_user | quote }} --maintenance-db=template1 --if-exists --force "$db"
    docker exec "$cid" createdb -U {{ postgres_user | quote }} --maintenance-db=template1 --template=template0 "$db"
    docker exec "$cid" psql -U {{ postgres_user | quote }} -v ON_ERROR_STOP=1 -d "$db" -c "CREATE EXTENSION IF NOT EXISTS timescaledb;"
    docker exec "$cid" psql -U {{ postgres_user | quote }} -v ON_ERROR_STOP=1 -d "$db" -c "SELECT timescaledb_pre_restore();"
    docker exec -i "$cid" pg_restore --exit-on-error -U {{ postgres_user | quote }} -d "$db" < {{ (persistence_stage_dir ~ '/restore/' ~ item) | quote }}
    docker exec "$cid" psql -U {{ postgres_user | quote }} -v ON_ERROR_STOP=1 -d "$db" -c "SELECT timescaledb_post_restore();"
  args: {executable: /bin/bash}
  become: true
  delegate_to: "{{ svc_node }}"
  loop: "{{ persistence_backup_files.postgres | reject('equalto', 'roles.sql') | list }}"
  loop_control:
    label: "{{ item }}"
  changed_when: true

# An older backup also holds the sessions that were live when it was taken,
# including ones revoked since, so accounts restored from it must sign in again.
# A cutover restores the backup it took moments before and keeps sessions.
- name: postgres | end every session the backup carried
  command:
    argv:
      - docker
      - exec
      - "{{ svc_container }}"
      - psql
      - -U
      - "{{ postgres_user }}"
      - -v
      - ON_ERROR_STOP=1
      - -d
      - "{{ postgres_db | default('postgres') }}"
      - -c
      - >-
        DO $$ BEGIN
        IF to_regclass('public.users') IS NOT NULL THEN
        UPDATE users SET session_version = session_version + 1; END IF;
        IF to_regclass('public.remembered_sessions') IS NOT NULL THEN
        DELETE FROM remembered_sessions; END IF;
        END $$;
  delegate_to: "{{ svc_node }}"
  when:
    - restore_from is defined
    - (postgres_db | default('postgres')) ~ '.dump' in persistence_backup_files.postgres
  changed_when: true

- name: postgres | remove the staged dumps from the node
  file:
    path: "{{ persistence_stage_dir }}"
    state: absent
  become: true
  delegate_to: "{{ svc_node }}"

- name: postgres | report
  debug:
    msg: "Restored {{ persistence_backup_files.postgres | length - 1 }} database(s) from {{ persistence_backup_paths.postgres }}"
