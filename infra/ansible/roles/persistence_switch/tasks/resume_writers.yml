---
- name: Resume the original writer replicas
  block:
    - name: Restore each original writer replica count
      include_role:
        name: swarm_scale
      vars:
        swarm_scale_replicas: "{{ persistence_writer_replicas }}"
  rescue:
    - name: Preserve the recovery plan after an incomplete writer resumption
      fail:
        msg: >-
          Writer resumption failed. Some writers may already be running; the original
          recovery plan remains at {{ stack_dir }}/recovery-pending.json.
          Restore its recorded writer counts before clearing the transaction.

- name: Clear the completed recovery transaction
  file:
    path: "{{ stack_dir }}/recovery-pending.json"
    state: absent
