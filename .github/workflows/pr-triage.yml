name: PR triage

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened]

permissions: {}

jobs:
  triage:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Assign the author
        if: ${{ github.event.pull_request.user.type != 'Bot' }}
        run: |
          gh api --method POST "repos/$GH_REPO/issues/$PR/assignees" -f "assignees[]=$AUTHOR" > /dev/null \
            || echo "::warning::Could not assign $AUTHOR"

      - name: Request the maintainer's review
        run: |
          if [ "$AUTHOR" = "OliverHennhoefer" ] || [[ "$TITLE" == *"DO NOT REVIEW"* ]]; then
            exit 0
          fi
          gh api --method POST "repos/$GH_REPO/pulls/$PR/requested_reviewers" -f "reviewers[]=OliverHennhoefer" > /dev/null \
            || echo "::warning::Could not request a review from OliverHennhoefer"
