name: Docker Images

# Called by CI on a main push: publishes and attests every application image.
# Other events build the same images once in CI's images job and never push.
on:
  workflow_call:
    inputs:
      cache-scope-prefix:
        required: true
        type: string
      cache-fallback-scope-prefix:
        required: false
        type: string
        default: ""

jobs:
  build-images:
    name: build-${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: docs
            image_name: off-key-docs
            context: .
            file: ./dev/docs/Dockerfile
            build_args: ""
            target: ""
          - service: frontend
            image_name: off-key-frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            build_args: ""
            target: production
          - service: api-gateway
            image_name: off-key-api-gateway
            context: ./backend
            file: ./backend/Dockerfile
            build_args: |
              SERVICE_NAME=off-key-api-gateway
              SERVICE_ROOT=services/api/gateway
            target: ""
          - service: tactic-middleware
            image_name: off-key-tactic-middleware
            context: ./backend
            file: ./backend/Dockerfile
            build_args: |
              SERVICE_NAME=off-key-tactic-middleware
              SERVICE_ROOT=services/middleware/tactic
            target: ""
          - service: mqtt-radar
            image_name: off-key-mqtt-radar
            context: ./backend
            file: ./backend/Dockerfile
            build_args: |
              SERVICE_NAME=off-key-mqtt-radar
              SERVICE_ROOT=services/mqtt/radar
            target: ""
          - service: mqtt-proxy
            image_name: off-key-mqtt-proxy
            context: ./backend
            file: ./backend/Dockerfile
            build_args: |
              SERVICE_NAME=off-key-mqtt-proxy
              SERVICE_ROOT=services/mqtt/proxy
            target: ""
          - service: db-sync
            image_name: off-key-db-sync
            context: ./backend
            file: ./backend/Dockerfile
            build_args: |
              SERVICE_NAME=off-key-db-sync
              SERVICE_ROOT=services/db/sync
            target: ""
          - service: forecast
            image_name: off-key-forecast
            context: ./backend
            file: ./backend/Dockerfile
            build_args: |
              SERVICE_NAME=off-key-forecast
              SERVICE_ROOT=services/forecast/service
            target: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Select the exact source revision of this image
        id: source
        run: echo "revision=$(python3 infra/scripts/image_sources.py "$GITHUB_SHA" --service '${{ matrix.service }}')" >> "$GITHUB_OUTPUT"

      - name: Normalize registry owner
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.image_name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}

      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # The same target, build arguments and revision label as CI's images job.
          target: ${{ matrix.target }}
          build-args: |
            ${{ matrix.build_args }}
            GIT_COMMIT=${{ steps.source.outputs.revision }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          # Keep release-varying timestamps and tag-derived versions out of the
          # image config: unchanged source inputs must keep their exact digest.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.version=sha-${{ steps.source.outputs.revision }}
          cache-from: |
            type=gha,scope=${{ inputs.cache-scope-prefix }}-${{ matrix.service }}
            ${{ inputs.cache-fallback-scope-prefix && format('type=gha,scope={0}-{1}', inputs.cache-fallback-scope-prefix, matrix.service) || '' }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope-prefix }}-${{ matrix.service }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
