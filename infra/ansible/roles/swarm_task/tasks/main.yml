---
# Input: svc. Results: svc_node, svc_task_id, and that task's svc_container.
- name: "{{ svc }} | wait for one running task"
  command:
    argv:
      - docker
      - service
      - ps
      - "{{ stack_name }}_{{ svc }}"
      - --no-trunc
      - --filter
      - desired-state=running
      - --format
      - '{% raw %}{{json .}}{% endraw %}'
  register: _svc_tasks
  changed_when: false
  until: >-
    _svc_tasks.stdout_lines | length == 1
    and (_svc_tasks.stdout_lines[0] | from_json).CurrentState.startswith('Running ')
  retries: 30
  delay: 5

- name: "{{ svc }} | require an inventory node"
  assert:
    that: (_svc_tasks.stdout_lines[0] | from_json).Node in groups['all']
    fail_msg: "The running {{ stack_name }}_{{ svc }} task is on a node outside this inventory."

- name: "{{ svc }} | record the running task"
  set_fact:
    svc_node: "{{ (_svc_tasks.stdout_lines[0] | from_json).Node }}"
    svc_task_id: "{{ (_svc_tasks.stdout_lines[0] | from_json).ID }}"

- name: "{{ svc }} | wait for the running task's container"
  command:
    argv:
      - docker
      - ps
      - --quiet
      - --no-trunc
      - --filter
      - "label=com.docker.swarm.task.id={{ svc_task_id }}"
      - --filter
      - status=running
  delegate_to: "{{ svc_node }}"
  register: _svc_containers
  changed_when: false
  until: _svc_containers.stdout_lines | length == 1
  retries: 30
  delay: 5

- name: "{{ svc }} | record container"
  set_fact:
    svc_container: "{{ _svc_containers.stdout_lines[0] }}"
