---
- name: Wait for the stateful service update to finish without rollback
  command:
    argv: [docker, service, inspect, "{{ stack_name }}_{{ svc }}"]
  register: replacement_service
  changed_when: false
  no_log: true
  until: (replacement_service.stdout | from_json)[0].UpdateStatus.State | default('completed') == 'completed'
  retries: 60
  delay: 5

- name: Wait for the replacement stateful task
  include_tasks: _service_container.yml

- name: Require a replacement task on the original volume node
  assert:
    that:
      - svc_task_id != persistence_service_tasks[svc]
      - svc_node == persistence_service_nodes[svc]
    fail_msg: "{{ svc }} did not move to a new task on its original data node; writers remain stopped."

- name: Inspect the replacement container mounts and image-defined volumes
  command:
    argv: [docker, inspect, "{{ svc_container }}", --format, '{% raw %}{"mounts":{{json .Mounts}},"image_volumes":{{json .Config.Volumes}}}{% endraw %}']
  delegate_to: "{{ svc_node }}"
  register: replacement_mounts
  changed_when: false

- name: Require the intended mount before restoring any data
  assert:
    that:
      - configured | length == (1 if item.enabled | bool else 0)
      - >-
        not (item.enabled | bool)
        or (configured[0].Type == 'volume' and configured[0].Source == expected_volume)
      - >-
        (item.enabled | bool and mounted | length == 1
         and mounted[0].Type == 'volume' and mounted[0].Name == expected_volume)
        or (not (item.enabled | bool) and (mounted | length == 0 or image_volume))
    fail_msg: "{{ svc }}:{{ item.path }} has the wrong mount; writers remain stopped."
  vars:
    expected_volume: "{{ stack_name }}_{{ item.volume }}"
    configured: >-
      {{ (replacement_service.stdout | from_json)[0].Spec.TaskTemplate.ContainerSpec.Mounts | default([])
         | selectattr('Target', 'equalto', item.path) | list }}
    mounted: "{{ (replacement_mounts.stdout | from_json).mounts | selectattr('Destination', 'equalto', item.path) | list }}"
    # With no service mount, Docker creates a new anonymous volume for an image VOLUME.
    # It is ephemeral across Swarm task replacements, unlike the managed named volume.
    image_volume: >-
      {{ mounted | length == 1 and mounted[0].Type == 'volume' and mounted[0].Name != expected_volume
         and item.path in ((replacement_mounts.stdout | from_json).image_volumes | default({}, true)) }}
  loop: "{{ persistence_flips | selectattr('service', 'equalto', svc) | list }}"
  loop_control:
    label: "{{ item.path }}"
