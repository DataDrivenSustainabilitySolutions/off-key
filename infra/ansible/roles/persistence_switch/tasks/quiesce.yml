---
- name: List current stack services and runtime RADAR workers
  command:
    argv: [docker, service, ls, --quiet, --filter, "{{ item }}"]
  loop:
    - "label=com.docker.stack.namespace={{ stack_name }}"
    - label=managed_by=tactic
  register: persistence_services
  changed_when: false

- name: Inspect services before stopping writers
  command:
    argv: "{{ ['docker', 'service', 'inspect'] + service_ids }}"
  vars:
    service_ids: "{{ persistence_services.results | map(attribute='stdout_lines') | flatten | unique | list }}"
  register: persistence_service_specs
  changed_when: false
  no_log: true

- name: Record writer replica counts
  set_fact:
    persistence_writer_replicas: >-
      {{ dict((persistence_service_specs.stdout | from_json)
         | rejectattr('Spec.Name', 'in', [stack_name ~ '_postgres', stack_name ~ '_emqx-main'])
         | map(attribute='Spec.Name')
         | zip((persistence_service_specs.stdout | from_json)
         | rejectattr('Spec.Name', 'in', [stack_name ~ '_postgres', stack_name ~ '_emqx-main'])
         | map(attribute='Spec.Mode.Replicated.Replicas'))) }}
  no_log: true

- name: Refuse unexpected running writers before retrying recovery
  assert:
    that: unexpected_writers | length == 0
    fail_msg: >-
      Running writers outside the original recovery plan: {{ unexpected_writers | join(', ') }}.
      Stop these unexpected runtime writers before retrying. The original plan and replica
      counts have been preserved; no writer has been changed by this retry.
  vars:
    unexpected_writers: >-
      {{ persistence_writer_replicas | dict2items | selectattr('value', 'gt', 0)
         | map(attribute='key') | difference(persistence_recovery_plan.writer_replicas.keys() | list) }}
  when: persistence_recovery_plan | length > 0

- name: Preserve the original replica counts across restore retries
  set_fact:
    persistence_writer_replicas: "{{ persistence_recovery_plan.writer_replicas }}"
  when: persistence_recovery_plan | length > 0

- name: Ensure the recovery plan directory exists
  file:
    path: "{{ stack_dir }}"
    state: directory
    mode: "0750"

- name: Record the complete recovery obligation before stopping any writer
  set_fact:
    persistence_recovery_plan:
      version: 1
      phase: "{{ persistence_recovery_phase }}"
      timestamp: "{{ restore_from | default(persistence_run_ts) }}"
      services: "{{ persistence_required_services | sort }}"
      backup_root: "{{ persistence_backup_dir }}"
      backup_paths: "{{ persistence_backup_paths }}"
      backup_files: "{{ persistence_backup_files }}"
      writer_replicas: "{{ persistence_writer_replicas }}"
      flips: "{{ persistence_flips | default([]) }}"
      service_nodes: "{{ persistence_service_nodes | default({}) }}"
      service_tasks: "{{ persistence_service_tasks | default({}) }}"
  when: persistence_recovery_plan | length == 0

- name: Save the recovery plan before stopping any writer
  include_tasks: save_recovery.yml

- name: Stop writers before taking the backup
  command:
    argv: [docker, service, scale, "{{ item.key }}=0"]
  loop: "{{ persistence_writer_replicas | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Confirm all writers have stopped
  include_tasks: wait_stopped.yml
  vars:
    service_names: "{{ persistence_writer_replicas.keys() | list }}"
