# Public website. Replaces the image's default server: the same static files,
# plus Markdown for agents. `/` answers with index.md when a client asks for
# text/markdown in Accept, and /llms.txt indexes both for language models.
map $http_accept $landing_index {
    default "index.html";
    "~*text/markdown" "index.md";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    charset_types text/plain text/markdown;
    server_tokens off;

    types {
        text/html html;
        text/plain txt;
        text/markdown md;
    }

    location = / {
        add_header Vary Accept always;
        add_header Link "</index.md>; rel=\"alternate\"; type=\"text/markdown\", </llms.txt>; rel=\"describedby\"; type=\"text/plain\"" always;
        try_files /$landing_index =404;
    }

    location / {
        try_files $uri =404;
    }
}
