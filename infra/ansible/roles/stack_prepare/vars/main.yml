---
# Explicit ownership of container settings; YAML merges share stable setting groups.

stack_common_environment: &common
  DEBUG: "{{ debug }}"
  LOG_LEVEL: "{{ log_level }}"
  LOG_TRUNCATE_LENGTH: "{{ log_truncate_length }}"
  LOG_FILE: "{{ log_file }}"
  LOG_FORMAT: "{{ log_format }}"
  LOG_CORRELATION_HEADER: "{{ log_correlation_header }}"
  LOG_REDACT_PII: "{{ log_redact_pii }}"
  LOG_PII_DEBUG_UNMASK: "{{ log_pii_debug_unmask }}"
  LOG_HEARTBEAT_INTERVAL_SECONDS: "{{ log_heartbeat_interval_seconds }}"
  LOG_REPEAT_SUPPRESSION_SECONDS: "{{ log_repeat_suppression_seconds }}"

stack_database_environment: &database
  POSTGRES_USER: "{{ postgres_user }}"
  POSTGRES_PASSWORD: "{{ postgres_password }}"
  POSTGRES_DB: "{{ postgres_db }}"
  POSTGRES_HOST: "{{ postgres_host }}"
  POSTGRES_PORT: "{{ postgres_port }}"

stack_auth_environment: &auth
  JWT_SECRET: "{{ jwt_secret }}"
  INTERNAL_API_SECRET: "{{ internal_api_secret }}"
  ALGORITHM: "{{ algorithm | default('HS256') }}"
  ACCESS_TOKEN_EXPIRE_MINUTES: "{{ access_token_expire_minutes | default('30') }}"
  SUPERUSER_MAIL: "{{ superuser_mail }}"

stack_email_environment: &email
  EMAIL_USERNAME: "{{ email_username | default('') }}"
  EMAIL_PASSWORD: "{{ email_password | default('') }}"
  EMAIL_FROM: "{{ email_from }}"
  SMTP_SERVER: "{{ smtp_server }}"
  SMTP_PORT: "{{ smtp_port }}"
  MAIL_STARTTLS: "{{ mail_starttls }}"
  MAIL_SSL_TLS: "{{ mail_ssl_tls }}"
  USE_CREDENTIALS: "{{ use_credentials }}"
  VALIDATE_CERTS: "{{ validate_certs }}"
  ANOMALY_ALERT_RECIPIENTS: "{{ anomaly_alert_recipients }}"

service_environment:
  postgres:
    POSTGRES_USER: "{{ postgres_user }}"
    POSTGRES_PASSWORD: "{{ postgres_password }}"
    POSTGRES_DB: "{{ postgres_db }}"
  tailscale-ambibox:
    TS_EXTRA_ARGS: "{{ tailscale_ambibox_extra_args }}"
    TS_HOSTNAME: "{{ tailscale_ambibox_hostname }}"
  api:
    <<: [*common, *auth, *email]
    ENVIRONMENT: "{{ app_environment }}"
    APP_NAME: aberration
    FRONTEND_BASE_URL: "{{ frontend_base_url }}"
    CORS_ALLOWED_ORIGINS: "{{ cors_allowed_origins }}"
    TACTIC_SERVICE_NAME: "{{ tactic_service_name }}"
    TACTIC_SERVICE_VERSION: "{{ tactic_service_version }}"
    TACTIC_SERVICE_URL: "{{ tactic_service_url | default(none) }}"
    TACTIC_SERVICE_HOST: "{{ tactic_service_host }}"
    TACTIC_SERVICE_PORT: "{{ tactic_service_port }}"
    SYNC_HOSTNAME: "{{ sync_hostname }}"
    SYNC_API_PORT: "{{ sync_api_port }}"
    ENABLE_REQUEST_LOGGING: "{{ enable_request_logging }}"
    ENABLE_PERFORMANCE_LOGGING: "{{ enable_performance_logging }}"
    UVICORN_ACCESS_LOG_LEVEL: "{{ uvicorn_access_log_level }}"
    RATE_LIMIT_LOG_LEVEL: "{{ rate_limit_log_level }}"
  tactic:
    <<: [*common, *database, *auth, *email]
    ENVIRONMENT: "{{ app_environment }}"
    TACTIC_IMAGE: "{{ tactic_image }}"
    TACTIC_RADAR_IMAGE: "{{ mqtt_radar_image }}"
    FRONTEND_BASE_URL: "{{ frontend_base_url }}"
    AMBIBOX_INGRESS_ENABLED: "{{ ambibox_ingress_enabled | bool | lower }}"
    TACTIC_RADAR_WORKLOAD_LIFECYCLE: "{{ tactic_radar_workload_lifecycle }}"
    TACTIC_SERVICE_NAME: "{{ tactic_service_name }}"
    TACTIC_SERVICE_VERSION: "{{ tactic_service_version }}"
    TACTIC_HOST: "{{ tactic_host }}"
    TACTIC_PORT: "{{ tactic_port }}"
    TACTIC_SERVICE_URL: "{{ tactic_service_url | default(none) }}"
    TACTIC_LOG_LEVEL: "{{ tactic_log_level }}"
    TACTIC_SERVICE_HOST: "{{ tactic_service_host }}"
    TACTIC_SERVICE_PORT: "{{ tactic_service_port }}"
    TACTIC_DOCKER_API_URL: "{{ tactic_docker_api_url }}"
    TACTIC_DOCKER_API_PORT: "{{ tactic_docker_api_port }}"
    TACTIC_DOCKER_MAX_CONCURRENT_CALLS: "{{ tactic_docker_max_concurrent_calls }}"
    TACTIC_DOCKER_DEFAULT_NETWORK: "{{ tactic_docker_default_network }}"
    TACTIC_DOCKER_ADDITIONAL_NETWORKS: "{{ tactic_docker_additional_networks | default(none) }}"
    TACTIC_DOCKER_DEFAULT_CONSTRAINTS: "{{ tactic_docker_default_constraints }}"
    TACTIC_DOCKER_DEFAULT_RESTART_POLICY: "{{ tactic_docker_default_restart_policy }}"
    TACTIC_DOCKER_DEFAULT_RESTART_MAX_ATTEMPTS: "{{ tactic_docker_default_restart_max_attempts }}"
    TACTIC_DOCKER_DEFAULT_MEMORY_LIMIT: "{{ tactic_docker_default_memory_limit }}"
    TACTIC_DOCKER_DEFAULT_CPU_LIMIT: "{{ tactic_docker_default_cpu_limit }}"
    TACTIC_RADAR_SECRET_SERVICE: "{{ stack_name ~ '_mqtt-radar' if offkey_env == 'prod' else none }}"
    TACTIC_RADAR_DEFAULT_MQTT_BROKER_HOST: "{{ tactic_radar_default_mqtt_broker_host }}"
    TACTIC_RADAR_DEFAULT_MQTT_BROKER_PORT: "{{ tactic_radar_default_mqtt_broker_port }}"
    TACTIC_RADAR_DEFAULT_MQTT_USE_TLS: "{{ tactic_radar_default_mqtt_use_tls }}"
    TACTIC_RADAR_DEFAULT_MQTT_CLIENT_ID_PREFIX: "{{ tactic_radar_default_mqtt_client_id_prefix }}"
    TACTIC_RADAR_DEFAULT_MQTT_USE_AUTH: "{{ tactic_radar_default_mqtt_use_auth }}"
    TACTIC_RADAR_DEFAULT_MQTT_USERNAME: "{{ tactic_radar_default_mqtt_username | default('') }}"
    TACTIC_RADAR_DEFAULT_MQTT_QOS: "{{ tactic_radar_default_mqtt_qos }}"
    TACTIC_RADAR_DEFAULT_MODEL_TYPE: "{{ tactic_radar_default_model_type }}"
    TACTIC_RADAR_DEFAULT_BATCH_SIZE: "{{ tactic_radar_default_batch_size }}"
    TACTIC_RADAR_DEFAULT_BATCH_TIMEOUT: "{{ tactic_radar_default_batch_timeout }}"
    TACTIC_RADAR_DEFAULT_MEMORY_LIMIT_MB: "{{ tactic_radar_default_memory_limit_mb }}"
    TACTIC_RADAR_DEFAULT_CHECKPOINT_INTERVAL: "{{ tactic_radar_default_checkpoint_interval }}"
    TACTIC_RADAR_DEFAULT_DB_WRITE_ENABLED: "{{ tactic_radar_default_db_write_enabled }}"
    TACTIC_RADAR_DEFAULT_DB_BATCH_SIZE: "{{ tactic_radar_default_db_batch_size }}"
    TACTIC_RADAR_DEFAULT_DB_BATCH_TIMEOUT: "{{ tactic_radar_default_db_batch_timeout }}"
    TACTIC_RADAR_DEFAULT_HEALTH_CHECK_INTERVAL: "{{ tactic_radar_default_health_check_interval }}"
    TACTIC_RADAR_DEFAULT_LOG_LEVEL: "{{ tactic_radar_default_log_level }}"
    TACTIC_RADAR_DEFAULT_RATE_LIMIT_PER_MINUTE: "{{ tactic_radar_default_rate_limit_per_minute }}"
    SQLALCHEMY_LOG_LEVEL: "{{ sqlalchemy_log_level }}"
  frontend:
    VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: "{{ vite_additional_server_allowed_hosts | default('') }}"
    VITE_API_URL: "{{ vite_api_url }}"
    __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: '{{ vite_additional_server_allowed_hosts | default('''') }}'
  db-sync:
    <<: [*common, *database]
    ENVIRONMENT: "{{ app_environment }}"
    SYNC_HOSTNAME: "{{ sync_hostname }}"
    TELEMETRY_RETENTION_DAYS: "{{ telemetry_retention_days }}"
    SYNC_API_HOST: "{{ sync_api_host }}"
    SYNC_API_PORT: "{{ sync_api_port }}"
    SQLALCHEMY_LOG_LEVEL: "{{ sqlalchemy_log_level }}"
  mqtt-proxy:
    <<: [*common, *database]
    MQTT_PROXY_IMAGE: "{{ mqtt_proxy_image }}"
    MQTT_RADAR_IMAGE: "{{ mqtt_radar_image }}"
    MQTT_PROXY_ENVIRONMENT: "{{ mqtt_proxy_environment }}"
    MQTT_BROKER_HOST: "{{ mqtt_broker_host }}"
    MQTT_BROKER_PORT: "{{ mqtt_broker_port }}"
    MQTT_USE_TLS: "{{ mqtt_use_tls }}"
    MQTT_TRANSPORT: "{{ mqtt_transport }}"
    MQTT_CLIENT_ID_PREFIX: "{{ mqtt_client_id_prefix }}"
    MQTT_USE_AUTH: "{{ mqtt_use_auth }}"
    MQTT_USERNAME: "{{ mqtt_local_proxy_username if offkey_env == 'prod' else mqtt_username | default('') }}"
    MQTT_APIKEY: "{{ mqtt_apikey | default('') if offkey_env != 'prod' else none }}"
    MQTT_TOPIC_REGEX: "{{ mqtt_topic_regex }}"
    AMBIBOX_INGRESS_ENABLED: "{{ ambibox_ingress_enabled | bool | lower }}"
    MQTT_TELEMETRY_ENABLED: "{{ mqtt_telemetry_enabled }}"
    MQTT_RECONNECT_DELAY: "{{ mqtt_reconnect_delay }}"
    MQTT_BATCH_SIZE: "{{ mqtt_batch_size }}"
    MQTT_MAX_MESSAGE_QUEUE_SIZE: "{{ mqtt_max_message_queue_size }}"
    MQTT_BATCH_TIMEOUT: "{{ mqtt_batch_timeout }}"
    MQTT_WORKER_THREADS: "{{ mqtt_worker_threads }}"
    MQTT_SUBSCRIPTION_QOS: "{{ mqtt_subscription_qos }}"
    MQTT_HEALTH_LOG_REMINDER_INTERVAL: "{{ mqtt_health_log_reminder_interval }}"
    MQTT_SHUTDOWN_TIMEOUT: "{{ mqtt_shutdown_timeout }}"
    MQTT_GRACEFUL_SHUTDOWN_TIMEOUT: "{{ mqtt_graceful_shutdown_timeout }}"
    MQTT_RETRY_BASE_DELAY: "{{ mqtt_retry_base_delay }}"
    MQTT_RETRY_MAX_DELAY: "{{ mqtt_retry_max_delay }}"
    MQTT_RETRY_EXPONENTIAL_BASE: "{{ mqtt_retry_exponential_base }}"
    MQTT_RETRY_JITTER_ENABLED: "{{ mqtt_retry_jitter_enabled }}"
    MQTT_RETRY_JITTER_MAGNITUDE: "{{ mqtt_retry_jitter_magnitude }}"
    MQTT_CLEANUP_INTERVAL: "{{ mqtt_cleanup_interval }}"
    MQTT_METRICS_INTERVAL: "{{ mqtt_metrics_interval }}"
    MQTT_HEALTH_MONITOR_INTERVAL: "{{ mqtt_health_monitor_interval }}"
    SQLALCHEMY_LOG_LEVEL: "{{ sqlalchemy_log_level }}"
    ENVIRONMENT: "{{ mqtt_proxy_environment }}"
  mqtt-radar:
    <<: [*common, *database]
    RADAR_ENVIRONMENT: "{{ radar_environment }}"
    RADAR_MQTT_BROKER_HOST: "{{ radar_mqtt_broker_host }}"
    RADAR_MQTT_BROKER_PORT: "{{ radar_mqtt_broker_port }}"
    RADAR_MQTT_USE_TLS: "{{ radar_mqtt_use_tls }}"
    RADAR_MQTT_USE_AUTH: "{{ radar_mqtt_use_auth | default('false') }}"
    RADAR_MQTT_USERNAME: "{{ radar_mqtt_username | default('') }}"
    RADAR_SUBSCRIPTION_TOPICS: "{{ radar_subscription_topics }}"
    RADAR_HEURISTIC_ZSCORE_THRESHOLD: "{{ radar_heuristic_zscore_threshold }}"
    ENVIRONMENT: "{{ radar_environment }}"
  emqx-main:
    EMQX_SECURITY_CFG_HASH: "{{ (lookup('file', stack_source_dir ~ '/emqx-security.hocon') | hash('sha1'))[:12] }}"
    EMQX_DASHBOARD__DEFAULT_USERNAME: "{{ emqx_dashboard_username }}"
    EMQX_DASHBOARD__DEFAULT_PASSWORD: "{{ emqx_dashboard_password }}"
  oauth2-proxy:
    OAUTH2_PROXY_PROVIDER: github
    OAUTH2_PROXY_CLIENT_ID: "{{ oauth2_client_id }}"
    OAUTH2_PROXY_CLIENT_SECRET: "{{ oauth2_client_secret }}"
    OAUTH2_PROXY_COOKIE_SECRET: "{{ oauth2_cookie_secret }}"
    OAUTH2_PROXY_GITHUB_ORG: "{{ oauth2_github_org | default('') }}"
    OAUTH2_PROXY_GITHUB_USERS: "{{ oauth2_github_users | default('') }}"
    OAUTH2_PROXY_SCOPE: user:email read:org
    OAUTH2_PROXY_EMAIL_DOMAINS: '*'
    OAUTH2_PROXY_COOKIE_DOMAINS: ".{{ ingress_base_domain }}"
    OAUTH2_PROXY_WHITELIST_DOMAINS: ".{{ ingress_base_domain }}"
    OAUTH2_PROXY_COOKIE_SECURE: "{{ oauth2_cookie_secure | default('true') }}"
    OAUTH2_PROXY_REDIRECT_URL: "{{ oauth2_redirect_url }}"
    OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
    OAUTH2_PROXY_REVERSE_PROXY: 'true'
    OAUTH2_PROXY_SET_XAUTHREQUEST: 'true'
    OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: 'true'
    OAUTH2_PROXY_UPSTREAMS: static://202

stack_interpolation_environment:
  STACK_NAME: "{{ stack_name }}"
  API_IMAGE: "{{ api_image }}"
  FRONTEND_IMAGE: "{{ frontend_image }}"
  MQTT_PROXY_IMAGE: "{{ mqtt_proxy_image }}"
  TACTIC_IMAGE: "{{ tactic_image }}"
  MQTT_RADAR_IMAGE: "{{ mqtt_radar_image }}"
  DB_SYNC_IMAGE: "{{ db_sync_image }}"
  TRAEFIK_DYNAMIC_HASH: "{{ (lookup('template', stack_source_dir ~ '/traefik-dynamic.yml.j2') | hash('sha1'))[:12] }}"
  LANDING_PAGE_HASH: "{{ (lookup('template', stack_source_dir ~ '/landing.html.j2') | hash('sha1'))[:12] }}"
  EMQX_SECURITY_CFG_HASH: "{{ (lookup('file', stack_source_dir ~ '/emqx-security.hocon') | hash('sha1'))[:12] }}"
  POSTGRES_PORT: "{{ postgres_port }}"
  BACKEND_PORT: "{{ backend_port }}"
  FRONTEND_PORT: "{{ frontend_port }}"
  TAILSCALE_AMBIBOX_NFS_ADDR: "{{ ambibox_nfs_addr | default('') }}"
  TAILSCALE_AMBIBOX_NFS_EXPORT: "{{ stack_dir ~ '/tailscale-ambibox-data' }}"
  TAILSCALE_AMBIBOX_NFS_OPTS: rw,nfsvers=4,hard,timeo=150,retrans=3
  TAILSCALE_AMBIBOX_NFS_VOLUME_ID: "{{ (stack_nfs_spec | hash('sha256'))[:12] }}"
  POSTGRES_IMAGE: "{{ release.images.postgres if offkey_env == 'prod' else none }}"
  EMQX_IMAGE: "{{ release.images.emqx if offkey_env == 'prod' else none }}"
  GOST_IMAGE: "{{ release.images.gost if offkey_env == 'prod' else none }}"
  SOCKET_PROXY_IMAGE: "{{ release.images.socket_proxy if offkey_env == 'prod' else none }}"
  TAILSCALE_IMAGE: "{{ release.images.tailscale if offkey_env == 'prod' else none }}"
  TRAEFIK_IMAGE: "{{ release.images.traefik if offkey_env == 'prod' else none }}"
  OAUTH2_IMAGE: "{{ release.images.oauth2 if offkey_env == 'prod' else none }}"
  CLOUDFLARED_IMAGE: "{{ release.images.cloudflared if offkey_env == 'prod' else none }}"
  LANDING_IMAGE: "{{ release.images.landing if offkey_env == 'prod' else none }}"

stack_nfs_spec: "{{ (ambibox_nfs_addr | default('')) ~ '|' ~ stack_dir ~ '/tailscale-ambibox-data|rw,nfsvers=4,hard,timeo=150,retrans=3' }}"
