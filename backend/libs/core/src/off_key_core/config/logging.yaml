version: 1
disable_existing_loggers: false

formatters:
  simple:
    format: '%(asctime)s - %(levelname)s - %(name)s - %(message)s'

  detailed:
    (): 'off_key_core.config.logs.KeyValueFormatter'
    format: '%(asctime)s - %(levelname)s - %(name)s - [CID: %(correlation_id)s] - %(message)s'

  json:
    (): 'off_key_core.config.logs.JsonFormatter'

  truncated:
    (): 'off_key_core.config.logs.TruncatingFormatter'
    base_format: '%(asctime)s - %(levelname)s - %(name)s - [CID: %(correlation_id)s] - %(message)s'
    truncate_length: ${LOG_TRUNCATE_LENGTH:150}

filters:
  correlation:
    (): 'off_key_core.config.logs.CorrelationFilter'

handlers:
  console:
    class: logging.StreamHandler
    level: ${LOG_LEVEL:INFO}
    formatter: detailed
    stream: ext://sys.stdout
    filters: [correlation]

  console_truncated:
    class: logging.StreamHandler
    level: ${LOG_LEVEL:INFO}
    formatter: truncated
    stream: ext://sys.stdout
    filters: [correlation]

root:
  level: ${LOG_LEVEL:INFO}
  handlers: [console]

loggers:
  truncated:
    level: ${SERVICE_LOG_LEVEL:${LOG_LEVEL:INFO}}
    handlers: [console_truncated]
    propagate: false

  sqlalchemy.engine.Engine:
    level: ${SQLALCHEMY_LOG_LEVEL:WARNING}
    handlers: [console_truncated]
    propagate: false

  sqlalchemy.dialects:
    level: ${SQLALCHEMY_LOG_LEVEL:WARNING}
    handlers: [console_truncated]
    propagate: false

  sqlalchemy.pool:
    level: ${SQLALCHEMY_LOG_LEVEL:WARNING}
    handlers: [console_truncated]
    propagate: false

  sqlalchemy.orm:
    level: ${SQLALCHEMY_LOG_LEVEL:WARNING}
    handlers: [console_truncated]
    propagate: false
