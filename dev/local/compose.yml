# Uses the real application images and services with isolated local state.
# Requires Docker Compose 2.24.4 or later for !override.
x-broker-fixture-broker: &broker-fixture-broker
  image: eclipse-mosquitto:2.0
  command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
  volumes:
    - ./dev/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  networks:
    - app-network
  restart: unless-stopped
  profiles:
    - broker-fixture
  healthcheck:
    test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "_fixture/health", "-n"]
    interval: 10s
    timeout: 3s
    retries: 10

services:
  frontend:
    container_name: !reset null
    build:
      target: production
      args:
        VITE_LOCAL_ADMIN_EMAIL: "${SUPERUSER_MAIL:-admin@example.com}"
    environment: !override
      API_UPSTREAM: api-gateway:8000
    develop: !reset null
    ports: !override
      - "127.0.0.1:${LOCAL_FRONTEND_PORT:-5174}:5173"

  api-gateway:
    container_name: !reset null
    command:
      [
        "uvicorn",
        "off_key_api_gateway.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    develop: !reset null
    ports: !override
      - "127.0.0.1:${LOCAL_API_PORT:-8002}:8000"

  tactic-middleware:
    container_name: !reset null
    # Ephemeral cleanup is host-wide; this deployment owns only its DB records.
    environment:
      TACTIC_RADAR_WORKLOAD_LIFECYCLE: persistent
      SYSTEM_LIVE_ENABLED: "${SYSTEM_LIVE_ENABLED:-true}"
      SYSTEM_LIVE_ALLOWED_HOSTS: '${SYSTEM_LIVE_ALLOWED_HOSTS:-["source-broker","fixture-broker-campus","fixture-broker-production","fixture-broker-greenhouse","fixture-broker-meter","fixture-broker-weather","fixture-broker-pump"]}'
    ports: !override
      - "127.0.0.1:${LOCAL_TACTIC_PORT:-8003}:8000"

  mqtt-radar:
    container_name: !reset null

  mqtt-proxy:
    container_name: !reset null

  mqtt-simulator:
    container_name: !reset null
    environment:
      SIMULATOR_WORKSHOP_ENABLED: "${SIMULATOR_WORKSHOP_ENABLED:-true}"

  db-sync:
    container_name: !reset null
    develop: !reset null

  timescaledb:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-5433}:5432"

  socket-proxy:
    container_name: !reset null
    # Official released proxy; avoid the moving Docker Hub latest image.
    image: "${LOCAL_SOCKET_PROXY_IMAGE:-ghcr.io/tecnativa/docker-socket-proxy:v0.4.2}"

  mailpit:
    container_name: !reset null
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes: !override
      - local_mailpit_data:/data
    ports: !override
      - "127.0.0.1:${LOCAL_MAILPIT_PORT:-8026}:8025"
      - "127.0.0.1:${LOCAL_SMTP_PORT:-1026}:1025"

  emqx-main:
    volumes: !override
      - ./dev/local/state/emqx-api-keys:/opt/emqx/etc/dev-api-keys:ro
      - local_emqx_data:/opt/emqx/data
    ports: !override
      - "127.0.0.1:${LOCAL_MQTT_PORT:-1885}:1883"
      - "127.0.0.1:${LOCAL_MQTT_WS_PORT:-8085}:8083"
      - "127.0.0.1:${LOCAL_MQTT_WSS_PORT:-8086}:8084"
      - "127.0.0.1:${LOCAL_MQTT_TLS_PORT:-8885}:8883"
      - "127.0.0.1:${LOCAL_EMQX_PORT:-18084}:18083"

  source-broker:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${LOCAL_SOURCE_MQTT_PORT:-1886}:1883"

  fixture-broker-campus:
    <<: *broker-fixture-broker

  fixture-broker-production:
    <<: *broker-fixture-broker

  fixture-broker-greenhouse:
    <<: *broker-fixture-broker

  fixture-broker-meter:
    <<: *broker-fixture-broker

  fixture-broker-weather:
    <<: *broker-fixture-broker

  fixture-broker-pump:
    <<: *broker-fixture-broker

  broker-fixture-publisher:
    build:
      context: ./backend/
      args:
        SERVICE_NAME: off-key-mqtt-simulator
        SERVICE_ROOT: services/mqtt/simulator
    image: "${MQTT_SIMULATOR_IMAGE:-off-key-mqtt-simulator:latest}"
    command: ["/app/bin/python", "/opt/broker_fixture.py", "--publish"]
    volumes:
      - ./dev/local/broker_fixture.py:/opt/broker_fixture.py:ro
    networks:
      - app-network
    profiles:
      - broker-fixture
    restart: unless-stopped
    depends_on:
      fixture-broker-campus:
        condition: service_healthy
      fixture-broker-production:
        condition: service_healthy
      fixture-broker-greenhouse:
        condition: service_healthy
      fixture-broker-meter:
        condition: service_healthy
      fixture-broker-weather:
        condition: service_healthy
      fixture-broker-pump:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/bin/python
        - -c
        - "import pathlib,time; assert time.time()-float(pathlib.Path('/tmp/broker-fixture.ready').read_text()) < 20"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  local_mailpit_data:
  local_emqx_data:
