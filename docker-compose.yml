# Environment and healthcheck blocks shared by the backend services.
x-runtime-env: &runtime-env
  ENVIRONMENT: "${ENVIRONMENT}"
  DEBUG: "${DEBUG}"
x-logging-env: &logging-env
  LOG_LEVEL: "${LOG_LEVEL}"
  LOG_FORMAT: "${LOG_FORMAT}"
  LOG_REDACT_PII: "${LOG_REDACT_PII}"
  LOG_PII_DEBUG_UNMASK: "${LOG_PII_DEBUG_UNMASK}"
x-database-env: &database-env
  POSTGRES_USER: "${POSTGRES_USER}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  POSTGRES_DB: "${POSTGRES_DB}"
  POSTGRES_HOST: "${POSTGRES_HOST}"
  POSTGRES_PORT: "${POSTGRES_PORT}"
x-auth-env: &auth-env
  JWT_SECRET: "${JWT_SECRET}"
  ALGORITHM: "${ALGORITHM}"
  ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES}"
  SUPERUSER_MAIL: "${SUPERUSER_MAIL}"
x-email-env: &email-env
  FRONTEND_BASE_URL: "${FRONTEND_BASE_URL}"
  EMAIL_USERNAME: "${EMAIL_USERNAME}"
  EMAIL_PASSWORD: "${EMAIL_PASSWORD}"
  EMAIL_FROM: "${EMAIL_FROM}"
  SMTP_SERVER: "${SMTP_SERVER}"
  SMTP_PORT: "${SMTP_PORT}"
  MAIL_STARTTLS: "${MAIL_STARTTLS}"
  MAIL_SSL_TLS: "${MAIL_SSL_TLS}"
  USE_CREDENTIALS: "${USE_CREDENTIALS}"
  VALIDATE_CERTS: "${VALIDATE_CERTS}"
  ANOMALY_ALERT_RECIPIENTS: "${ANOMALY_ALERT_RECIPIENTS}"
# The API serves the domain and the TACTIC worker runs it in the background;
# both read the same domain settings.
x-tactic-env: &tactic-env
  TACTIC_RADAR_DEFAULT_MQTT_USERNAME: "${TACTIC_RADAR_DEFAULT_MQTT_USERNAME:-}"
  SYSTEM_LIVE_ENABLED: "${SYSTEM_LIVE_ENABLED:-false}"
  SYSTEM_COLLECTION_ENABLED: "${SYSTEM_COLLECTION_ENABLED:-true}"
  SYSTEM_COLLECTION_MQTT_USERNAME: "${SYSTEM_COLLECTION_MQTT_USERNAME:-}"
  SYSTEM_COLLECTION_MQTT_API_KEY: "${SYSTEM_COLLECTION_MQTT_API_KEY:-}"
  SYSTEM_COLLECTION_MQTT_CA_FILE: "${SYSTEM_COLLECTION_MQTT_CA_FILE:-}"
  SYSTEM_LIVE_CONNECT_TIMEOUT_SECONDS: "${SYSTEM_LIVE_CONNECT_TIMEOUT_SECONDS:-15}"
  SYSTEM_LIVE_ALLOWED_HOSTS: "${SYSTEM_LIVE_ALLOWED_HOSTS:-[]}"
  SYSTEM_LIVE_CREDENTIALS: "${SYSTEM_LIVE_CREDENTIALS:-}"
  SYSTEM_LIVE_SOCKS_PROXIES: "${SYSTEM_LIVE_SOCKS_PROXIES:-}"
  SYSTEM_LIVE_DATA_SOURCE: "${SYSTEM_LIVE_DATA_SOURCE:-broker}"
  SYSTEM_BROKER_ROUTES: "${SYSTEM_BROKER_ROUTES:-[]}"
  SYSTEM_HTTP_ALLOWED_ORIGINS: "${SYSTEM_HTTP_ALLOWED_ORIGINS:-[]}"
  SYSTEM_HTTP_CREDENTIALS: "${SYSTEM_HTTP_CREDENTIALS:-}"
  SYSTEM_HTTP_MIN_POLL_SECONDS: "${SYSTEM_HTTP_MIN_POLL_SECONDS:-1}"
  TACTIC_RADAR_DEFAULT_MQTT_BROKER_HOST: "${TACTIC_RADAR_DEFAULT_MQTT_BROKER_HOST}"
  TACTIC_RADAR_DEFAULT_MQTT_BROKER_PORT: "${TACTIC_RADAR_DEFAULT_MQTT_BROKER_PORT}"
  TACTIC_RADAR_DEFAULT_MQTT_USE_TLS: "${TACTIC_RADAR_DEFAULT_MQTT_USE_TLS}"
  TACTIC_RADAR_DEFAULT_MQTT_USE_AUTH: "${TACTIC_RADAR_DEFAULT_MQTT_USE_AUTH}"
  TACTIC_RADAR_WORKLOAD_LIFECYCLE: "${TACTIC_RADAR_WORKLOAD_LIFECYCLE}"
  TACTIC_RADAR_DEFAULT_MEMORY_LIMIT_MB: "${TACTIC_RADAR_DEFAULT_MEMORY_LIMIT_MB:-384}"
  TACTIC_RADAR_DEFAULT_MAX_QUEUE_SIZE: "${TACTIC_RADAR_DEFAULT_MAX_QUEUE_SIZE:-256}"
  TACTIC_RADAR_MAX_ACTIVE_MONITORS: "${TACTIC_RADAR_MAX_ACTIVE_MONITORS:-20}"
  TACTIC_PIPELINE_AUTHORING_ENABLED: "${TACTIC_PIPELINE_AUTHORING_ENABLED:-false}"
  TACTIC_PIPELINE_PREFLIGHT_TIMEOUT_SECONDS: "${TACTIC_PIPELINE_PREFLIGHT_TIMEOUT_SECONDS:-90}"
  TACTIC_PIPELINE_HEARTBEAT_TIMEOUT_SECONDS: "${TACTIC_PIPELINE_HEARTBEAT_TIMEOUT_SECONDS:-120}"
  TACTIC_PIPELINE_PHASE_TIMEOUT_SECONDS: "${TACTIC_PIPELINE_PHASE_TIMEOUT_SECONDS:-900}"
  TACTIC_PIPELINE_MAX_CONCURRENT_PREFLIGHTS: "${TACTIC_PIPELINE_MAX_CONCURRENT_PREFLIGHTS:-2}"
  TACTIC_PIPELINE_MAX_CONCURRENT_TRANSITIONS: "${TACTIC_PIPELINE_MAX_CONCURRENT_TRANSITIONS:-8}"
  TACTIC_POOL_MEMORY_LIMIT: "${TACTIC_POOL_MEMORY_LIMIT:-512m}"
  # The RADAR pool's runtime: monitors are pinned to it and only a pool replica
  # running the same image claims them.
  TACTIC_RADAR_IMAGE: "${MQTT_RADAR_IMAGE:-off-key-mqtt-radar:latest}"
  # Handed to RADAR workers and preflight jobs; empty without the forecast profile.
  TACTIC_FORECAST_API_URL: "${FORECAST_API_URL:-}"
x-backend-healthcheck: &backend-healthcheck
  interval: 5s
  timeout: 5s
  retries: 20
  start_period: 10s

services:
### =============================================== ###
###               INTERNAL SERVICES                 ###
### =============================================== ###
  frontend:
    build:
      context: ./frontend
      target: development
    image: "${FRONTEND_IMAGE:-off-key-frontend:latest}"
    environment:
      - "API_PROXY_TARGET=${API_PROXY_TARGET:-${VITE_API_URL:-http://api-gateway:8000}}"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  api-gateway:
    build:
      context: ./backend/
      args:
        SERVICE_NAME: off-key-api-gateway
        SERVICE_ROOT: services/api/gateway
        SERVICE_DEPENDENCIES: services/middleware/tactic
    image: "${API_GATEWAY_IMAGE:-off-key-api-gateway:latest}"
    environment:
      <<: [*runtime-env, *logging-env, *database-env, *auth-env, *email-env, *tactic-env]
      APP_NAME: "${APP_NAME}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
      ENABLE_REQUEST_LOGGING: "${ENABLE_REQUEST_LOGGING}"
      ENABLE_PERFORMANCE_LOGGING: "${ENABLE_PERFORMANCE_LOGGING}"
    depends_on:
      timescaledb:
        condition: service_healthy
      db-sync:
        condition: service_healthy
    # Live views and broker checks reach brokers.
    networks:
      - app-network
      - emqx-network
    restart: always
    healthcheck:
      <<: *backend-healthcheck
      test:
        - "CMD"
        - "/app/bin/python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
    # Clients reach the API under /api, which the proxy strips; the root path
    # puts that prefix in the OpenAPI `servers` entry and keeps /api/docs working.
    command: ["uvicorn", "off_key_api_gateway.main:app",
              "--host", "0.0.0.0", "--port", "8000", "--root-path", "/api"]

  tactic-middleware:
    build:
      context: ./backend/
      args:
        SERVICE_NAME: off-key-tactic-middleware
        SERVICE_ROOT: services/middleware/tactic
    image: "${TACTIC_MIDDLEWARE_IMAGE:-off-key-tactic-middleware:latest}"
    depends_on:
      timescaledb:
        condition: service_healthy
      db-sync:
        condition: service_healthy
    networks:
      - app-network
      - emqx-network
    environment:
      <<: [*runtime-env, *logging-env, *database-env, *auth-env, *email-env, *tactic-env]
    restart: always
    healthcheck:
      <<: *backend-healthcheck
      test:
        - "CMD"
        - "/app/bin/python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"
    command: [ "/app/bin/python", "-m", "off_key_tactic_middleware" ]

  mqtt-radar:
    # The RADAR pool: each replica leases monitors and preflight jobs from the
    # database and runs each as a child process. Children inherit this
    # environment, so the database and the checkpoint secret stay here.
    build:
      context: ./backend/
      args:
        SERVICE_NAME: off-key-mqtt-radar
        SERVICE_ROOT: services/mqtt/radar
    image: "${MQTT_RADAR_IMAGE:-off-key-mqtt-radar:latest}"
    environment:
      <<: [*runtime-env, *logging-env, *database-env]
      RADAR_POOL_RUNTIME: "${MQTT_RADAR_IMAGE:-off-key-mqtt-radar:latest}"
      RADAR_POOL_CAPACITY: "${RADAR_POOL_CAPACITY:-8}"
      RADAR_CHECKPOINT_SECRET: "${RADAR_CHECKPOINT_SECRET:-off-key-development-checkpoints-change-before-production}"
    command: [ "/app/bin/python", "-m", "off_key_mqtt_radar.pool" ]
    depends_on:
      db-sync:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    # Monitors read the stored telemetry log; preflight jobs reach the forecast
    # service. Nothing here reaches a broker.
    networks:
      - app-network
    restart: always
    healthcheck:
      <<: *backend-healthcheck
      test:
        - "CMD"
        - "/app/bin/python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8030/health', timeout=2)"
    deploy:
      replicas: ${RADAR_POOL_REPLICAS:-1}

  dojo-worker:
    # Replays Dojo runs from the RADAR image; each replica runs one at a time.
    build:
      context: ./backend/
      args:
        SERVICE_NAME: off-key-mqtt-radar
        SERVICE_ROOT: services/mqtt/radar
    image: "${MQTT_RADAR_IMAGE:-off-key-mqtt-radar:latest}"
    environment:
      <<: [*runtime-env, *logging-env, *database-env]
      DOJO_MEMORY_LIMIT_MB: "${DOJO_MEMORY_LIMIT_MB:-1024}"
      FORECAST_API_URL: "${FORECAST_API_URL:-}"
    command: [ "/app/bin/python", "-m", "off_key_mqtt_radar.dojo" ]
    depends_on:
      db-sync:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - app-network
    restart: always
    deploy:
      replicas: ${DOJO_WORKER_REPLICAS:-2}

  forecast:
    # Pretrained forecasting models (Timestral) for forecaster steps. Opt-in,
    # because its image carries CPU torch: start the `forecast` profile and set
    # FORECAST_API_URL=http://forecast:8020. No token on a development machine.
    build:
      context: ./backend/
      args:
        SERVICE_NAME: off-key-forecast
        SERVICE_ROOT: services/forecast/service
    image: "${FORECAST_IMAGE:-off-key-forecast:latest}"
    environment:
      <<: [*runtime-env, *logging-env]
    command: [ "/app/bin/python", "-m", "off_key_forecast" ]
    volumes:
      # Downloaded weights outlive the container.
      - forecast_models:/models
    networks:
      - app-network
    restart: always
    healthcheck:
      <<: *backend-healthcheck
      test:
        - "CMD"
        - "/app/bin/python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8020/health/live', timeout=2)"
    profiles:
      - forecast

  mqtt-proxy:
    build:
      context: ./backend/
      args:
        SERVICE_NAME: off-key-mqtt-proxy
        SERVICE_ROOT: services/mqtt/proxy
    image: "${MQTT_PROXY_IMAGE:-off-key-mqtt-proxy:latest}"
    environment:
      <<: [*runtime-env, *logging-env, *database-env]
      MQTT_USERNAME: "${MQTT_USERNAME:-}"
      MQTT_APIKEY: "${MQTT_APIKEY:-}"
      MQTT_CA_FILE: "${MQTT_CA_FILE:-}"
      MQTT_USE_TLS: "${MQTT_USE_TLS}"
      MQTT_USE_AUTH: "${MQTT_USE_AUTH}"
      MQTT_BROKER_HOST: "${MQTT_BROKER_HOST:-emqx-main}"
      MQTT_BROKER_PORT: "${MQTT_BROKER_PORT:-1883}"
      MQTT_TELEMETRY_ENABLED: "true"
    command: [ "/app/bin/python", "-m", "off_key_mqtt_proxy" ]
    depends_on:
      db-sync:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      emqx-main:
        condition: service_healthy
      source-broker:
        condition: service_started
    networks:
      - app-network
      - emqx-network
    restart: always
    healthcheck:
      <<: *backend-healthcheck
      test:
        - "CMD"
        - "/app/bin/python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8010/ready', timeout=2)"

  db-sync:
    build:
      context: ./backend/
      args:
        SERVICE_ROOT: services/db/sync
        SERVICE_NAME: off-key-db-sync
    image: "${DB_SYNC_IMAGE:-off-key-db-sync:latest}"
    environment:
      <<: [*runtime-env, *logging-env, *database-env]
      SYNC_API_HOST: "${SYNC_API_HOST}"
      SYNC_API_PORT: "${SYNC_API_PORT}"
      TELEMETRY_RETENTION_DAYS: "${TELEMETRY_RETENTION_DAYS}"
      TELEMETRY_STORAGE_CAP_GB: "${TELEMETRY_STORAGE_CAP_GB:-}"
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - app-network
    restart: always
    healthcheck:
      <<: *backend-healthcheck
      test:
        - "CMD"
        - "/app/bin/python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8009/ready/schema', timeout=2)"
    command: [ "/app/bin/python", "-m", "off_key_db_sync" ]

### =============================================== ###
###            THIRD-PARTY DEPENDENCIES             ###
### =============================================== ###
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    environment:
      - "POSTGRES_USER=${POSTGRES_USER}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
      - "POSTGRES_DB=${POSTGRES_DB}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    volumes:
      - ./data:/data

    networks:
      - app-network

  emqx-main:
    image: emqx/emqx:6.3.2 # BSL license starting at 5.9!
    hostname: emqx-main
    environment:
      # Local single-node default. See docker-compose.cluster.yml for two-node mode.
      - "EMQX_NODE_NAME=emqx@emqx-main"
      - "EMQX_NODE__COOKIE=${EMQX_NODE_COOKIE:-off-key-emqx-cookie-change-me}"
      - "EMQX_CLUSTER__DISCOVERY_STRATEGY=static"
      - "EMQX_CLUSTER__STATIC__SEEDS=[emqx@emqx-main]"
      # See https://github.com/emqx/emqx/issues/8627#issuecomment-2833234761
      # Only works on fresh boot (no data volume!)
      - "EMQX_DASHBOARD__DEFAULT_USERNAME=${EMQX_DASHBOARD_USERNAME:-admin}"
      - "EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_DASHBOARD_PASSWORD:?EMQX_DASHBOARD_PASSWORD must be set}"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:18083/status" ]
      interval: 5s
      timeout: 25s
      retries: 5
      start_period: 60s
    networks:
      - emqx-network
      - app-network
    # volumes:
    #   - $PWD/emqx1_data:/opt/emqx/data

  broker-route:
    # Development SOCKS endpoint stands in for a deployment's broker route sidecar.
    image: gogost/gost:3.3.3
    command: ["-L=socks5://:1055"]
    networks:
      - emqx-network
      - app-network
    restart: unless-stopped

  source-broker:
    image: eclipse-mosquitto:2.0
    command: [ "mosquitto", "-c", "/mosquitto/config/mosquitto.conf" ]
    volumes:
      - ./dev/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      app-network:
        aliases:
          - source-broker
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
  emqx-network:
    driver: bridge

volumes:
  postgres_data:
  forecast_models:
