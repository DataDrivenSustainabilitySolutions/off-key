version: 1
disable_existing_loggers: false

# Service-specific logger configurations
loggers:
  off_key_tactic_middleware:
    level: ${TACTIC_LOG_LEVEL:${SERVICE_LOG_LEVEL:${LOG_LEVEL:INFO}}}
    handlers: [console]
    propagate: false

  # FastAPI/Uvicorn loggers
  uvicorn:
    level: ${UVICORN_LOG_LEVEL:INFO}
    handlers: [console]
    propagate: false

  uvicorn.access:
    level: ${UVICORN_ACCESS_LOG_LEVEL:WARNING}
    handlers: [console]
    propagate: false

  fastapi:
    level: ${FASTAPI_LOG_LEVEL:INFO}
    handlers: [console]
    propagate: false

  # Docker library logger
  docker:
    level: ${DOCKER_LOG_LEVEL:WARNING}
    handlers: [console]
    propagate: false
