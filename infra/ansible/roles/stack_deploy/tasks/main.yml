---
# Runs on the manager node only. Ingress verification is in verify.yml and must
# run after the playbook's persistence restore stage.

- name: Resolve the production service model
  include_tasks: model.yml

- name: Select a static update only against a verified unchanged runtime
  include_tasks: static_select.yml

- name: Update static services while keeping application writers running
  include_tasks: static_apply.yml
  when: release_static_only | bool

- name: Run the complete application cutover
  when: not (release_static_only | bool)
  block:
    - name: Refuse unexpected persistence transitions before any release cutover
      include_role:
        name: persistence_switch
        tasks_from: preflight

    - name: Prepare schema and retire active monitor workers
      include_tasks: maintenance.yml

    - name: Remove the per-monitor services an earlier TACTIC created
      include_tasks: tactic_workers_retire.yml

    - name: Stop services this release replaces before their successors start
      include_tasks: replaced.yml

    - name: Deploy and restore the production service model
      include_tasks: apply.yml

    - name: Show deploy output
      debug:
        msg: "{{ stack_deploy_result.stdout_lines }}"

    - name: Retire obsolete production services
      include_tasks: retire.yml

    - name: Show service status
      command: docker service ls --filter name={{ stack_name }}
      register: svc_list
      changed_when: false

    - name: Print service status
      debug:
        msg: "{{ svc_list.stdout_lines }}"
