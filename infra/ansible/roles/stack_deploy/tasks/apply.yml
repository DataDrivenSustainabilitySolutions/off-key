---
- name: Deploy and restore while application writers are stopped
  block:
    - name: Detect persistence transitions and capture state
      include_role:
        name: persistence_switch

    - name: Hold application replicas at zero in the cutover model
      template:
        src: cutover.json.j2
        dest: "{{ stack_dir }}/persistence-cutover.json"
        mode: "0600"
      when: persistence_flips | length > 0
      no_log: true

    - name: Keep the existing browser bundle while updating backend contracts
      template:
        src: backend-first.json.j2
        dest: "{{ stack_dir }}/backend-first.json"
        mode: "0600"
      when: "'frontend' in stack_compose_model.services"
      no_log: true

    - name: Deploy the resolved Docker Swarm model
      command:
        argv:
          - docker
          - stack
          - deploy
          - -c
          - "{{ stack_dir }}/{{ 'persistence-cutover.json' if persistence_flips | length > 0 else ('backend-first.json' if 'frontend' in stack_compose_model.services else 'deployment-model.json') }}"
          - --with-registry-auth
          - "{{ stack_name }}"
      register: stack_deploy_result
      changed_when: true

    - name: Restore into the confirmed replacement tasks
      include_role:
        name: persistence_switch
        tasks_from: restore

    # With a frontend in the model, the backend convergence check below waits for
    # these services and fails the deployment when one does not converge. A model
    # without a frontend has no such check, so there the scale call itself waits.
    - name: Resume desired stack services after successful restoration
      include_role:
        name: swarm_scale
      vars:
        swarm_scale_detach: "{{ 'frontend' in stack_compose_model.services }}"
        swarm_scale_replicas: "{{ stack_resume_replicas | from_json }}"
        stack_resume_replicas: >-
          {% set replicas = {} %}
          {% for name, service in stack_compose_model.services.items() %}
          {% if name not in ['postgres', 'emqx-main', 'frontend'] and service.deploy.mode | default('replicated') != 'global' %}
          {% set _ = replicas.update({stack_name ~ '_' ~ name: service.deploy.replicas | default(1)}) %}
          {% endif %}
          {% endfor %}
          {{ replicas | to_json }}
      when: persistence_flips | length > 0
      no_log: true

    - name: Resume runtime workers with their original replica counts
      include_role:
        name: swarm_scale
      vars:
        swarm_scale_replicas: "{{ runtime_resume_replicas | from_json }}"
        runtime_resume_replicas: >-
          {% set replicas = {} %}
          {% set stack_services = stack_compose_model.services.keys() | map('regex_replace', '^', stack_name ~ '_') | list %}
          {% for name, count in (persistence_writer_replicas | default({})).items() %}
          {% if name not in stack_services %}
          {% set _ = replicas.update({name: count}) %}
          {% endif %}
          {% endfor %}
          {{ replicas | to_json }}

    - name: Serve backend contracts before activating the browser bundle
      when: "'frontend' in stack_compose_model.services"
      block:
        - name: Wait for the intended backend images without accepting rollbacks
          command:
            argv: [python3, '-', "{{ stack_name }}", "{{ stack_dir }}/deployment-model.json", "{{ release.images.mqtt_radar }}", --backend-first]
            stdin: "{{ lookup('file', playbook_dir ~ '/../scripts/check_swarm.py') }}"
          register: backend_convergence
          changed_when: false
          retries: 60
          delay: 5
          until: backend_convergence.rc == 0

        - name: Require live APIs and catalog readiness before browser cutover
          include_tasks: application_readiness.yml

        - name: Record the backend readiness fence for deployment rehearsal
          copy:
            dest: "{{ stack_dir }}/browser-cutover.json"
            mode: "0600"
            content: >-
              {{ (backend_convergence.stdout_lines | last | from_json)
                 | combine({'backend_ready_at': now(utc=true, fmt='%Y-%m-%dT%H:%M:%S.%fZ'),
                            'target_frontend_image': stack_compose_model.services.frontend.image})
                 | to_nice_json }}

        - name: Activate the browser bundle after backend readiness
          command:
            argv: [docker, stack, deploy, -c, "{{ stack_dir }}/deployment-model.json", --with-registry-auth, "{{ stack_name }}"]
          changed_when: true

    - name: Clear the completed cutover plan
      file:
        path: "{{ stack_dir }}/recovery-pending.json"
        state: absent
      when: persistence_flips | length > 0
  rescue:
    - name: Report the interrupted deployment
      fail:
        msg: >-
          Deployment stopped at '{{ ansible_failed_task.name }}'.
          Backups are in {{ persistence_backup_dir | default('the configured recovery directory') }}.
          Inspect recovery-pending.json and actual writer replica counts before retrying
          or resuming services; backup cancellation or a failed resumption may have
          already restarted some writers.
