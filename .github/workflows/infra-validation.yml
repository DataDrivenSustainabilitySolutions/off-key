name: Infrastructure Validation

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  infra:
    name: infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ""
          sync: "false"
          cache: "false"
      - name: Validate Ansible and render the production stack with synthetic inputs
        env:
          OFFKEY_GOST_SMOKE: "1"
        run: make -C infra check-deploy
