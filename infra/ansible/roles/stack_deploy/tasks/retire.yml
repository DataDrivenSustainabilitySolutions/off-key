---
- name: List production stack services for retirement
  command:
    argv:
      - docker
      - service
      - ls
      - --format
      - '{% raw %}{{.Name}}{% endraw %}'
      - --filter
      - "label=com.docker.stack.namespace={{ stack_name }}"
  register: production_stack_services
  changed_when: false

# stack deploy keeps removed services; broad --prune could delete runtime workers.
- name: Remove retired production services
  command:
    argv: [docker, service, rm, "{{ stack_name }}_{{ item }}"]
  loop:
    - mailpit
    - tailscale-dev-proxy
  when:
    - (stack_name ~ '_' ~ item) in production_stack_services.stdout_lines
