services:
### =============================================== ###
###               INTERNAL SERVICES                 ###
### =============================================== ###
  frontend:
    build:
      context: ./frontend
      target: development
    image: "${FRONTEND_IMAGE:-off-key-frontend:latest}"
    container_name: react_client
    environment:
      - "VITE_API_URL=${VITE_API_URL}"
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json

  api-gateway:
    build:
      context: ./backend/
      args:
        SERVICE_NAME: off-key-api-gateway
        SERVICE_ROOT: services/api/gateway
    image: "${API_GATEWAY_IMAGE:-off-key-api-gateway:latest}"
    container_name: api_gateway
    environment:
      - "SYNC_HOSTNAME=${SYNC_HOSTNAME:-db-sync}"
      - "SYNC_API_PORT=${SYNC_API_PORT:-8009}"
      - "SYNC_SERVICE_SCHEME=${SYNC_SERVICE_SCHEME:-http}"
      - "TACTIC_SERVICE_SCHEME=${TACTIC_SERVICE_SCHEME:-http}"
      - "TACTIC_SERVICE_REQUEST_TIMEOUT_SECONDS=${TACTIC_SERVICE_REQUEST_TIMEOUT_SECONDS:-180}"
      - "APP_NAME=${APP_NAME}"
      - "ENVIRONMENT=${ENVIRONMENT}"
      - "DEBUG=${DEBUG}"
      - "FRONTEND_BASE_URL=${FRONTEND_BASE_URL}"
      - "CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}"
      - "JWT_SECRET=${JWT_SECRET}"
      - "INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET}"
      - "ALGORITHM=${ALGORITHM}"
      - "ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}"
      - "SUPERUSER_MAIL=${SUPERUSER_MAIL}"
      - "EMAIL_USERNAME=${EMAIL_USERNAME}"
      - "EMAIL_PASSWORD=${EMAIL_PASSWORD}"
      - "EMAIL_FROM=${EMAIL_FROM}"
      - "SMTP_SERVER=${SMTP_SERVER}"
      - "SMTP_PORT=${SMTP_PORT}"
      - "MAIL_STARTTLS=${MAIL_STARTTLS}"
      - "MAIL_SSL_TLS=${MAIL_SSL_TLS}"
      - "USE_CREDENTIALS=${USE_CREDENTIALS}"
      - "VALIDATE_CERTS=${VALIDATE_CERTS}"
      - "ANOMALY_ALERT_RECIPIENTS=${ANOMALY_ALERT_RECIPIENTS}"
      - "TACTIC_SERVICE_HOST=${TACTIC_SERVICE_HOST}"
      - "TACTIC_SERVICE_PORT=${TACTIC_SERVICE_PORT}"
      - "LOG_LEVEL=${LOG_LEVEL}"
      - "LOG_FORMAT=${LOG_FORMAT}"
      - "LOG_REDACT_PII=${LOG_REDACT_PII}"
      - "LOG_PII_DEBUG_UNMASK=${LOG_PII_DEBUG_UNMASK}"
      - "ENABLE_REQUEST_LOGGING=${ENABLE_REQUEST_LOGGING}"
      - "ENABLE_PERFORMANCE_LOGGING=${ENABLE_PERFORMANCE_LOGGING}"
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      socket-proxy:
        condition: service_started
      db-sync:
        condition: service_started
      tactic-middleware:
        condition: service_healthy
    networks:
      - app-network
    restart: always
    healthcheck:
      test:
        - "CMD"
        - "/app/bin/python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    command: ["uvicorn", "off_key_api_gateway.main:app",
              "--reload", "--reload-dir", "/app/lib/python3.12/site-packages/off_key_api_gateway",
              "--host", "0.0.0.0", "--port", "8000"]
    develop:
      watch:
        - action: sync
          path: backend/services/api/gateway/src/off_key_api_gateway
          target: /app/lib/python3.12/site-packages/off_key_api_gateway
        - action: rebuild
          path: ./backend/uv.lock

  tactic-middleware:
    build:
      context: ./backend/
      args:
        SERVICE_NAME: off-key-tactic-middleware
        SERVICE_ROOT: services/middleware/tactic
    image: "${TACTIC_MIDDLEWARE_IMAGE:-off-key-tactic-middleware:latest}"
    container_name: tactic_middleware
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      socket-proxy:
        condition: service_started
      db-sync:
        condition: service_healthy
    networks:
      - app-network
      - socket-network
      - emqx-network
    environment:
      - "TACTIC_RADAR_DEFAULT_MQTT_USERNAME=${TACTIC_RADAR_DEFAULT_MQTT_USERNAME:-}"
      - "AMBIBOX_MQTT_USERNAME=${AMBIBOX_MQTT_USERNAME:-}"
      - "AMBIBOX_MQTT_PASSWORD=${AMBIBOX_MQTT_PASSWORD:-}"
      - "ENVIRONMENT=${ENVIRONMENT}"
      - "DEBUG=${DEBUG}"
      - "FRONTEND_BASE_URL=${FRONTEND_BASE_URL}"
      - "JWT_SECRET=${JWT_SECRET}"
      - "INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?Set INTERNAL_API_SECRET}"
      - "ALGORITHM=${ALGORITHM}"
      - "ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}"
      - "SUPERUSER_MAIL=${SUPERUSER_MAIL}"
      - "POSTGRES_USER=${POSTGRES_USER}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
      - "POSTGRES_DB=${POSTGRES_DB}"
      - "POSTGRES_HOST=${POSTGRES_HOST}"
      - "POSTGRES_PORT=${POSTGRES_PORT}"
      - "AMBIBOX_INGRESS_ENABLED=${AMBIBOX_INGRESS_ENABLED}"
      - "AMBIBOX_ALLOWED_HOSTS=${AMBIBOX_ALLOWED_HOSTS}"
      - "AMBIBOX_ALLOWED_HOST_SUFFIXES=${AMBIBOX_ALLOWED_HOST_SUFFIXES}"
      - "AMBIBOX_EMQX_API_URL=${AMBIBOX_EMQX_API_URL}"
      - "AMBIBOX_EMQX_API_KEY=${AMBIBOX_EMQX_API_KEY}"
      - "AMBIBOX_EMQX_API_SECRET=${AMBIBOX_EMQX_API_SECRET}"
      - "AMBIBOX_GOST_API_URL=${AMBIBOX_GOST_API_URL}"
      - "AMBIBOX_GOST_USERNAME=${AMBIBOX_GOST_USERNAME}"
      - "AMBIBOX_GOST_PASSWORD=${AMBIBOX_GOST_PASSWORD}"
      - "AMBIBOX_SOCKS_SERVER=${AMBIBOX_SOCKS_SERVER}"
      - "TACTIC_DOCKER_API_URL=${TACTIC_DOCKER_API_URL}"
      - "TACTIC_DOCKER_API_PORT=${TACTIC_DOCKER_API_PORT}"
      - "TACTIC_RADAR_DEFAULT_MQTT_BROKER_HOST=${TACTIC_RADAR_DEFAULT_MQTT_BROKER_HOST}"
      - "TACTIC_RADAR_DEFAULT_MQTT_BROKER_PORT=${TACTIC_RADAR_DEFAULT_MQTT_BROKER_PORT}"
      - "TACTIC_RADAR_DEFAULT_MQTT_USE_TLS=${TACTIC_RADAR_DEFAULT_MQTT_USE_TLS}"
      - "TACTIC_RADAR_DEFAULT_MQTT_USE_AUTH=${TACTIC_RADAR_DEFAULT_MQTT_USE_AUTH}"
      - "TACTIC_RADAR_WORKLOAD_LIFECYCLE=${TACTIC_RADAR_WORKLOAD_LIFECYCLE}"
      - "TACTIC_SERVICE_HOST=${TACTIC_SERVICE_HOST}"
      - "TACTIC_SERVICE_PORT=${TACTIC_SERVICE_PORT}"
      - "LOG_LEVEL=${LOG_LEVEL}"
      - "LOG_FORMAT=${LOG_FORMAT}"
      - "LOG_REDACT_PII=${LOG_REDACT_PII}"
      - "LOG_PII_DEBUG_UNMASK=${LOG_PII_DEBUG_UNMASK}"
      - TACTIC_DOCKER_DEFAULT_NETWORK=${COMPOSE_PROJECT_NAME:-off-key}_app-network
      - TACTIC_RADAR_IMAGE=${MQTT_RADAR_IMAGE:-off-key-mqtt-radar:latest}
    restart: always
    healthcheck:
      test:
        - "CMD"
        - "/app/bin/python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    command: [ "/app/bin/python", "-m", "off_key_tactic_middleware" ]

  mqtt-radar:
    build:
      context: ./backend/
      args:
        SERVICE_NAME: off-key-mqtt-radar
        SERVICE_ROOT: services/mqtt/radar
    image: "${MQTT_RADAR_IMAGE:-off-key-mqtt-radar:latest}"
    container_name: mqtt_radar
    command: [ "/app/bin/python", "-m", "off_key_mqtt_radar" ]
    depends_on:
      timescaledb:
        condition: service_healthy
      tactic-middleware:
        condition: service_healthy
      mqtt-proxy:
        condition: service_healthy
    networks:
      - app-network
      - emqx-network
    restart: always
    environment:
      - "RADAR_MQTT_USERNAME=${RADAR_MQTT_USERNAME:-}"
      - "RADAR_MQTT_API_KEY=${RADAR_MQTT_API_KEY:-}"
      - "RADAR_MQTT_CA_FILE=${RADAR_MQTT_CA_FILE:-}"
      - "ENVIRONMENT=${ENVIRONMENT}"
      - "DEBUG=${DEBUG}"
      - "RADAR_MQTT_BROKER_HOST=${RADAR_MQTT_BROKER_HOST}"
      - "RADAR_MQTT_BROKER_PORT=${RADAR_MQTT_BROKER_PORT}"
      - "RADAR_MQTT_USE_TLS=${RADAR_MQTT_USE_TLS}"
      - "RADAR_MQTT_USE_AUTH=${RADAR_MQTT_USE_AUTH}"
      - "RADAR_SUBSCRIPTION_TOPICS=${RADAR_SUBSCRIPTION_TOPICS}"
      - "LOG_LEVEL=${LOG_LEVEL}"
      - "LOG_FORMAT=${LOG_FORMAT}"
      - "LOG_REDACT_PII=${LOG_REDACT_PII}"
      - "LOG_PII_DEBUG_UNMASK=${LOG_PII_DEBUG_UNMASK}"
      - RADAR_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}
    profiles:
      - standalone-radar

  mqtt-proxy:
    build:
      context: ./backend/
      args:
        SERVICE_NAME: off-key-mqtt-proxy
        SERVICE_ROOT: services/mqtt/proxy
    image: "${MQTT_PROXY_IMAGE:-off-key-mqtt-proxy:latest}"
    container_name: mqtt_proxy
    environment:
      - "MQTT_USERNAME=${MQTT_USERNAME:-}"
      - "MQTT_APIKEY=${MQTT_APIKEY:-}"
      - "MQTT_CA_FILE=${MQTT_CA_FILE:-}"
      - "ENVIRONMENT=${ENVIRONMENT}"
      - "DEBUG=${DEBUG}"
      - "POSTGRES_USER=${POSTGRES_USER}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
      - "POSTGRES_DB=${POSTGRES_DB}"
      - "POSTGRES_HOST=${POSTGRES_HOST}"
      - "POSTGRES_PORT=${POSTGRES_PORT}"
      - "MQTT_USE_TLS=${MQTT_USE_TLS}"
      - "MQTT_USE_AUTH=${MQTT_USE_AUTH}"
      - "AMBIBOX_INGRESS_ENABLED=${AMBIBOX_INGRESS_ENABLED}"
      - "LOG_LEVEL=${LOG_LEVEL}"
      - "LOG_FORMAT=${LOG_FORMAT}"
      - "LOG_REDACT_PII=${LOG_REDACT_PII}"
      - "LOG_PII_DEBUG_UNMASK=${LOG_PII_DEBUG_UNMASK}"
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-emqx-main}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - MQTT_TELEMETRY_ENABLED=true
    command: [ "/app/bin/python", "-m", "off_key_mqtt_proxy" ]
    depends_on:
      db-sync:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      emqx-main:
        condition: service_healthy
      source-broker:
        condition: service_started
    networks:
      - app-network
      - emqx-network
    restart: always
    healthcheck:
      test:
        - "CMD"
        - "/app/bin/python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8010/ready', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - ./logs:/app/logs  # For log persistence

  mqtt-simulator:
    build:
      context: ./backend/
      args:
        SERVICE_NAME: off-key-mqtt-simulator
        SERVICE_ROOT: services/mqtt/simulator
    image: "${MQTT_SIMULATOR_IMAGE:-off-key-mqtt-simulator:latest}"
    container_name: mqtt_simulator
    environment:
      - "SIMULATOR_ENABLED=${SIMULATOR_ENABLED:-true}"
      - "SIMULATOR_BROKER_HOST=${SIMULATOR_BROKER_HOST:-source-broker}"
      - "SIMULATOR_BROKER_PORT=${SIMULATOR_BROKER_PORT:-1883}"
      - "SIMULATOR_USE_TLS=${SIMULATOR_USE_TLS:-false}"
      - "SIMULATOR_USE_AUTH=${SIMULATOR_USE_AUTH:-false}"
      - "SIMULATOR_USERNAME=${SIMULATOR_USERNAME:-}"
      - "SIMULATOR_API_KEY=${SIMULATOR_API_KEY:-}"
      - "SIMULATOR_CLIENT_ID_PREFIX=${SIMULATOR_CLIENT_ID_PREFIX:-offkey-simulator}"
      - "SIMULATOR_INTERVAL_SECONDS=${SIMULATOR_INTERVAL_SECONDS:-1.0}"
      - "SIMULATOR_QOS=${SIMULATOR_QOS:-0}"
      - "SIMULATOR_CHARGER_IDS=${SIMULATOR_CHARGER_IDS:-charger-sim-1,charger-sim-2}"
      - "SIMULATOR_FEATURES=${SIMULATOR_FEATURES:-sine,cosine,random}"
      - "SIMULATOR_TOPIC_TEMPLATE=${SIMULATOR_TOPIC_TEMPLATE:-device/evCharger/{charger_id}/{feature}}"
      - "SIMULATOR_VALUE_MIN=${SIMULATOR_VALUE_MIN:-0.0}"
      - "SIMULATOR_VALUE_MAX=${SIMULATOR_VALUE_MAX:-100.0}"
      - "SIMULATOR_BLIP_PROBABILITY=${SIMULATOR_BLIP_PROBABILITY:-0.0025}"
      - "SIMULATOR_BLIP_MULTIPLIER_MIN=${SIMULATOR_BLIP_MULTIPLIER_MIN:-1.8}"
      - "SIMULATOR_BLIP_MULTIPLIER_MAX=${SIMULATOR_BLIP_MULTIPLIER_MAX:-2.6}"
    command: [ "/app/bin/python", "-m", "off_key_mqtt_simulator" ]
    depends_on:
      source-broker:
        condition: service_started
      mqtt-proxy:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - mqtt-sim

  db-sync:
    build:
      context: ./backend/
      args:
        SERVICE_ROOT: services/db/sync
        SERVICE_NAME: off-key-db-sync
    image: "${DB_SYNC_IMAGE:-off-key-db-sync:latest}"
    container_name: db_sync
    environment:
      - "ENVIRONMENT=${ENVIRONMENT}"
      - "DEBUG=${DEBUG}"
      - "POSTGRES_USER=${POSTGRES_USER}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
      - "POSTGRES_DB=${POSTGRES_DB}"
      - "POSTGRES_HOST=${POSTGRES_HOST}"
      - "POSTGRES_PORT=${POSTGRES_PORT}"
      - "SYNC_HOSTNAME=${SYNC_HOSTNAME}"
      - "SYNC_API_HOST=${SYNC_API_HOST}"
      - "SYNC_API_PORT=${SYNC_API_PORT}"
      - "TELEMETRY_RETENTION_DAYS=${TELEMETRY_RETENTION_DAYS}"
      - "LOG_LEVEL=${LOG_LEVEL}"
      - "LOG_FORMAT=${LOG_FORMAT}"
      - "LOG_REDACT_PII=${LOG_REDACT_PII}"
      - "LOG_PII_DEBUG_UNMASK=${LOG_PII_DEBUG_UNMASK}"
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - app-network
    restart: always
    healthcheck:
      test:
        - "CMD"
        - "/app/bin/python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8009/ready/schema', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    command: [ "/app/bin/python", "-m", "off_key_db_sync" ]
    develop:
      watch:
        - action: sync
          path: backend/services/db/sync/src/off_key_db_sync
          target: /app/lib/python3.12/site-packages/off_key_db_sync
        - action: rebuild
          path: ./backend/uv.lock

### =============================================== ###
###            THIRD-PARTY DEPENDENCIES             ###
### =============================================== ###
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    environment:
      - "POSTGRES_USER=${POSTGRES_USER}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
      - "POSTGRES_DB=${POSTGRES_DB}"
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  socket-proxy:
    container_name: socket_proxy
    image: tecnativa/docker-socket-proxy
    restart: always
    networks:
      - socket-network
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    environment:
      - LOG_LEVEL=info # debug,info,notice,warning,err,crit,alert,emerg
      ## Variables match the URL prefix (i.e. AUTH blocks access to /auth/* parts of the API, etc.).
      # 0 to revoke access.
      # 1 to grant access.
      ## Granted by Default
      - EVENTS=1
      - PING=1
      - VERSION=1
      ## Revoked by Default
      # Security critical
      - AUTH=0
      - SECRETS=0
      - POST=1 # Container(s) Lifecycle Management
      # Not always needed
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - CONTAINERS=1 # Required by TACTIC RADAR container fallback and cleanup.
      - DISTRIBUTION=0
      - EXEC=0
      - IMAGES=1 # Required when TACTIC pulls a missing RADAR image.
      - INFO=1 # Required for Swarm manager detection.
      - NETWORKS=0
      - NODES=0
      - PLUGINS=0
      - SERVICES=1 # Required by TACTIC RADAR Swarm orchestration.
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=1 # Required for Swarm service status checks.
      - VOLUMES=0

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    volumes:
      - ./data:/data
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP port

    networks:
      - app-network

  emqx-main:
    image: emqx/emqx:6.3.1 # BSL license starting at 5.9!
    hostname: emqx-main
    environment:
      # Local single-node default. See docker-compose.cluster.yml for two-node mode.
      - "EMQX_NODE_NAME=emqx@emqx-main"
      - "EMQX_NODE__COOKIE=${EMQX_NODE_COOKIE:-off-key-emqx-cookie-change-me}"
      - "EMQX_CLUSTER__DISCOVERY_STRATEGY=static"
      - "EMQX_CLUSTER__STATIC__SEEDS=[emqx@emqx-main]"
      # See https://github.com/emqx/emqx/issues/8627#issuecomment-2833234761
      # Only works on fresh boot (no data volume!)
      - "EMQX_DASHBOARD__DEFAULT_USERNAME=${EMQX_DASHBOARD_USERNAME:-admin}"
      - "EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_DASHBOARD_PASSWORD:?EMQX_DASHBOARD_PASSWORD must be set}"
      - "EMQX_API_KEY__BOOTSTRAP_FILE=/opt/emqx/etc/dev-api-keys"
    volumes:
      - ./dev/emqx/api-keys:/opt/emqx/etc/dev-api-keys:ro
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:18083/status" ]
      interval: 5s
      timeout: 25s
      retries: 5
      start_period: 60s
    networks:
      - emqx-network
      - app-network
    ports:
      - 1883:1883
      - 8083:8083
      - 8084:8084
      - 8883:8883
      - 18083:18083
    # volumes:
    #   - $PWD/emqx1_data:/opt/emqx/data

  mqtt-tailscale-bridge:
    # Development SOCKS endpoint stands in for the existing vendor tailnet proxy.
    image: gogost/gost:3.3.0
    command:
      - "-api=${AMBIBOX_GOST_USERNAME:-off-key}:${AMBIBOX_GOST_PASSWORD:?Set AMBIBOX_GOST_PASSWORD}@:18080"
      - "-L=socks5://:1055"
    networks:
      - emqx-network
      - app-network
    restart: unless-stopped

  source-broker:
    image: eclipse-mosquitto:2.0
    container_name: source_broker
    command: [ "mosquitto", "-c", "/mosquitto/config/mosquitto.conf" ]
    volumes:
      - ./dev/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:1884:1883"
    networks:
      app-network:
        aliases:
          - source-broker
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
  socket-network:
    driver: bridge
  emqx-network:
    driver: bridge

volumes:
  postgres_data:
