version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "infrastructure"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      # Security fixes for this ecosystem arrive together in one pull request.
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
      - "/dev/docs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
      - "infrastructure"
    commit-message:
      prefix: "docker"
      include: "scope"
    groups:
      # Security fixes for this ecosystem arrive together in one pull request.
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
      container-images:
        patterns:
          - "*"
        exclude-patterns:
          - "python"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:20"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker-compose"
      - "infrastructure"
    commit-message:
      prefix: "docker"
      include: "scope"
    groups:
      # Security fixes for this ecosystem arrive together in one pull request.
      docker-compose-security:
        applies-to: security-updates
        patterns:
          - "*"
      compose-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Security fixes for this ecosystem arrive together in one pull request.
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"
      backend-python:
        patterns:
          - "*"
        exclude-patterns:
          - "ty"
        update-types:
          - "minor"
          - "patch"
      # A ty bump that reports new diagnostics fails only its own PR.
      typing-tools:
        patterns:
          - "ty"

  # Deployment tooling: Ansible and cryptography for ansible-vault.
  - package-ecosystem: "uv"
    directory: "/infra"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:32"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "infrastructure"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Security fixes for this ecosystem arrive together in one pull request.
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"
      infra-python:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:35"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # Security fixes for this ecosystem arrive together in one pull request.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      frontend-npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:40"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "documentation"
    commit-message:
      prefix: "docs"
      include: "scope"
    groups:
      # Security fixes for this ecosystem arrive together in one pull request.
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"
      docs-tooling:
        patterns:
          - "*"
