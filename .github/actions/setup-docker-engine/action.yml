name: Set up the production Docker Engine
description: Replace the runner's Docker Engine with the release production's Swarm nodes run.

runs:
  using: composite
  steps:
    - name: Install the pinned Docker Engine release
      shell: bash
      run: |
        set -euo pipefail
        # One pin for production and CI (infra/tests/test_toolchain.py).
        version="$(sed -n 's/^docker_engine_version: "\(.*\)"$/\1/p' infra/ansible/roles/docker_install/defaults/main.yml)"
        . /etc/os-release
        # Same repository definition as the docker_install role; drop any other copy of it.
        { grep -rlZ download.docker.com /etc/apt/sources.list.d || true; } | xargs -0r sudo rm -f
        sudo install -m 0755 -d /etc/apt/keyrings
        sudo curl -fsSL "https://download.docker.com/linux/$ID/gpg" -o /etc/apt/keyrings/docker.asc
        printf 'Types: deb\nURIs: https://download.docker.com/linux/%s\nSuites: %s\nComponents: stable\nSigned-By: /etc/apt/keyrings/docker.asc\n' \
          "$ID" "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/docker.sources > /dev/null
        sudo apt-get update
        package="$(apt-cache madison docker-ce | awk -v want="5:${version}-" 'index($3, want) == 1 { print $3; exit }')"
        if [ -z "$package" ]; then
          echo "::error::Docker Engine $version is not published for $ID $VERSION_CODENAME"
          exit 1
        fi
        # Hosted runners mix classic and containerd image stores. Their image
        # IDs differ, so producers and consumers of the CI archive must agree.
        sudo python3 - <<'PYTHON'
        import json
        from pathlib import Path

        path = Path("/etc/docker/daemon.json")
        configuration = json.loads(path.read_text()) if path.exists() else {}
        configuration.setdefault("features", {})["containerd-snapshotter"] = False
        path.parent.mkdir(parents=True, exist_ok=True)
        path.write_text(json.dumps(configuration) + "\n")
        PYTHON
        sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends --allow-downgrades \
          "docker-ce=$package" "docker-ce-cli=$package"
        # Package hooks can use up systemd's start burst before this explicit restart.
        sudo systemctl reset-failed docker
        sudo systemctl restart docker
        actual="$(docker version --format '{{.Server.Version}}')"
        if [ "$actual" != "$version" ]; then
          echo "::error::Docker Engine is $actual, expected $version"
          exit 1
        fi
        echo "Docker Engine $actual"
