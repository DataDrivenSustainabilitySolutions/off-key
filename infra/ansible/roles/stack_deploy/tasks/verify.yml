---
# Called last by provision.yml and deploy.yml, after persistence restoration.
# Read-only probes do not publish synthetic telemetry into the production catalog.
- name: Verify the production application after the stack update and restore stage
  block:
    - name: Wait for all stack services to converge without a rollback
      command:
        argv: [python3, '-', "{{ stack_name }}", "{{ stack_dir }}/deployment-model.json"]
        stdin: "{{ lookup('file', playbook_dir ~ '/../scripts/check_swarm.py') }}"
      register: stack_convergence
      changed_when: false
      retries: 60
      delay: 5
      until: stack_convergence.rc == 0

    - name: Wait for database, APIs, catalog application and selected broker routes
      include_tasks: application_readiness.yml

    - name: Report application readiness and upstream broker warnings
      debug:
        msg: "{{ application_readiness.stdout_lines }}"

    - name: Restart the original monitors with fresh calibration
      include_tasks: monitor_job.yml
      vars:
        monitor_action: resume
      when: not (release_static_only | default(false) | bool)

    - name: Verify the stack still runs the exact release images
      command:
        argv: [python3, '-', "{{ stack_name }}", "{{ stack_dir }}/deployment-model.json"]
        stdin: "{{ lookup('file', playbook_dir ~ '/../scripts/check_swarm.py') }}"
      register: restarted_convergence
      changed_when: false
      retries: 60
      delay: 5
      until: restarted_convergence.rc == 0

    - name: Require fresh healthy worker heartbeats without requiring charger traffic
      include_tasks: monitor_job.yml
      vars:
        monitor_action: verify
      when: not (release_static_only | default(false) | bool)

    - name: Require fresh healthy unchanged monitors for a static release
      include_tasks: monitor_job.yml
      vars:
        monitor_action: verify-active
      when: release_static_only | default(false) | bool

    - name: Check the public website, docs and dashboard HTTP responses through Cloudflare
      uri:
        url: "{{ item }}/"
        method: GET
        follow_redirects: none
        status_code: "{{ public_status_codes }}"
        timeout: 10
        headers:
          Cache-Control: no-cache
      register: public_route
      retries: 12
      delay: 5
      until: public_route.status | default(0) in public_status_codes
      loop: "{{ release_public_urls | default(['https://' ~ ingress_base_domain, frontend_base_url, docs_base_url]) }}"
      vars:
        # Documentation must be publicly readable, not redirected to a login.
        public_status_codes: "{{ [200] if item == docs_base_url else [200, 301, 302, 307, 308] }}"

    - name: End application maintenance after successful verification
      include_tasks: monitor_job.yml
      vars:
        monitor_action: finish
      when: not (release_static_only | default(false) | bool)

    - name: Complete the static reservation with unchanged healthy monitor workers
      include_tasks: monitor_job.yml
      vars:
        monitor_action: finish-static
      when: release_static_only | default(false) | bool

    - name: Record the successfully verified release
      copy:
        dest: "{{ stack_dir }}/release.json"
        mode: "0644"
        content: >-
          {{ release | combine({'infrastructure_revision': infrastructure_revision.stdout,
             'verified_at': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')}) | to_nice_json }}
    - name: Remove the completed release operation record
      file:
        path: "{{ stack_dir }}/release-maintenance.json"
        state: absent

    - name: Retain the exact verified model and live specs for future static updates
      command:
        argv: [python3, '-', record, "{{ stack_dir }}", "{{ stack_name }}"]
        stdin: "{{ lookup('file', playbook_dir ~ '/../scripts/static_release.py') }}"
      register: verified_baseline
      # This optional optimization is written after full release verification.
      # A missing baseline selects a full cutover next time.
      failed_when: false
      changed_when: verified_baseline.rc == 0
      no_log: true
  rescue:
    - name: Report application verification failure after deployment
      fail:
        msg: >-
          The stack update was submitted and the persistence restore stage completed,
          but verification failed at '{{ ansible_failed_task.name }}'.
          The last verified release.json has not been changed; release-pending.json
          records the attempted release. No automatic rollback was performed.
          Inspect the failed probe and service logs before retrying.

# Application setup runs once the release is complete, as an ordinary client of
# the released application: catalogue writes are fenced while a release is open.
# A failure here fails the run but never holds a release open, so a retry or the
# next deployment repeats the setup instead of having to recover a release.
- name: Initialize administrator access after the release completes
  include_tasks: bootstrap_admin.yml

- name: Initialize public sources after administrator setup
  include_tasks: bootstrap_demo.yml
  when: demo_mode | default(false) | bool and (administrator_setup.stdout_lines | last | from_json).status == 'configured'
