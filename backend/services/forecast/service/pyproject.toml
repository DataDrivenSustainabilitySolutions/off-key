[project]
name = "off-key-forecast"
version = "0.1.0"
description = "Shared forecast service with pretrained forecasting models for the off-key platform"
authors = [
    { name = "Oliver Hennhoefer", email = "oliver.hennhoefer@mail.de" },
    { name = "Fernando Saba", email = "fernando.saba@gmx.de" }
]
maintainers = [
    { name = "Oliver Hennhoefer", email = "oliver.hennhoefer@mail.de" },
    { name = "Fernando Saba", email = "fernando.saba@gmx.de" }
]
keywords = ["off-key", "forecasting", "foundation model", "anomaly detection"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha"
]

dependencies = [
    "off-key-core[web]",
    "fastapi>=0.115.8",
    "uvicorn>=0.25.0",
    "numpy>=1.24.0",
    "pydantic-settings>=2.7.1",
    # Fetches and caches model weights; the models themselves are optional extras.
    "huggingface-hub>=0.23,<3",
]

[project.optional-dependencies]
# Mistral's Timestral checkpoints (providers/timestral.py). The forecast image
# installs this extra; the test environment stays without torch.
timestral = [
    "timestral",
    "torch>=2.9",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
off-key-core = { workspace = true }
# Not on PyPI; pinned to the release commit.
timestral = { git = "https://github.com/mistralai/timestral.git", rev = "a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff" }
# CPU wheels only: the service forecasts on CPU, and the default index would
# pull the CUDA libraries on Linux.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
