# This broker carries only public normalized data on an internal overlay.
# No ports are published. Only the relay and this demo's TACTIC join the network.
listeners.tcp.default {
  enable = true
  bind = "0.0.0.0:1883"
  enable_authn = false
}
listeners.ssl.default.enable = false
listeners.ws.default.enable = false
listeners.wss.default.enable = false
dashboard.listeners.http.bind = "127.0.0.1:18083"
authorization.no_match = allow
authorization.sources = []
