version: 1
disable_existing_loggers: false

# The worker logs its runs; the detectors it replays log only errors, since a
# replay would otherwise repeat every live alignment warning millions of times.
loggers:
  off_key_mqtt_radar:
    level: ${DOJO_DETECTOR_LOG_LEVEL:ERROR}
    handlers: [console]
    propagate: false

  off_key_mqtt_radar.dojo:
    level: ${DOJO_LOG_LEVEL:${LOG_LEVEL:INFO}}
    handlers: [console]
    propagate: false
