---
- name: Run trusted monitor maintenance through the target TACTIC image
  include_tasks: job.yml
  vars:
    release_job_service: tactic
    release_job_image: "{{ tactic_image }}"
    release_job_module: off_key_tactic_middleware.deployment
    release_job_arguments: ["{{ monitor_action }}", "{{ release.application_revision }}"]
    release_job_overrides:
      TACTIC_DOCKER_API_URL: unix:///var/run/docker.sock
