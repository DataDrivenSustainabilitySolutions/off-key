# Loki, single process, for the stack's container logs (observability overlay).
# Logs live on the node-local loki-data volume; retention deletes them after 30 days.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

ingester:
  wal:
    dir: /loki/wal
    replay_memory_ceiling: 256MB
    disk_full_threshold: 0.85

querier:
  max_concurrent: 2

frontend:
  max_outstanding_per_tenant: 16

schema_config:
  configs:
    - from: "2026-11-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  max_query_lookback: 168h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 0.05
  ingestion_burst_size_mb: 1
  max_query_parallelism: 2
  max_query_series: 500
  max_entries_limit_per_query: 2000
  max_streams_per_user: 500
  max_global_streams_per_user: 500
  # Labels are few (service, stack, node, level); JSON fields stay in the line.
  max_label_names_per_series: 8

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
