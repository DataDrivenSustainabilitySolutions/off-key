---
# Runs on the manager node only. Rendering is shared with offline validation.

- name: Identify the production release before changing the stack
  include_tasks: release.yml

# The manager exports the broker route's node identity over NFS (nfs_server).
- name: Discover the manager's management tailnet address for the route state
  command: tailscale ip -4
  delegate_to: "{{ groups['swarm_manager'][0] }}"
  register: broker_route_nfs_tailnet_ip
  changed_when: false
  when: broker_route_enabled | bool

- name: Require the manager's management tailnet IPv4 address
  assert:
    that:
      - broker_route_nfs_tailnet_ip.stdout | trim | length > 0
    fail_msg: >-
      The manager has no Tailscale IPv4 address. Connect it to the management
      tailnet before deploying the stack.
  when: broker_route_enabled | bool

- name: Use the manager's management tailnet address for backend mounts
  set_fact:
    broker_route_nfs_addr: "{{ broker_route_nfs_tailnet_ip.stdout | trim }}"
  when: broker_route_enabled | bool

- name: Validate production MQTT certificate chain and broker identity
  command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ playbook_dir }}/../scripts/validate-emqx-pki.py"
    stdin: >-
      {{ {'ca_cert': emqx_ca_cert, 'server_cert': emqx_server_cert,
          'server_key': emqx_server_key} | to_json }}
    stdin_add_newline: false
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Resolve the broker route and its login
  include_tasks: broker-route-access.yml
  when: broker_route_enabled | bool

- name: Render deployment files
  include_tasks: render.yml

- name: Look for the network production's Traefik shares with the public demo
  command:
    argv: [docker, network, inspect, --format, "{% raw %}{{.Driver}} {{.Attachable}}{% endraw %}", "{{ demo_network }}"]
  register: demo_network_inspect
  changed_when: false
  failed_when: false
  when: (demo_hostname | default('') | length > 0) or (demo_mode | default(false) | bool)

- name: Create the shared demo network
  command:
    argv: [docker, network, create, --driver, overlay, --attachable, --opt, com.docker.network.driver.mtu=1280, "{{ demo_network }}"]
  when:
    - (demo_hostname | default('') | length > 0) or (demo_mode | default(false) | bool)
    - demo_network_inspect.rc != 0

- name: Require the shared demo network to be an attachable overlay
  assert:
    that: demo_network_inspect.rc != 0 or demo_network_inspect.stdout | trim == 'overlay true'
    fail_msg: "{{ demo_network }} exists but is not an attachable overlay network; remove it and retry."
  when: (demo_hostname | default('') | length > 0) or (demo_mode | default(false) | bool)

- name: Record the intended release separately from the last verified deployment
  copy:
    dest: "{{ stack_dir }}/release-pending.json"
    mode: "0644"
    content: >-
      {{ release | combine({'infrastructure_revision': infrastructure_revision.stdout,
         'attempted_at': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')}) | to_nice_json }}

- name: Inspect existing production MQTT client secret references
  command:
    argv: [docker, service, inspect, "{{ stack_name }}_{{ item.service }}"]
  loop:
    - {service: mqtt-proxy, target: MQTT_APIKEY, key: mqtt_proxy_password}
    - {service: mqtt-radar, target: RADAR_MQTT_API_KEY, key: mqtt_radar_password}
  register: existing_mqtt_clients
  changed_when: false
  failed_when: false
  no_log: true

- name: Require broker user rotation before changing MQTT client passwords
  assert:
    that:
      - >-
        current_secret_name == '' or
        current_secret_name == deployment_secret_names[item.item.key] or
        (mqtt_passwords_rotated_in_emqx | default(false) | bool)
    fail_msg: >-
      MQTT client password changed in the vault, but EMQX bootstrap users are not
      updated on redeploy. Update the corresponding EMQX user first, then rerun
      with -e mqtt_passwords_rotated_in_emqx=true.
  vars:
    container_spec: >-
      {{ (item.stdout | from_json)[0].Spec.TaskTemplate.ContainerSpec if item.rc == 0 else {} }}
    current_secret_name: >-
      {{ container_spec.Secrets | default([]) |
         selectattr('File.Name', 'equalto', item.item.target) |
         map(attribute='SecretName') | first | default('') }}
  loop: "{{ existing_mqtt_clients.results | default([]) }}"
  no_log: true

- name: Create content-addressed deployment secrets
  include_tasks: secrets.yml

- name: Log in to GitHub Container Registry
  command:
    argv:
      - docker
      - login
      - ghcr.io
      - --username
      - "{{ ghcr_username }}"
      - --password-stdin
    stdin: "{{ ghcr_token }}"
    stdin_add_newline: false
  no_log: true
  changed_when: false
