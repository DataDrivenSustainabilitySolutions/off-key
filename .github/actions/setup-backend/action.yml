name: Set up the backend toolchain
description: Install Python and the pinned uv, then optionally sync the locked backend workspace.

inputs:
  python-version:
    description: Python version for actions/setup-python; empty skips it.
    default: "3.14"
  sync:
    description: Sync every backend package and dependency group from uv.lock.
    default: "true"
  cache:
    description: setup-uv enable-cache value.
    default: "auto"

runs:
  using: composite
  steps:
    - name: Set up Python
      if: inputs.python-version != ''
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        # Keep equal to backend/Dockerfile and deploy-production.yml (infra/tests/test_toolchain.py).
        version: "0.13.5"
        enable-cache: ${{ inputs.cache }}

    - name: Sync the locked backend workspace
      if: inputs.sync == 'true'
      shell: bash
      run: uv sync --project backend --all-packages --all-groups --frozen
