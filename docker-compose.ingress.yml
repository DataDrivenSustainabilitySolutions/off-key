# Tailscale SOCKS5 + gost TCP forwarder
# Swarm-compatible ingress overlay. No Linux capabilities required.
#
# Deploy alongside the base swarm stack:
#   docker compose \
#     --env-file .env \
#     --env-file .env.ingress.local \
#     -f docker-compose.swarm.yml \
#     -f docker-compose.ingress.yml \
#     config \
#     | docker stack deploy --with-registry-auth -c - off-key
#
# Pre-flight:
#   1. Create (and optionally seed) the Tailscale state directory on every backend node:
#        mkdir -p /opt/stacks/off-key/tailscale-ingress-state
#      Copy tailscaled.state from a pre-authenticated installation to skip the auth key on restart.
#   2. Supply private management API credentials to TACTIC and open Data sources
#      to import/build a catalog. Production uses off-key-infra's secret mounts.
#
# See .env.ingress.example for required/optional environment variables.

services:
  tactic-middleware:
    environment:
      AMBIBOX_INGRESS_ENABLED: "true"
      AMBIBOX_SOCKS_SERVER: tailscale-vpn:1055
      AMBIBOX_FORWARD_HOST: mqtt-tailscale-bridge
      AMBIBOX_MQTT_USERNAME: ${AMBIBOX_MQTT_USERNAME:-}
      AMBIBOX_MQTT_PASSWORD: ${AMBIBOX_MQTT_PASSWORD:-}
      AMBIBOX_EMQX_API_KEY: ${AMBIBOX_EMQX_API_KEY:-}
      AMBIBOX_EMQX_API_SECRET: ${AMBIBOX_EMQX_API_SECRET:-}
      AMBIBOX_GOST_USERNAME: ${AMBIBOX_GOST_USERNAME:-off-key}
      AMBIBOX_GOST_PASSWORD: ${AMBIBOX_GOST_PASSWORD:?Set AMBIBOX_GOST_PASSWORD}

  tailscale-vpn:
    image: tailscale/tailscale:v1.102.4
    environment:
      - TS_AUTHKEY=${INGRESS_TS_AUTHKEY:-}
      - TS_AUTH_ONCE=${INGRESS_TS_AUTH_ONCE:-true}
      - TS_USERSPACE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SOCKS5_SERVER=0.0.0.0:1055
      - TS_EXTRA_ARGS=${INGRESS_TS_EXTRA_ARGS:-}
    volumes:
      - tailscale_ingress_state:/var/lib/tailscale
    networks:
      - emqx-network
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.backend == true]
      restart_policy:
        condition: any

  mqtt-tailscale-bridge:
    # Catalog routes are created through the private management API.
    image: gogost/gost:3.3.0
    command:
      - "-api=${AMBIBOX_GOST_USERNAME:-off-key}:${AMBIBOX_GOST_PASSWORD:?Set AMBIBOX_GOST_PASSWORD}@:18080"
    networks:
      - emqx-network
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.backend == true]
      restart_policy:
        condition: any

volumes:
  tailscale_ingress_state:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${INGRESS_TS_STATE_DIR:-/opt/stacks/off-key/tailscale-ingress-state}

networks:
  emqx-network:
