name: offkey-collection-test
services:
  # The internal broker at the production version (MOSQUITTO_TEST_IMAGE in CI).
  mosquitto:
    image: ${MOSQUITTO_TEST_IMAGE:-eclipse-mosquitto:2.1.2-alpine}
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ['CMD', 'mosquitto_sub', '-h', '127.0.0.1', '-t', '$$SYS/broker/version', '-C', '1', '-W', '3']
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - '127.0.0.1:28883:1883'
  charger-a:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - '127.0.0.1:28884:1883'
  charger-b:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - '127.0.0.1:28885:1883'
  database:
    image: ${POSTGRES_TEST_IMAGE:-timescale/timescaledb:latest-pg15}
    environment:
      POSTGRES_USER: collection_test
      POSTGRES_PASSWORD: collection-test-password
      POSTGRES_DB: collection_test
    ports:
      - '127.0.0.1:25432:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'collection_test', '-d', 'collection_test']
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
