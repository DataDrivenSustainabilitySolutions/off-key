# The production and demo stacks' internal broker. One TLS listener; the
# certificate's DNS name, emqx-main, is the network alias clients dial. The
# password file is rendered from the vault on every release, so a password
# changed there reaches the broker and its client together.
allow_anonymous false
password_file /run/secrets/mosquitto_passwords

listener 8883 0.0.0.0
certfile /run/secrets/mqtt_server_cert.pem
keyfile /run/secrets/mqtt_server_key.pem

# Retained snapshots survive a broker restart. The database is also written on
# shutdown and on SIGUSR1, which the backup sends before copying it.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S
