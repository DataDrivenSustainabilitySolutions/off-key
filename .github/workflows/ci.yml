name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the backend toolchain
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ matrix.python }}

      - name: Type check backend
        # ty checks against Python 3.12 whichever interpreter runs it.
        if: matrix.python == '3.12'
        run: uv run --project backend ty check --project backend

      - name: Test backend
        run: uv run --project backend python -m pytest -q --timeout=300 --timeout-method=thread

      - name: Check generated monitoring contracts and catalog
        run: |
          uv run --project backend python backend/scripts/generate_pipeline_types.py --check
          uv run --project backend python -m off_key_mqtt_radar.catalog --check

      - name: Run pre-commit
        run: uv run --project backend pre-commit run --all-files --show-diff-on-failure

  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Check for unused frontend files, dependencies and exports
        working-directory: frontend
        run: npm run knip

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run route-mocked browser journeys
        working-directory: frontend
        run: |
          set -euo pipefail
          npx vite preview --port 5173 --strictPort > "$RUNNER_TEMP/vite-preview.log" 2>&1 &
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 http://localhost:5173 > /dev/null
          # The chart journeys compare canvas pixels, so they use deployment smoke's browser image.
          playwright_version="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
          docker run --rm --network host --ipc host --volume "${PWD}:/work" --workdir /work --env CI=true \
            "mcr.microsoft.com/playwright:v${playwright_version}-noble" npm run test:e2e:mocked
