---
- import_playbook: validate-inventory.yml

- name: Deploy the tested production release
  hosts: swarm_manager[0]
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Prepare, migrate, deploy and verify production
      block:
        - name: Prepare production stack files and credentials
          include_role:
            name: stack_prepare
            public: true

        - name: Prepare the broker route's shared node identity
          include_role:
            name: nfs_server
          when: broker_route_enabled | default(false) | bool

        - name: Submit the production release
          include_role:
            name: stack_deploy

        - name: Verify and record the complete production release
          include_role:
            name: stack_deploy
            tasks_from: verify

        # This happens after application maintenance is complete and release.json
        # is recorded. An optional logging failure never reopens that release.
        - name: Reconcile observability after the application is independently verified
          when: not (demo_mode | default(false) | bool)
          block:
            - name: Render the independently deployed observability component
              include_role:
                name: observability
                tasks_from: render
              when: observability_active | bool

            - name: Apply the independent logging component
              include_role:
                name: observability
              vars:
                observability_action: "{{ 'deploy' if observability_active | bool else 'pause' }}"
          rescue:
            - name: Report an isolated observability failure
              debug:
                msg: >-
                  The application release is verified and complete. Observability failed
                  separately; inspect its services and use deploy-observability.yml to retry
                  or pause it. Application images and schema have not been rolled back.
      always:
        - name: Remove temporary manager registry credentials
          command:
            argv: [docker, logout, ghcr.io]
          changed_when: false

# Runs only after the release above was verified and recorded. Cleanup never fails a
# verified release: an unreachable node or a Docker error is reported, not fatal.
- name: Remove superseded application images from every node
  hosts: swarm_manager:swarm_worker
  gather_facts: false
  vars:
    application_images: >-
      {{ release.images | dict2items
         | selectattr('key', 'in', ['api', 'frontend', 'docs', 'tactic', 'mqtt_proxy', 'mqtt_radar', 'db_sync', 'forecast'])
         | map(attribute='value') | list }}
  tasks:
    - name: Read every image a Swarm service still names
      command:
        argv: [python3, '-', services]
        stdin: "{{ lookup('file', playbook_dir ~ '/../scripts/prune_images.py') }}"
      delegate_to: "{{ groups['swarm_manager'][0] }}"
      run_once: true
      changed_when: false
      register: service_images
      ignore_errors: true

    - name: Remove application images that neither the release nor a service uses
      command:
        argv:
          - python3
          - '-'
          - prune
          - "{{ application_images | to_json }}"
          - "{{ (release.images.values() | list + service_images.stdout | from_json) | unique | to_json }}"
        stdin: "{{ lookup('file', playbook_dir ~ '/../scripts/prune_images.py') }}"
      register: pruned_images
      when: service_images is succeeded
      changed_when: not pruned_images.stdout.startswith('Removed 0 ')
      ignore_errors: true
      ignore_unreachable: true
