- name: Check whether the route's node identity is already present on the export
  stat:
    path: "{{ broker_route_state_dir }}/tailscaled.state"
  register: broker_route_state

- name: Check whether a node identity backup exists on the control host
  stat:
    path: "{{ broker_route_seed_dir }}/tailscaled.state"
  delegate_to: localhost
  become: false
  register: broker_route_seed

- name: Seed the node identity from control-host backup (only if export empty and a seed exists)
  copy:
    src: "{{ broker_route_seed_dir }}/"
    dest: "{{ broker_route_state_dir }}/"
    mode: preserve
  when:
    - not broker_route_state.stat.exists
    - broker_route_seed.stat.exists

- name: Require recovery of the existing node identity before deployment
  assert:
    that: broker_route_state.stat.exists or broker_route_seed.stat.exists
    fail_msg: >-
      The broker route's node identity is missing. Restore its private backup to the
      NFS export or the local gitignored seed directory before deploying. CI must
      not register a replacement identity.
