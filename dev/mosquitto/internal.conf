# Local internal broker: the bus between TACTIC ingress, the MQTT proxy and the
# monitors. Production runs the same broker with TLS and logins
# (infra/stack/mosquitto.conf); locally it is anonymous on the private network.
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S
