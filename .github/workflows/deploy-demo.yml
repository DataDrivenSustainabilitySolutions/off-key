name: Deploy Demo

# The public read-only demo (demo.aberration.app) on its own server. It follows
# each verified production release; run it by hand to retry, to set the server
# up the first time (provision), or after accepting the administrator invitation.
on:
  workflow_run:
    workflows:
      - Deploy Production
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: Full tested main commit SHA
        required: true
        type: string
      provision:
        description: First setup of a new demo server (Docker, Tailscale, Swarm), then deploy
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  eligibility:
    if: >-
      github.repository == 'DataDrivenSustainabilitySolutions/off-key' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Require all latest workflow attempts to succeed on the same main commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision || github.event.workflow_run.head_sha }}
        run: python3 infra/scripts/release_ready.py --revision "$REVISION"

  deploy:
    needs: eligibility
    if: needs.eligibility.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: demo
    concurrency:
      group: offkey-demo
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      OFFKEY_ENVIRONMENT: demo
      OFFKEY_RELEASE_REVISION: ${{ needs.eligibility.outputs.revision }}
    steps:
      - name: Follow production only while automatic demo releases are on
        id: release
        env:
          DEMO_AUTO_DEPLOY_ENABLED: ${{ vars.DEMO_AUTO_DEPLOY_ENABLED }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ "$DEMO_AUTO_DEPLOY_ENABLED" != true ]; then
            echo 'Automatic demo releases are off; run Deploy Demo by hand.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the exact tested application and infrastructure commit
        if: steps.release.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.eligibility.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select the private temporary configuration directory
        if: steps.release.outputs.ready == 'true'
        run: echo "OFFKEY_DEPLOY_DIRECTORY=$RUNNER_TEMP/offkey-demo" >> "$GITHUB_ENV"
      - name: Create private deployment configuration
        if: steps.release.outputs.ready == 'true'
        env:
          OFFKEY_VAULT: ${{ secrets.OFFKEY_DEMO_VAULT }}
          OFFKEY_VAULT_PASSWORD: ${{ secrets.OFFKEY_VAULT_PASSWORD }}
          OFFKEY_INVENTORY: ${{ secrets.OFFKEY_DEMO_INVENTORY }}
          OFFKEY_DEPLOY_SSH_KEY: ${{ secrets.OFFKEY_DEPLOY_SSH_KEY }}
          OFFKEY_DEPLOY_KNOWN_HOSTS: ${{ secrets.OFFKEY_DEPLOY_KNOWN_HOSTS }}
        run: python3 infra/scripts/prepare_ci_secrets.py
      - name: Connect the ephemeral runner to the management tailnet
        if: steps.release.outputs.ready == 'true'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:offkey-ci
          use-cache: 'false'
      - name: Set up the locked Ansible tooling
        if: steps.release.outputs.ready == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Provision or deploy and verify the demo
        if: steps.release.outputs.ready == 'true'
        env:
          PROVISION: ${{ inputs.provision || false }}
          ANSIBLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/offkey-demo/deploy-key
          ANSIBLE_SSH_ARGS: -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${{ runner.temp }}/offkey-demo/known-hosts -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          umask 077
          cd infra/ansible
          export ANSIBLE_CONFIG="$PWD/ansible.cfg"
          playbook() {
            uv run --frozen ansible-playbook -i inventories/demo/hosts.yml "$@" --vault-password-file "$OFFKEY_DEPLOY_DIRECTORY/vault-password" -e "@$OFFKEY_DEPLOY_DIRECTORY/registry.json"
          }
          if [ "$PROVISION" = true ]; then
            playbook provision.yml > "$OFFKEY_DEPLOY_DIRECTORY/deploy.log" 2>&1 || { echo "Demo provisioning failed; inspect the demo server and retry."; exit 1; }
          else
            if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
              playbook deployment-needed.yml -e "deployment_decision_file=$OFFKEY_DEPLOY_DIRECTORY/deploy-needed" > "$OFFKEY_DEPLOY_DIRECTORY/preflight.log" 2>&1 || { echo "Demo preflight failed; check the demo SSH/configuration secrets."; exit 1; }
              if [ "$(cat "$OFFKEY_DEPLOY_DIRECTORY/deploy-needed")" != yes ]; then
                echo 'No runtime changes since the last verified demo release; the demo is unchanged.'
                exit 0
              fi
            fi
            playbook deploy.yml > "$OFFKEY_DEPLOY_DIRECTORY/deploy.log" 2>&1 || { echo "Demo release failed; inspect the demo server and retry the same SHA."; exit 1; }
          fi
          # Only the viewer outcome; the full log stays private.
          grep -oE '(Demo viewer|The demo viewer|Accept the administrator invitation)[^"]*' "$OFFKEY_DEPLOY_DIRECTORY/deploy.log" || true
      - name: Remove all temporary demo material
        if: always()
        run: |
          rm -f infra/ansible/inventories/demo/hosts.yml infra/ansible/inventories/demo/group_vars/all/vault.yml
          rm -rf "$OFFKEY_DEPLOY_DIRECTORY"
