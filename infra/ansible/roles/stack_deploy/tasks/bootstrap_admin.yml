---
- name: Locate the TACTIC task for administrator setup
  include_role:
    name: swarm_task
  vars:
    svc: tactic

- name: Email the first administrator invitation
  command:
    argv: >-
      {{ ['docker', 'exec', svc_container, '/app/bin/python',
          '-m', 'off_key_tactic_middleware.bootstrap_admin', '--send-email']
         + (['--resend'] if bootstrap_admin_resend | default(false) | bool else []) }}
  delegate_to: "{{ svc_node }}"
  register: administrator_setup
  changed_when: administrator_setup.rc == 0 and (administrator_setup.stdout_lines | last | from_json).status == 'sent'

- name: Report administrator setup
  debug:
    msg: >-
      {{ {'sent': 'Administrator setup required. Open the invitation sent to ' ~ superuser_mail ~ ' and choose your password.',
          'pending': 'Administrator setup is pending. The existing invitation remains valid; use make invite-admin-prod to resend it if needed.',
          'configured': 'Administrator account is already configured.'}[(administrator_setup.stdout_lines | last | from_json).status] }}
