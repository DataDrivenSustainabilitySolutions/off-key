---
# Input: svc. Publish svc_node, svc_task_id and svc_container together, or clear
# all three when no task/container is available. This file never waits.
- name: "{{ svc }} | clear the previous task resolution"
  set_fact:
    svc_node: ''
    svc_task_id: ''
    svc_container: ''
    svc_resolution_error: "Expected exactly one running {{ stack_name }}_{{ svc }} task."

- name: "{{ svc }} | inspect the current task"
  command:
    argv:
      - docker
      - service
      - ps
      - "{{ stack_name }}_{{ svc }}"
      - --no-trunc
      - --filter
      - desired-state=running
      - --format
      - '{% raw %}{{json .}}{% endraw %}'
  register: _svc_tasks
  changed_when: false
  failed_when: false

- name: "{{ svc }} | keep task discovery errors"
  set_fact:
    svc_resolution_error: "{{ _svc_tasks.stderr }}"
  when: _svc_tasks.rc != 0

- name: "{{ svc }} | resolve the current task's container"
  include_tasks: container.yml
  when:
    - _svc_tasks.rc == 0
    - _svc_tasks.stdout_lines | length == 1
    - (_svc_tasks.stdout_lines[0] | from_json).CurrentState.startswith('Running ')
  vars:
    _svc_task: "{{ _svc_tasks.stdout_lines[0] | from_json }}"
