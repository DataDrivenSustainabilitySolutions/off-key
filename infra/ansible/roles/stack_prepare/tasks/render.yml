---
- name: Require a dedicated internal API credential
  assert:
    that:
      - internal_api_secret | default('') | length >= 32
      - internal_api_secret != jwt_secret
      - "'CHANGE_ME' not in internal_api_secret"
    fail_msg: Set internal_api_secret to a new random secret of at least 32 characters in the environment vault.
  no_log: true

- name: Require the public demo's viewer account
  assert:
    that:
      - demo_viewer_email | default('') is match('^[^@\\s]+@[^@\\s]+$')
      - demo_viewer_email | default('') != superuser_mail
      - demo_viewer_password | default('') | length >= 16
      - "'CHANGE_ME' not in demo_viewer_password | default('')"
    fail_msg: >-
      Set demo_viewer_email (not the administrator's address) and a random
      demo_viewer_password of at least 16 characters in the demo vault.
  when: demo_mode | default(false) | bool
  no_log: true

- name: Validate the Resend API key without exposing it
  set_fact:
    resend_api_key_valid: >-
      {{ email_password | default('') is match('^re_.{10,}$')
         and email_password != 're_xxxxxxxxx' }}
  when: smtp_server == 'smtp.resend.com'
  no_log: true

- name: Require the real Resend API key in the vault email_password field
  assert:
    that:
      - resend_api_key_valid
    fail_msg: >-
      The effective email_password is missing, malformed, or still a placeholder.
      Edit inventories/prod/group_vars/all/vault.yml with ansible-vault edit and
      replace its existing email_password value with your complete Resend API key
      starting with re_. Ensure email_password appears only once in the vault.
  when: smtp_server == 'smtp.resend.com'

- name: Require authenticated Resend SMTP with certificate validation and TLS
  assert:
    that:
      - email_username == 'resend'
      - use_credentials | bool
      - validate_certs | bool
      - (mail_starttls | bool) != (mail_ssl_tls | bool)
    fail_msg: >-
      The failed assertion names the incorrect SMTP setting. Resend requires
      email_username=resend, use_credentials=True, validate_certs=True, and exactly
      one of mail_starttls or mail_ssl_tls. Check production vars.yml and any vault
      overrides; see docs/operations/production.md (production email) and
      docs/single-organization.md (Resend settings).
  when: smtp_server == 'smtp.resend.com'

# Shared by deployment and offline configuration checks. All inputs are supplied
# by inventory/discovery; this task file only renders files and derived facts.
- name: Require immutable production images from a named application revision
  assert:
    that:
      - release.application_revision is match('^[0-9a-f]{40}$')
      - release.images.keys() | sort == ['api', 'cloudflared', 'db_sync', 'emqx', 'frontend', 'gost', 'landing', 'mqtt_proxy', 'mqtt_radar', 'oauth2', 'postgres', 'socket_proxy', 'tailscale', 'tactic', 'traefik'] | sort
      - release.images.values() | reject('match', '^.+@sha256:[0-9a-f]{64}$') | list | length == 0
      - '[api_image, frontend_image, mqtt_proxy_image, tactic_image, mqtt_radar_image, db_sync_image] | difference(release.images.values()) | length == 0'
    fail_msg: The resolved production release must contain the complete set of immutable image references.

- name: Require the existing Cloudflare Tunnel token in production
  assert:
    that:
      - cloudflare_tunnel_token | default('') | trim | length > 40
      - (cloudflare_tunnel_token | default('') | trim).startswith('eyJ')
    fail_msg: >-
      Set cloudflare_tunnel_token in the production vault to the eyJ... token
      for the existing production Cloudflare Tunnel, not the installation command.
  when: ingress_enabled | default(true) | bool

- name: Initialise deployment secrets
  set_fact:
    deployment_secret_material: {}
    deployment_secret_names: {}
  no_log: true

- name: Require production MQTT certificate and credential material
  assert:
    that:
      - emqx_ca_cert | default('') | length > 100
      - emqx_server_cert | default('') | length > 100
      - emqx_server_key | default('') | length > 100
      - "'-----BEGIN CERTIFICATE-----' in emqx_ca_cert"
      - "'-----BEGIN CERTIFICATE-----' in emqx_server_cert"
      - "emqx_server_key is search('-----BEGIN (RSA )?PRIVATE KEY-----')"
      - "'TEST_ONLY' not in emqx_ca_cert"
      - "'TEST_ONLY' not in emqx_server_cert"
      - "'TEST_ONLY' not in emqx_server_key"
      - mqtt_proxy_password | default('') | length >= 32
      - mqtt_radar_password | default('') | length >= 32
      - radar_checkpoint_secret | default('') | length >= 32
      - mqtt_proxy_password != mqtt_radar_password
      - "'TEST_ONLY' not in mqtt_proxy_password"
      - "'TEST_ONLY' not in mqtt_radar_password"
      - "'TEST_ONLY' not in radar_checkpoint_secret"
    fail_msg: Add a dedicated EMQX CA, broker certificate/key and separate MQTT credentials to the production vault.
  no_log: true

- name: Define production deployment secret material
  set_fact:
    deployment_secret_material:
      emqx_ca_cert: "{{ emqx_ca_cert }}"
      emqx_server_cert: "{{ emqx_server_cert }}"
      emqx_server_key: "{{ emqx_server_key }}"
      mqtt_proxy_password: "{{ mqtt_proxy_password }}"
      mqtt_radar_password: "{{ mqtt_radar_password }}"
      radar_checkpoint_secret: "{{ radar_checkpoint_secret }}"
      emqx_auth_users: >-
        {{ [
          {'user_id': mqtt_local_proxy_username, 'password': mqtt_proxy_password, 'is_superuser': false},
          {'user_id': radar_mqtt_username, 'password': mqtt_radar_password, 'is_superuser': false}
        ] | to_json }}
  no_log: true

- name: Define the Cloudflare Tunnel connector secret
  set_fact:
    deployment_secret_material: >-
      {{ deployment_secret_material | combine({'cloudflared_tunnel_token': cloudflare_tunnel_token | trim}) }}
  when: ingress_enabled | default(true) | bool
  no_log: true

- name: Define the broker route secret
  set_fact:
    deployment_secret_material: >-
      {{ deployment_secret_material | combine({'system_broker_routes': [
           {'name': broker_route_name,
            'hosts': broker_route_hosts,
            'host_suffixes': broker_route_host_suffixes,
            'socks_proxy': {'host': 'broker-route', 'port': 1055},
            'require_tls': broker_route_require_tls | bool}
           | combine({'credential': broker_route_login}
                     if broker_route_login.password | default('') | length > 0 else {})
         ] | to_json}) }}
  when: broker_route_enabled | bool
  no_log: true

- name: Name content-addressed deployment secrets
  set_fact:
    deployment_secret_names: >-
      {{ deployment_secret_names | combine({item.key: stack_name ~ '_' ~ item.key ~ '_' ~ (item.value | hash('sha256'))[:12]}) }}
  loop: "{{ deployment_secret_material | dict2items }}"
  no_log: true

- name: Create stack directory
  file:
    path: "{{ stack_dir }}"
    state: directory
    mode: "0750"
    owner: "{{ stack_file_owner }}"
    group: "{{ stack_file_group }}"

- name: Render .env file from template
  template:
    src: env.j2
    dest: "{{ stack_dir }}/.env"
    mode: "0600"
    owner: "{{ stack_file_owner }}"
    group: "{{ stack_file_group }}"
  no_log: true

- name: Render explicit service environment maps
  template:
    src: environment.yml.j2
    dest: "{{ stack_dir }}/docker-compose.environment.yml"
    mode: "0600"
    owner: "{{ stack_file_owner }}"
    group: "{{ stack_file_group }}"
  no_log: true

- name: Remove obsolete service dotenv files
  file:
    path: "{{ stack_dir }}/.env.{{ item }}"
    state: absent
  loop: "{{ service_environment.keys() | list }}"

- name: Copy shared stack files
  copy:
    src: "{{ stack_source_dir }}/{{ item }}"
    dest: "{{ stack_dir }}/{{ item }}"
    mode: "0640"
    owner: "{{ stack_file_owner }}"
    group: "{{ stack_file_group }}"
  loop:
    - docker-compose.swarm.yml

- name: Copy optional stack overlays this installation uses
  copy:
    src: "{{ stack_source_dir }}/{{ item.file }}"
    dest: "{{ stack_dir }}/{{ item.file }}"
    mode: "0640"
    owner: "{{ stack_file_owner }}"
    group: "{{ stack_file_group }}"
  loop: "{{ stack_optional_overlays | selectattr('enabled') | list }}"
  loop_control:
    label: "{{ item.file }}"

- name: Remove optional stack overlays this installation leaves out
  file:
    path: "{{ stack_dir }}/{{ item.file }}"
    state: absent
  loop: "{{ stack_optional_overlays | rejectattr('enabled') | list }}"
  loop_control:
    label: "{{ item.file }}"

- name: Remove obsolete Mailpit deployment files
  file:
    path: "{{ stack_dir }}/{{ item }}"
    state: absent
  loop: "{{ ['.env.mailpit', 'docker-compose.mailpit.yml'] }}"

- name: Render environment-specific Traefik routes
  template:
    src: "{{ stack_source_dir }}/traefik-dynamic.yml.j2"
    dest: "{{ stack_dir }}/traefik-dynamic.yml"
    mode: "0640"
    owner: "{{ stack_file_owner }}"
    group: "{{ stack_file_group }}"

- name: Copy production EMQX security configuration
  copy:
    src: "{{ stack_source_dir }}/emqx-security.hocon"
    dest: "{{ stack_dir }}/emqx-security.hocon"
    mode: "0640"
    owner: "{{ stack_file_owner }}"
    group: "{{ stack_file_group }}"

- name: Render the public landing page
  template:
    src: "{{ stack_source_dir }}/{{ item }}.j2"
    dest: "{{ stack_dir }}/{{ item }}"
    mode: "0640"
    owner: "{{ stack_file_owner }}"
    group: "{{ stack_file_group }}"
  loop: [landing.html, landing.md, landing-llms.txt]
  when: landing_enabled | default(true) | bool

- name: Copy the landing page web server configuration
  copy:
    src: "{{ stack_source_dir }}/landing-nginx.conf"
    dest: "{{ stack_dir }}/landing-nginx.conf"
    mode: "0640"
    owner: "{{ stack_file_owner }}"
    group: "{{ stack_file_group }}"
  when: landing_enabled | default(true) | bool

- name: Remove the landing page when this installation has none
  file:
    path: "{{ stack_dir }}/{{ item }}"
    state: absent
  loop: [landing.html, landing.md, landing-llms.txt, landing-nginx.conf]
  when: not (landing_enabled | default(true) | bool)

- name: Render production Cloudflare Tunnel connector overlay
  template:
    src: "{{ stack_source_dir }}/docker-compose.cloudflared.yml.j2"
    dest: "{{ stack_dir }}/docker-compose.cloudflared.yml"
    mode: "0640"
    owner: "{{ stack_file_owner }}"
    group: "{{ stack_file_group }}"
  when: ingress_enabled | default(true) | bool

- name: Remove the Cloudflare Tunnel connector when production's Traefik serves this stack
  file:
    path: "{{ stack_dir }}/docker-compose.cloudflared.yml"
    state: absent
  when: not (ingress_enabled | default(true) | bool)

- name: Render MQTT security and collection controller overlay
  template:
    src: "{{ stack_source_dir }}/docker-compose.mqtt-security.yml.j2"
    dest: "{{ stack_dir }}/docker-compose.mqtt-security.yml"
    mode: "0640"
    owner: "{{ stack_file_owner }}"
    group: "{{ stack_file_group }}"

- name: Render persistence overlay
  template:
    src: "{{ stack_source_dir }}/docker-compose.persistence.yml.j2"
    dest: "{{ stack_dir }}/docker-compose.persistence.yml"
    mode: "0640"
    owner: "{{ stack_file_owner }}"
    group: "{{ stack_file_group }}"
  when: persistence_any_enabled | bool

- name: Remove persistence overlay when all toggles are off
  file:
    path: "{{ stack_dir }}/docker-compose.persistence.yml"
    state: absent
  when: not (persistence_any_enabled | bool)
