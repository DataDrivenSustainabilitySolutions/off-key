---
- name: Resolve the service's running task
  include_tasks: _service_node.yml

- name: "{{ svc }} | locate the container for that task"
  command:
    argv:
      - docker
      - ps
      - --quiet
      - --no-trunc
      - --filter
      - "label=com.docker.swarm.task.id={{ svc_task_id }}"
      - --filter
      - status=running
  delegate_to: "{{ svc_node }}"
  register: _svc_containers
  changed_when: false

- name: "{{ svc }} | require exactly one container for the task"
  assert:
    that: _svc_containers.stdout_lines | length == 1
    fail_msg: "Expected exactly one running container for task {{ svc_task_id }} on {{ svc_node }}."

- name: "{{ svc }} | record container"
  set_fact:
    svc_container: "{{ _svc_containers.stdout_lines[0] }}"
