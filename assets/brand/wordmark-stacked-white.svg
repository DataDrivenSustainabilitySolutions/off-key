<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 186" width="500" height="372" role="img" aria-labelledby="title desc">
  <title id="title">Aberration — stacked wordmark study</title>
  <desc id="desc">Custom angular lowercase lettering on two lines: abe followed by the original paired-r mark, with ation below.</desc>
  <g id="wordmark" fill="#fff" transform="translate(16 16)">
    <g id="abe">
      <path id="letter-a-top" fill-rule="evenodd" transform="translate(0 24)" d="M0 0H44V44H0V17H34V10H0ZM10 27V34H34V27Z"/>
      <path id="letter-b" fill-rule="evenodd" transform="translate(58 0)" d="M0 0H10V24H44V68H0ZM10 34V58H34V34Z"/>
      <path id="letter-e" fill-rule="evenodd" transform="translate(116 24)" d="M0 0H44V27H10V34H44V44H0ZM10 10V17H34V10Z"/>
      <path id="letter-rr" transform="translate(164 14)" d="M10 10H38V20H20V54H10ZM44 10H54V54H26V44H44Z"/>
    </g>
    <g id="ation" transform="translate(0 110)">
      <path id="letter-a" fill-rule="evenodd" d="M0 0H44V44H0V17H34V10H0ZM10 27V34H34V27Z"/>
      <path id="letter-t" transform="translate(55 0)" d="M10 -16H20V0H32V10H20V34H32V44H10V10H0V0H10Z"/>
      <path id="letter-i" transform="translate(98 0)" d="M0 -16H10V-6H0ZM0 0H10V44H0Z"/>
      <path id="letter-o" fill-rule="evenodd" transform="translate(119 0)" d="M0 0H44V44H0ZM10 10V34H34V10Z"/>
      <path id="letter-n" transform="translate(174 0)" d="M0 0H44V44H34V10H10V44H0Z"/>
    </g>
  </g>
</svg>
