version: 1
disable_existing_loggers: false

# Service-specific logger configurations
loggers:
  off_key_mqtt_radar:
    level: ${RADAR_LOG_LEVEL:${SERVICE_LOG_LEVEL:${LOG_LEVEL:INFO}}}
    handlers: [console]
    propagate: false

  # MQTT library logger
  paho.mqtt:
    level: ${MQTT_LOG_LEVEL:WARNING}
    handlers: [console_truncated]
    propagate: false
