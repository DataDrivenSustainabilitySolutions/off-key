# Public website, production only. Static content is a versioned Swarm config;
# no application build, credentials, or connection to the backend network is needed.
services:
  landing:
    image: "${LANDING_IMAGE:-nginx:1.30.5-alpine-slim}"
    configs:
      - source: landing_page
        target: /usr/share/nginx/html/index.html
      - source: landing_markdown
        target: /usr/share/nginx/html/index.md
      - source: landing_llms
        target: /usr/share/nginx/html/llms.txt
      - source: landing_nginx
        target: /etc/nginx/conf.d/default.conf
      - source: landing_hero_bridge
        target: /usr/share/nginx/html/assets/hero-bridge-v1.jpg
      - source: landing_hero_pipes
        target: /usr/share/nginx/html/assets/hero-pipes-v1.webp
      - source: landing_hero_conveyor
        target: /usr/share/nginx/html/assets/hero-conveyor-v1.webp
      - source: landing_hero_solar
        target: /usr/share/nginx/html/assets/hero-solar-v2.webp
      - source: landing_hero_cooling
        target: /usr/share/nginx/html/assets/hero-cooling-bank-v1.webp
      - source: landing_hero_gantry
        target: /usr/share/nginx/html/assets/hero-robotic-gantry-v1.webp
      - source: landing_hero_cables
        target: /usr/share/nginx/html/assets/hero-data-cable-runway-v1.webp
      - source: landing_hero_irrigation
        target: /usr/share/nginx/html/assets/hero-irrigation-span-v2.webp
    networks:
      - public-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints: ["${FRONTEND_CONSTRAINT:-node.labels.frontend == true}"]
      restart_policy:
        condition: any

# One hash covers the page, server configuration and image fingerprints.
configs:
  landing_page:
    name: landing_page_${LANDING_PAGE_HASH}
    file: ./landing.html
  landing_markdown:
    name: landing_markdown_${LANDING_PAGE_HASH}
    file: ./landing.md
  landing_llms:
    name: landing_llms_${LANDING_PAGE_HASH}
    file: ./landing-llms.txt
  landing_nginx:
    name: landing_nginx_${LANDING_PAGE_HASH}
    file: ./landing-nginx.conf
  landing_hero_bridge:
    name: landing_hero_bridge_${LANDING_PAGE_HASH}
    file: ./hero-bridge-v1.jpg
  landing_hero_pipes:
    name: landing_hero_pipes_${LANDING_PAGE_HASH}
    file: ./hero-pipes-v1.webp
  landing_hero_conveyor:
    name: landing_hero_conveyor_${LANDING_PAGE_HASH}
    file: ./hero-conveyor-v1.webp
  landing_hero_solar:
    name: landing_hero_solar_${LANDING_PAGE_HASH}
    file: ./hero-solar-v2.webp
  landing_hero_cooling:
    name: landing_hero_cooling_${LANDING_PAGE_HASH}
    file: ./hero-cooling-bank-v1.webp
  landing_hero_gantry:
    name: landing_hero_gantry_${LANDING_PAGE_HASH}
    file: ./hero-robotic-gantry-v1.webp
  landing_hero_cables:
    name: landing_hero_cables_${LANDING_PAGE_HASH}
    file: ./hero-data-cable-runway-v1.webp
  landing_hero_irrigation:
    name: landing_hero_irrigation_${LANDING_PAGE_HASH}
    file: ./hero-irrigation-span-v2.webp
