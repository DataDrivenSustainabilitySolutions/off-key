[project]
site_name = "aberration"
site_description = "Documentation for the aberration predictive-maintenance platform."
site_url = "https://datadrivensustainabilitysolutions.github.io/off-key/"
repo_url = "https://github.com/DataDrivenSustainabilitySolutions/off-key"
repo_name = "DataDrivenSustainabilitySolutions/off-key"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/brand/brand.css"]
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "User guide" = [
    { "Web app" = "user-guide/web-app.md" },
    { "Monitoring" = "user-guide/monitoring.md" },
  ] },
  { "Development" = [
    { "Setup" = "development/setup.md" },
    { "Architecture" = "development/architecture.md" },
    { "Testing and debugging" = "development/testing-debugging.md" },
    { "Contributing and CI" = "development/contributing-ci.md" },
  ] },
  { "Operations" = [
    { "Deployment modes" = "operations/deployment-modes.md" },
    { "GitHub setup" = "operations/github-setup.md" },
    { "Production releases" = "operations/production.md" },
    { "Recovery" = "operations/recovery.md" },
    { "Collection operations" = "operations/system-collection.md" },
  ] },
  { "Reference" = [
    { "Brand assets" = "reference/brand.md" },
    { "Backend API" = "reference/backend-api.md" },
    { "Data model" = "reference/data-model.md" },
    { "Environment variables" = "reference/environment-variables.md" },
  ] },
  { "Archive" = [
    { "Archive index" = "archive/index.md" },
    { "Project setup" = "archive/project-setup.md" },
    { "Docker guide" = "archive/docker-guide.md" },
    { "Frontend setup" = "archive/frontend-setup.md" },
    { "Frontend implementation notes" = "archive/frontend-documentation.md" },
    { "Client integration guide" = "archive/client-integration-guide.md" },
    { "Logging" = "archive/logging.md" },
    { "Monitoring service template" = "archive/monitoring-service.md" },
    { "Container management PoC" = "archive/container-management-poc.md" },
    { "Swarm PoC" = "archive/swarm-poc.md" },
    { "DevSecOps notes" = "archive/devsecops-notes.md" },
    { "Former GitHub sidebar" = "archive/wiki-sidebar.md" },
  ] },
]

[project.theme]
custom_dir = "docs/overrides"
favicon = "assets/brand/favicon.svg"
features = [
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "toc.follow",
]

[project.theme.icon]
logo = "brand/aberration"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
