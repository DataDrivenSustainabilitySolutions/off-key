version: 1
disable_existing_loggers: false

# Service-specific logger configurations
loggers:
  off_key_db_sync:
    level: ${SERVICE_LOG_LEVEL:${LOG_LEVEL:INFO}}
    handlers: [console]
    propagate: false

  # FastAPI/Uvicorn loggers
  uvicorn:
    level: ${UVICORN_LOG_LEVEL:INFO}
    handlers: [console_truncated]
    propagate: false

  uvicorn.access:
    level: ${UVICORN_ACCESS_LOG_LEVEL:WARNING}
    handlers: [console_truncated]
    propagate: false

  fastapi:
    level: ${FASTAPI_LOG_LEVEL:INFO}
    handlers: [console_truncated]
    propagate: false

  # Asyncio logging
  asyncio:
    level: ${ASYNCIO_LOG_LEVEL:WARNING}
    handlers: [console_truncated]
    propagate: false
