services:

  postgres:
    image: "${POSTGRES_IMAGE:-timescale/timescaledb:latest-pg15}"
    networks:
      app-network:
        aliases:
          - postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints: ["${BACKEND_CONSTRAINT:-node.labels.backend == true}"]
      restart_policy:
        condition: any

  api:
    image: "${API_IMAGE:-off-key-api-gateway:latest}"
    networks:
      app-network:
        aliases:
          - api-gateway
    # Clients reach the API under /api, which the proxy strips; the root path
    # puts that prefix in the OpenAPI `servers` entry and keeps /api/docs working.
    command: ["uvicorn", "off_key_api_gateway.main:app",
              "--host", "0.0.0.0", "--port", "8000", "--root-path", "/api"]
    # Liveness only: Swarm replaces a task that stops answering. The long start
    # period covers slow starts such as a migration holding the database lock.
    healthcheck:
      test: ["CMD", "/app/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 5m
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: ["${BACKEND_CONSTRAINT:-node.labels.backend == true}"]
      restart_policy:
        condition: any

  tactic:
    image: "${TACTIC_IMAGE:-off-key-tactic-middleware:latest}"
    networks:
      - app-network
      - socket-network
      - emqx-network
    environment:
      - TACTIC_DOCKER_DEFAULT_NETWORK=off-key_emqx-network
    command: [ "/app/bin/python", "-m", "off_key_tactic_middleware" ]
    # Liveness only: Swarm replaces a task that stops answering. The long start
    # period covers slow starts such as a migration holding the database lock.
    healthcheck:
      test: ["CMD", "/app/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 5m
    deploy:
      replicas: 1
      placement:
        constraints: ["${FRONTEND_CONSTRAINT:-node.labels.frontend == true}"]
      restart_policy:
        condition: any

  socket-proxy:
    image: "${SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:latest}"
    networks:
      - socket-network
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    environment:
      - LOG_LEVEL=info # debug,info,notice,warning,err,crit,alert,emerg
      ## Variables match the URL prefix (i.e. AUTH blocks access to /auth/* parts of the API, etc.).
      # 0 to revoke access.
      # 1 to grant access.
      ## Granted by Default
      - EVENTS=1
      - PING=1
      - VERSION=1
      ## Revoked by Default
      # Security critical
      - AUTH=0
      - SECRETS=0
      - POST=1 # Container(s) Lifecycle Management
      # Not always needed
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - CONTAINERS=1 # Traefik, portainer, etc.
      - DISTRIBUTION=0
      - EXEC=0
      - IMAGES=1 # Portainer
      - INFO=1 # Portainer
      - NETWORKS=1 # Portainer
      - NODES=0
      - PLUGINS=0
      - SERVICES=1 # Portainer
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=1 # Portainer
      - VOLUMES=1 # Portainer
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  frontend:
    image: "${FRONTEND_IMAGE:-off-key-frontend:latest}"
    networks:
      - public-network
      - app-network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: ["${FRONTEND_CONSTRAINT:-node.labels.frontend == true}"]
      restart_policy:
        condition: any

  db-sync:
    image: "${DB_SYNC_IMAGE:-off-key-db-sync:latest}"
    command: [ "/app/bin/python", "-m", "off_key_db_sync" ]
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "/app/bin/python", "-c",
              "import urllib.request; urllib.request.urlopen('http://localhost:8009/ready/schema', timeout=2)" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints: ["${BACKEND_CONSTRAINT:-node.labels.backend == true}"]
      restart_policy:
        condition: any

  mqtt-proxy:
    image: "${MQTT_PROXY_IMAGE:-off-key-mqtt-proxy:latest}"
    command: ["/app/bin/python", "-m", "off_key_mqtt_proxy"]
    # Liveness only: Swarm replaces a task that stops answering. The long start
    # period covers slow starts such as a migration holding the database lock.
    healthcheck:
      test: ["CMD", "/app/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health/live', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 5m
    networks:
      - app-network
      - emqx-network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: ["${BACKEND_CONSTRAINT:-node.labels.backend == true}"]
      restart_policy:
        condition: any

  # Pretrained forecasting models (Timestral) for forecaster steps. Internal only:
  # RADAR and Dojo workers reach it on the app network, with a shared token. A
  # checkpoint's weights download from the Hugging Face Hub on first use into the
  # volume, so they outlive redeployments; the node needs outbound HTTPS for that.
  # Resident memory is about 0.3 GB with the smallest checkpoint loaded and 1.7 GB
  # with all four (2.5 GB while the largest loads); see
  # docs/operations/forecast-service.md.
  forecast:
    image: "${FORECAST_IMAGE:-off-key-forecast:latest}"
    command: [ "/app/bin/python", "-m", "off_key_forecast" ]
    networks:
      - app-network
    volumes:
      - forecast_models:/models
    healthcheck:
      test: ["CMD", "/app/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8020/health/live', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 1m
    deploy:
      replicas: 1
      placement:
        constraints: ["${BACKEND_CONSTRAINT:-node.labels.backend == true}"]
      resources:
        limits:
          memory: ${FORECAST_MEMORY_LIMIT:-4G}
          cpus: "${FORECAST_CPU_LIMIT:-2}"
        reservations:
          memory: ${FORECAST_MEMORY_RESERVATION:-512M}
          cpus: "${FORECAST_CPU_RESERVATION:-0.25}"
      restart_policy:
        condition: any
      update_config:
        order: stop-first

  # Replays Dojo runs from the RADAR image. Each replica runs one run at a
  # time, so the replica count is the number of runs that execute at once.
  dojo-worker:
    image: "${MQTT_RADAR_IMAGE:-off-key-mqtt-radar:latest}"
    command: [ "/app/bin/python", "-m", "off_key_mqtt_radar.dojo" ]
    networks:
      - app-network
    deploy:
      replicas: 2
      placement:
        constraints: ["${BACKEND_CONSTRAINT:-node.labels.backend == true}"]
      restart_policy:
        condition: any

  # Secret template for TACTIC-managed RADAR workers; never scaled. TACTIC finds it
  # through TACTIC_RADAR_SECRET_SERVICE and copies only its secret references.
  mqtt-radar:
    image: "${MQTT_RADAR_IMAGE:-off-key-mqtt-radar:latest}"
    command: [ "/app/bin/python", "-m", "off_key_mqtt_radar" ]
    networks:
      - app-network
      - emqx-network
    deploy:
      replicas: 0
      placement:
        constraints: ["${BACKEND_CONSTRAINT:-node.labels.backend == true}"]
      restart_policy:
        condition: any


  emqx-main:
    image: "${EMQX_IMAGE:-emqx/emqx:5.8.7}"
    # The container hostname MUST equal the host part of EMQX_NODE_NAME. `emqx ctl` reaches
    # the running broker over Erlang distribution to node emqx@emqx-main; without a matching
    # hostname that lookup fails with "Node 'emqx@emqx-main' not responding to pings", which
    # breaks `emqx ctl status` and `emqx ctl data export`. MQTT listeners
    # keep working regardless (they use the network alias), which is why this stays hidden
    # until you run a ctl command. In Swarm the alias below does NOT set the hostname, so it
    # is set explicitly here. Do NOT change the node name once /opt/emqx/data is persisted —
    # mnesia lives in data/mnesia/<node name> and a rename orphans it.
    hostname: emqx-main.internal
    environment:
      - "EMQX_NODE_NAME=emqx@emqx-main.internal"
      - "EMQX_HOST=emqx-main.internal"
      - "EMQX_CLUSTER__DISCOVERY_STRATEGY=static"
      - "EMQX_CLUSTER__STATIC__SEEDS=[emqx@emqx-main.internal]"
    networks:
      emqx-network:
        aliases:
          - emqx-main
    deploy:
      replicas: 1
      placement:
        constraints: ["${BACKEND_CONSTRAINT:-node.labels.backend == true}"]
      restart_policy:
        condition: any

# A node-local cache of downloaded weights: a task rescheduled to another backend
# node downloads what it needs again. Deliberately no driver_opts (see the
# persistence overlay).
volumes:
  forecast_models:

# WARNING: Encrypted overlay is incompatible with Tailscale
# MTU=1280 for tailscale0 compatibility
networks:
  public-network:
    driver: overlay
    attachable: true
    driver_opts:
      com.docker.network.driver.mtu: 1280
      # encrypted: "true"
  app-network:
    driver: overlay
    driver_opts:
      com.docker.network.driver.mtu: 1280
      # encrypted: "true"
    attachable: true
  socket-network:
    driver: overlay
    driver_opts:
      com.docker.network.driver.mtu: 1280
      # encrypted: "true"
  emqx-network:
    driver: overlay
    attachable: true
    driver_opts:
      com.docker.network.driver.mtu: 1280
      # encrypted: "true"
