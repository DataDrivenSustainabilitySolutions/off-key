name: CI

# Every check that gates a merge or a release runs in this one workflow. Branch
# rules require only `ci-gate`, and Deploy Production requires this workflow's
# success on a main push plus tested release evidence, so
# adding, renaming or re-versioning a job never changes a required check.
#
# The changes job plans the run (.github/scripts/ci_plan.py): root-Markdown-only
# static content and frontend-only changes skip suites whose inputs did not change; everything
# else, and anything uncertain, runs every job. Cheap checks run first, so a
# lint failure stops the image builds and disposable Swarms before they start.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push supersedes an older run of the same kind; a manual run never
  # cancels the main push run that releases.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # A main push compares against the newest run that kept release evidence.
      actions: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # History without file contents: enough to diff any base and head.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Plan the jobs this change needs
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci_plan.py

  static:
    name: static content
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      docs-sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
        with:
          python-version: "3.12"
          sync: "false"
          cache: "false"
      - name: Check public content and generated assets
        run: |
          uv sync --frozen --project infra
          uv run --frozen --project infra python infra/scripts/check_static.py
          uv run --frozen --project infra python -m unittest -q test_docs
        env:
          PYTHONPATH: infra/tests:infra/scripts
      - name: Select docs image source
        if: needs.changes.outputs.mode == 'published-docs' || needs.changes.outputs.mode == 'static'
        id: source
        run: echo "revision=$(python3 infra/scripts/image_sources.py "$GITHUB_SHA" --service docs)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        if: steps.source.outputs.revision != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build documentation
        if: steps.source.outputs.revision != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: dev/docs/Dockerfile
          load: true
          provenance: false
          sbom: false
          tags: off-key-docs:checked
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.version=sha-${{ steps.source.outputs.revision }}
          cache-from: |
            type=gha,scope=static-docs
            type=gha,scope=ci-main-docs
          cache-to: type=gha,mode=max,scope=static-docs
      - name: Probe the documentation server
        if: steps.source.outputs.revision != ''
        run: python3 dev/docs/check_image.py off-key-docs:checked
      - name: Archive the checked docs image
        if: github.event_name == 'push' && steps.source.outputs.revision != ''
        id: archive
        run: |
          docker save off-key-docs:checked | gzip > "$RUNNER_TEMP/static-docs.tar.gz"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/static-docs.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Keep the checked docs image for publication
        if: steps.archive.outputs.sha256 != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-docs
          path: ${{ runner.temp }}/static-docs.tar.gz
          if-no-files-found: error
          retention-days: 1

  static-release:
    name: static release
    needs: [changes, static]
    if: github.event_name == 'push' && fromJSON(needs.changes.outputs.plan)['static-release']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Download this run's checked docs image
        if: needs.static.outputs.docs-sha256 != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-docs
          path: ${{ runner.temp }}
      - name: Verify and load the checked docs image
        if: needs.static.outputs.docs-sha256 != ''
        env:
          EXPECTED_SHA256: ${{ needs.static.outputs.docs-sha256 }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, os, pathlib, re
          expected = os.environ["EXPECTED_SHA256"]
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "static-docs.tar.gz"
          if not re.fullmatch(r"[a-f0-9]{64}", expected) or hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit("Docs archive checksum mismatch")
          PYTHON
          docker load --input "$RUNNER_TEMP/static-docs.tar.gz"
      - name: Carry forward tested images and publish changed docs
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          DOCS_SHA256: ${{ needs.static.outputs.docs-sha256 }}
        run: |
          args=()
          if [[ -n "$DOCS_SHA256" ]]; then args+=(--docs-image off-key-docs:checked); fi
          python3 .github/scripts/static_release.py "${args[@]}" --output "$RUNNER_TEMP/production-release.json"
      - name: Attest the checked docs image
        if: steps.release.outputs.docs-digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.release.outputs.docs-name }}
          subject-digest: ${{ steps.release.outputs.docs-digest }}
          push-to-registry: true
      - name: Keep production release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-release
          path: ${{ runner.temp }}/production-release.json
          if-no-files-found: error
          retention-days: 90

  # Interpreter-independent repository checks, once, ahead of every costly job.
  lint:
    name: lint
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the backend toolchain
        uses: ./.github/actions/setup-backend

      - name: Run pre-commit
        run: uv run --project backend pre-commit run --all-files --show-diff-on-failure

      - name: Type check backend
        # ty checks against Python 3.12 ([tool.ty.environment]) whichever interpreter runs it.
        run: uv run --project backend ty check --project backend

      - name: Check generated monitoring contracts and catalog
        run: |
          uv run --project backend python backend/scripts/generate_pipeline_types.py --check
          uv run --project backend python -m off_key_mqtt_radar.catalog --check

  # Tests that read documentation or frontend sources, for plans that skip the
  # full backend and infrastructure suites, which include them.
  contracts:
    name: contracts
    needs: [changes, lint]
    if: fromJSON(needs.changes.outputs.plan).contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the backend toolchain
        uses: ./.github/actions/setup-backend

      - name: Test documentation and source contracts
        run: uv run --project backend python -m pytest backend/tests/contracts -q --timeout=300 --timeout-method=thread

      - name: Test infrastructure documentation contracts
        working-directory: infra
        run: |
          uv sync --frozen
          uv run --frozen python -m unittest -v test_docs test_service_registry test_ci_workflow
        env:
          PYTHONPATH: tests

  backend:
    name: backend (${{ matrix.python }})
    needs: [changes, lint]
    if: fromJSON(needs.changes.outputs.plan).backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the backend toolchain
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ matrix.python }}

      - name: Test backend
        run: uv run --project backend python -m pytest -q --timeout=300 --timeout-method=thread

  frontend:
    name: frontend
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      dist-sha256: ${{ steps.bundle.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Check for unused frontend files, dependencies and exports
        working-directory: frontend
        run: npm run knip

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Bundle the checked frontend
        id: bundle
        run: |
          tar -C frontend -czf "$RUNNER_TEMP/frontend-dist.tar.gz" dist
          echo "sha256=$(sha256sum "$RUNNER_TEMP/frontend-dist.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Keep this run's checked frontend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build
          path: ${{ runner.temp }}/frontend-dist.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  frontend-browser:
    name: frontend browser
    needs: [changes, frontend]
    if: fromJSON(needs.changes.outputs.plan)['frontend-browser']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Download this run's checked frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: ${{ runner.temp }}/frontend-build

      - name: Verify and unpack the checked frontend
        env:
          EXPECTED_SHA256: ${{ needs.frontend.outputs.dist-sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/frontend-build"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          actual = hashlib.sha256(Path("frontend-dist.tar.gz").read_bytes()).hexdigest()
          if actual != os.environ["EXPECTED_SHA256"]:
              raise SystemExit("The frontend build differs from the one this run checked")
          PY
          tar -C "$GITHUB_WORKSPACE/frontend" -xzf frontend-dist.tar.gz

      - name: Run route-mocked browser journeys
        working-directory: frontend
        run: |
          set -euo pipefail
          npx vite preview --port 5173 --strictPort > "$RUNNER_TEMP/vite-preview.log" 2>&1 &
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 http://localhost:5173 > /dev/null
          # The chart journeys compare canvas pixels, so they use deployment smoke's browser image.
          playwright_version="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
          docker run --rm --network host --ipc host --volume "${PWD}:/work" --workdir /work --env CI=true \
            "mcr.microsoft.com/playwright:v${playwright_version}-noble" npm run test:e2e:mocked

      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-browser-failure
          path: |
            frontend/test-results
            frontend/playwright-report
            ${{ runner.temp }}/vite-preview.log
          if-no-files-found: ignore
          retention-days: 14

  infrastructure:
    name: infrastructure
    needs: [changes, lint]
    if: fromJSON(needs.changes.outputs.plan).infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ""
          sync: "false"
          cache: "false"
      - name: Validate Ansible and render the production stack with synthetic inputs
        run: make -C infra check-deploy

  collection:
    name: collection (${{ matrix.emqx }})
    needs: [changes, lint]
    if: fromJSON(needs.changes.outputs.plan).collection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        emqx: ["5.8.7", "6.3.2"]
    env:
      EMQX_TEST_IMAGE: emqx/emqx:${{ matrix.emqx }}
      OFFKEY_COLLECTION_INTEGRATION: "1"
      COMPOSE_FILE: backend/tests/collection_integration/compose.yml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the backend toolchain
        uses: ./.github/actions/setup-backend

      - name: Use the production TimescaleDB image
        run: |
          image="$(python3 .github/scripts/release_image.py postgres)"
          echo "POSTGRES_TEST_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Start isolated brokers and database
        run: docker compose up -d --wait --wait-timeout 120

      - name: Test schema, retention, membership and release transactions
        env:
          TEST_SCHEMA_DATABASE_URL: postgresql+asyncpg://collection_test:collection-test-password@127.0.0.1:25432/collection_test
        run: |
          uv run --project backend python -m pytest -m "postgres and not radar_integration" -q --tb=short \
            --timeout=300 --timeout-method=thread --junitxml="$RUNNER_TEMP/database-results.xml"
          python3 .github/scripts/require_executed_tests.py "$RUNNER_TEMP/database-results.xml" "collection database"

      - name: Test routing, collection and recovery under load
        run: timeout 300 uv run --project backend python -m pytest backend/tests/collection_integration -q --tb=short

      - name: Show fixture diagnostics on failure
        if: failure()
        timeout-minutes: 2
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 150

      - name: Remove fixture containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  radar:
    name: radar
    # RADAR tests this run's one RADAR image: the published one on a main push,
    # the images job's verified build otherwise.
    needs: [changes, lint, images, publish]
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.plan).radar &&
      needs.lint.result == 'success' &&
      ((github.event_name == 'push' && needs.publish.result == 'success') ||
       (github.event_name != 'push' && needs.images.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      TEST_RADAR_DOCKER: "1"
      UV_PYTHON: "3.14"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Set up the backend toolchain
        uses: ./.github/actions/setup-backend

      - name: Set up the production Docker Engine
        uses: ./.github/actions/setup-docker-engine

      - name: Load the images this run built
        if: github.event_name != 'push'
        uses: ./.github/actions/load-ci-images
        with:
          manifest: ${{ needs.images.outputs.manifest }}
          archive-sha256: ${{ needs.images.outputs.archive-sha256 }}

      - name: Set up Docker Buildx
        # Pins the published RADAR digest with imagetools on a main push.
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read published application images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select the production database and this run's RADAR image
        env:
          MANIFEST: ${{ needs.images.outputs.manifest }}
        run: |
          set -euo pipefail
          image="$(python3 .github/scripts/release_image.py postgres)"
          echo "TEST_RADAR_DATABASE_IMAGE=$image" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # The digest this run's publish job pushed, checked against its revision label.
            radar="$(python3 -c 'import os, sys; sys.path.insert(0, "infra/scripts"); from pin_release import pin; from image_sources import source_revision; print(pin(sys.argv[1], os.environ["GITHUB_SHA"], source_revision("mqtt_radar", os.environ["GITHUB_SHA"])))' "$(python3 .github/scripts/release_image.py mqtt_radar)")"
            docker pull --quiet "$radar"
          else
            radar="$(python3 -c 'import json, os; print(json.loads(os.environ["MANIFEST"])["images"]["mqtt_radar"]["reference"])')"
          fi
          echo "TEST_RADAR_SWARM_IMAGE=$radar" >> "$GITHUB_ENV"
          docker pull --quiet "$image"
          docker pull --quiet eclipse-mosquitto:2.0

      - name: Start an isolated Swarm and disposable schema fixture
        run: |
          set -euo pipefail
          docker swarm init > /dev/null
          touch "$RUNNER_TEMP/radar-swarm-created"
          database="radar-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --detach --name "$database" --label off-key.ci=radar-production \
            --publish 127.0.0.1::5432 --tmpfs /var/lib/postgresql/data:rw,size=768m \
            --env POSTGRES_USER=radar_ci --env POSTGRES_DB=radar_ci \
            --env POSTGRES_PASSWORD=disposable-radar-ci-password "$TEST_RADAR_DATABASE_IMAGE"
          port="$(docker port "$database" 5432/tcp | awk -F: '{print $NF}')"
          url="postgresql+asyncpg://radar_ci:disposable-radar-ci-password@127.0.0.1:${port}/radar_ci"
          echo "TEST_SCHEMA_DATABASE_URL=$url" >> "$GITHUB_ENV"
          echo "TEST_PIPELINE_DATABASE_CONTAINER=$database" >> "$GITHUB_ENV"
          export TEST_SCHEMA_DATABASE_URL="$url"
          uv run --frozen --project backend python - <<'PY'
          import os, time
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          from sqlalchemy.exc import OperationalError
          engine = create_engine(make_url(os.environ["TEST_SCHEMA_DATABASE_URL"]).set(drivername="postgresql+psycopg2"), connect_args={"connect_timeout": 3})
          try:
              for attempt in range(60):
                  try:
                      with engine.connect() as connection:
                          assert connection.scalar(text("SELECT 1")) == 1
                      break
                  except OperationalError:
                      if attempt == 59:
                          raise
                      time.sleep(1)
          finally:
              engine.dispose()
          PY

      - name: Test real MQTT, durable recovery, lifecycle and Swarm replacement
        timeout-minutes: 25
        run: |
          uv run --frozen --project backend python -u -m pytest -vv --tb=short -ra \
            --timeout=300 --timeout-method=thread -o faulthandler_timeout=60 \
            --durations=10 \
            --junitxml="$RUNNER_TEMP/radar-results.xml" \
            -m radar_integration

      - name: Require executed integration coverage without skips
        run: python3 .github/scripts/require_executed_tests.py "$RUNNER_TEMP/radar-results.xml" "RADAR integration"

      - name: Save RADAR integration test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radar-integration-results
          path: ${{ runner.temp }}/radar-results.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect owned fixture diagnostics
        if: failure()
        # A hung log read must not hold the runner until the job timeout.
        timeout-minutes: 5
        run: |
          docker service ls
          for label in off-key.integration-owner off-key.review=radar-fixes off-key.ci=radar-production; do
            for service in $(docker service ls --quiet --filter "label=$label"); do
              timeout 30 docker service ps --no-trunc "$service" || true
              timeout 30 docker service logs --tail 100 "$service" || true
            done
            for container in $(docker container ls --all --quiet --filter "label=$label"); do
              timeout 30 docker logs --tail 100 "$container" || true
            done
          done

      - name: Remove owned CI services, containers and networks
        if: always()
        timeout-minutes: 2
        run: |
          for label in off-key.integration-owner off-key.review=radar-fixes off-key.ci=radar-production; do
            docker service ls --quiet --filter "label=$label" | xargs -r docker service rm || true
            docker container ls --all --quiet --filter "label=$label" | xargs -r docker container rm --force || true
          done
          if [ -f "$RUNNER_TEMP/radar-swarm-created" ]; then
            docker swarm leave --force || true
          fi
          docker network ls --quiet --filter label=off-key.integration-owner | xargs -r docker network rm || true

  # Pull requests, the merge queue and manual runs build every image once, with
  # the inputs the rehearsals test, and never push. Both rehearsal lanes and RADAR
  # load this run-scoped archive after checking its digest and image IDs.
  images:
    name: images
    needs: [changes, lint]
    if: github.event_name != 'push' && fromJSON(needs.changes.outputs.plan).images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      manifest: ${{ steps.build.outputs.manifest }}
      archive-sha256: ${{ steps.build.outputs.archive-sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build every application image once
        id: build
        uses: ./.github/actions/run-with-build-cache
        with:
          run: |
            mkdir -p "$RUNNER_TEMP/ci-images"
            python3 infra/tests/rehearsal_releases.py build-ci-images --revision "$GITHUB_SHA" \
              --archive "$RUNNER_TEMP/ci-images/images.tar.zst" --manifest "$RUNNER_TEMP/ci-images.json"
            archive_sha256="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["archive_sha256"])' "$RUNNER_TEMP/ci-images.json")"
            {
              echo "manifest=$(cat "$RUNNER_TEMP/ci-images.json")"
              echo "archive-sha256=$archive_sha256"
            } >> "$GITHUB_OUTPUT"
            echo "CI image archive: $(du -h "$RUNNER_TEMP/ci-images/images.tar.zst" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production frontend survives delayed API discovery
        run: python3 frontend/check_nginx_startup.py "$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["images"]["frontend"]["reference"])' "$RUNNER_TEMP/ci-images.json")"

      - name: Verify documentation pages, assets and Markdown exports
        run: python3 dev/docs/check_image.py "$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["images"]["docs"]["reference"])' "$RUNNER_TEMP/ci-images.json")"

      - name: Keep the image archive for this run's rehearsals
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-images
          path: ${{ runner.temp }}/ci-images/images.tar.zst
          if-no-files-found: error
          # Already zstd-compressed.
          compression-level: 0
          retention-days: 1

  # A main push publishes the images that RADAR and deployment smoke then test
  # and that a release deploys by digest.
  publish:
    needs: [changes, lint]
    if: github.event_name == 'push' && fromJSON(needs.changes.outputs.plan).publish
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/docker-images.yml
    with:
      cache-scope-prefix: docker-publish
      cache-fallback-scope-prefix: docker-validate

  # Two disposable Swarms run in parallel. The rehearsal lane runs every deployment
  # test: the adaptive monitor, then backup restore and binary rollback over state
  # the restore test creates itself. The browser lane runs every browser journey.
  deployment-smoke:
    name: deployment-smoke (${{ matrix.lane }})
    needs: [changes, lint, frontend, images, publish]
    # A main push tests the images its publish job pushed; other events test the
    # images this run's images job built. Both wait for the cheap checks.
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.plan)['deployment-smoke'] &&
      needs.lint.result == 'success' && needs.frontend.result == 'success' &&
      ((github.event_name == 'push' && needs.publish.result == 'success') ||
       (github.event_name != 'push' && needs.images.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        lane: [rehearsal, browser]
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/infra/ansible/ansible.cfg

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up the backend toolchain
        uses: ./.github/actions/setup-backend
        with:
          sync: "false"

      - name: Set up the production Docker Engine
        uses: ./.github/actions/setup-docker-engine

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read published application images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install existing E2E and infrastructure tools
        run: |
          echo "OFFKEY_REHEARSAL_DIR=$RUNNER_TEMP/offkey-rehearsal" >> "$GITHUB_ENV"
          npm ci --prefix frontend
          uv sync --project backend --all-packages --all-groups --frozen
          uv sync --project infra --frozen
          # Pull the browser image while the Swarm is prepared; docker run pulls it again if this fails.
          playwright_version="$(node -p "require('./frontend/node_modules/@playwright/test/package.json').version")"
          nohup docker pull --quiet "mcr.microsoft.com/playwright:v${playwright_version}-noble" > /dev/null 2>&1 &

      - name: Load the images this run built
        if: github.event_name != 'push'
        uses: ./.github/actions/load-ci-images
        with:
          manifest: ${{ needs.images.outputs.manifest }}
          archive-sha256: ${{ needs.images.outputs.archive-sha256 }}

      - name: Prepare disposable production Swarm
        timeout-minutes: 35
        env:
          # Other events rehearse the verified images loaded above, never a rebuild.
          OFFKEY_REHEARSAL_IMAGES: ${{ github.event_name != 'push' && 'loaded' || 'published' }}
        run: |
          set -euo pipefail
          docker swarm init > /dev/null
          uv run --frozen --project infra python infra/tests/swarm_smoke.py prepare --directory "$OFFKEY_REHEARSAL_DIR"

      - name: Sign the operator in once for the deployment tests
        if: matrix.lane == 'rehearsal'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # auth-setup accepts the operator invitation and saves the remembered session
          # that the deployment tests below take their access token from.
          docker service update --detach=false --env-add TACTIC_PIPELINE_AUTHORING_ENABLED=false offkey-smoke_tactic > /dev/null
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost:8001/ready > /dev/null
          playwright_version="$(node -p "require('./frontend/node_modules/@playwright/test/package.json').version")"
          docker run --rm --network host --ipc host \
            --volume "${PWD}/frontend:/work" \
            --volume "$OFFKEY_REHEARSAL_DIR:/smoke:ro" \
            --workdir /work --env-file "$OFFKEY_REHEARSAL_DIR/smoke.env" --env CI=true \
            "mcr.microsoft.com/playwright:v${playwright_version}-noble" npx playwright test --project=auth-setup

      - name: Check out the immutable pipeline-compatible rollback reference
        if: matrix.lane == 'rehearsal'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ad919d98e56a4e0e3dbcb8c3254f51e034d38251
          path: .tmp/compatible-release-source
          fetch-depth: 1
          persist-credentials: false

      - name: Build the reviewed compatible binary rollback reference
        if: matrix.lane == 'rehearsal'
        timeout-minutes: 25
        uses: ./.github/actions/run-with-build-cache
        with:
          run: uv run --frozen --project infra python infra/tests/swarm_smoke.py prepare-rollback --directory "$OFFKEY_REHEARSAL_DIR" --reference-repository "$GITHUB_WORKSPACE/.tmp/compatible-release-source"

      # Adaptive monitoring, then backup restoration and compatible binary rollback.
      - name: Verify every deployment test
        if: matrix.lane == 'rehearsal'
        timeout-minutes: 25
        env:
          RUN_ADAPTIVE_E2E: "1"
          OFFKEY_DEPLOYMENT_REHEARSAL: "1"
          E2E_GATEWAY_URL: http://localhost:8000
          E2E_MQTT_HOST: localhost
          E2E_MQTT_PORT: "8883"
          SUPERUSER_MAIL: admin@example.com
          E2E_AUTH_PASSWORD: PlaywrightPass123!
        run: |
          set -euo pipefail
          docker service update --detach=false --env-add TACTIC_PIPELINE_AUTHORING_ENABLED=true offkey-smoke_tactic > /dev/null
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost:8001/ready > /dev/null
          # Remembered sessions keep access tokens in memory; mint one from the cookie.
          E2E_SESSION_COOKIE="$(node -e "const state=require('./frontend/playwright/.auth/user.json'); const cookie=state.cookies.find(({name})=>name==='off_key_remembered_session')?.value; if (!cookie) { console.error('No remembered session cookie in the auth state'); process.exit(1); } process.stdout.write(cookie)")"
          echo "::add-mask::$E2E_SESSION_COOKIE"
          E2E_AUTH_TOKEN="$(curl --fail --silent --show-error -X POST -H 'X-Off-Key-Session: 1' -H "Cookie: off_key_remembered_session=$E2E_SESSION_COOKIE" http://localhost:8000/v1/auth/refresh | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"], end="")')"
          echo "::add-mask::$E2E_AUTH_TOKEN"
          export E2E_AUTH_TOKEN
          export E2E_MQTT_CA_FILE="$OFFKEY_REHEARSAL_DIR/ca.crt"
          export E2E_MQTT_USERNAME=offkey-radar
          E2E_MQTT_PASSWORD="$(python3 -c 'import json, os; from pathlib import Path; print(json.loads((Path(os.environ["OFFKEY_REHEARSAL_DIR"])/"inputs.json").read_text())["mqtt_radar_password"])')"
          export E2E_MQTT_PASSWORD
          # The marker alone selects them, so a new deployment test cannot fall outside this lane.
          uv run --frozen --project backend python -m pytest -m deployment -q --tb=short --junitxml="$OFFKEY_REHEARSAL_DIR/deployment-results.xml"
          python3 .github/scripts/require_executed_tests.py "$OFFKEY_REHEARSAL_DIR/deployment-results.xml" "deployment"

      - name: Run existing browser journeys against the production frontend
        if: matrix.lane == 'browser'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          # Exercise the operator-disabled compatibility path before the visual pipelines.
          docker service update --detach=false --env-add TACTIC_PIPELINE_AUTHORING_ENABLED=false offkey-smoke_tactic > /dev/null
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost:8001/ready > /dev/null
          playwright_version="$(node -p "require('./frontend/node_modules/@playwright/test/package.json').version")"
          docker run --rm --network host --ipc host \
            --volume "${PWD}/frontend:/work" \
            --volume "$OFFKEY_REHEARSAL_DIR:/smoke:ro" \
            --workdir /work --env-file "$OFFKEY_REHEARSAL_DIR/smoke.env" --env CI=true \
            "mcr.microsoft.com/playwright:v${playwright_version}-noble" npm run test:e2e:production

      - name: Verify visual pipelines against the production frontend and worker
        if: matrix.lane == 'browser'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          trap 'docker service update --detach=false --env-add TACTIC_PIPELINE_AUTHORING_ENABLED=false offkey-smoke_tactic > /dev/null' EXIT
          docker service update --detach=false --env-add TACTIC_PIPELINE_AUTHORING_ENABLED=true offkey-smoke_tactic > /dev/null
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost:8001/ready > /dev/null
          playwright_version="$(node -p "require('./frontend/node_modules/@playwright/test/package.json').version")"
          # Playwright empties its output folder before a run; a folder of their own
          # keeps the evidence of the journeys above next to that of these.
          docker run --rm --network host --ipc host \
            --volume "${PWD}/frontend:/work" \
            --volume "$OFFKEY_REHEARSAL_DIR:/smoke:ro" \
            --workdir /work --env-file "$OFFKEY_REHEARSAL_DIR/smoke.env" --env CI=true \
            "mcr.microsoft.com/playwright:v${playwright_version}-noble" \
            npm run test:e2e:pipelines -- --output=test-results/pipelines

      - name: Save shared parameter editor evidence
        if: always() && matrix.lane == 'browser'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parameter-editor
          path: frontend/test-results/**/parameter-*.png
          if-no-files-found: ignore

      - name: Save visual language review evidence
        if: always() && matrix.lane == 'browser'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-visual-language
          path: |
            frontend/test-results/**/visual-language-*.png
            frontend/test-results/**/creation-*.png
            frontend/test-results/**/*-live-pipeline.png
            frontend/test-results/**/monitoring-history-*.png
            frontend/test-results/**/maximum-graph-dark.png
            frontend/test-results/**/maximum-graph-mobile.png
            frontend/test-results/**/maximum-graph-overview.png
            frontend/test-results/**/maximum-graph-metrics.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Save the exact production images that passed the rehearsal
        if: matrix.lane == 'rehearsal' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-release
          path: ${{ env.OFFKEY_REHEARSAL_DIR }}/production-release.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Save compatible binary rollback evidence
        if: always() && matrix.lane == 'rehearsal'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatible-binary-rollback
          path: |
            ${{ env.OFFKEY_REHEARSAL_DIR }}/binary-rollback-evidence.json
            ${{ env.OFFKEY_REHEARSAL_DIR }}/browser-cutover-evidence.json
            ${{ env.OFFKEY_REHEARSAL_DIR }}/route-replacement-events.log
            ${{ env.OFFKEY_REHEARSAL_DIR }}/compatible-release.json
            ${{ env.OFFKEY_REHEARSAL_DIR }}/deployment-results.xml
            ${{ env.OFFKEY_REHEARSAL_DIR }}/static-release-evidence.json
          if-no-files-found: ignore
          retention-days: 30

      # Task names and durations only, as the production deployment log prints them.
      - name: Report where this lane's deployments spent their time
        if: always()
        run: cat "$OFFKEY_REHEARSAL_DIR/deployment-timings.txt" 2>/dev/null || echo "No deployment was timed."

      - name: Collect rehearsal diagnostics
        if: failure()
        # A hung log read must not hold the runner until the job timeout.
        timeout-minutes: 5
        run: |
          mkdir -p deployment-smoke-diagnostics
          timeout 30 docker stack ps --no-trunc offkey-smoke > deployment-smoke-diagnostics/tasks.txt 2>&1 || true
          for service in $(timeout 30 docker service ls --format '{{.Name}}' --filter label=com.docker.stack.namespace=offkey-smoke); do
            timeout 30 docker service logs --tail 100 "$service" > "deployment-smoke-diagnostics/$service.log" 2>&1 || true
          done
          # Release jobs are plain `docker run` containers; a daemon restart or OOM kill
          # only shows up in the host logs, so print them where the job log keeps them.
          echo "::group::Docker daemon and kernel messages"
          sudo journalctl -u docker --since "-40 min" --no-pager 2>&1 | grep -viE 'level=(debug|info)' | tail -n 80 || true
          sudo dmesg -T 2>&1 | grep -iE 'oom|killed process|out of memory|segfault' | tail -n 40 || true
          timeout 30 docker service ls 2>&1 || true
          echo "::endgroup::"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-smoke-artifacts-${{ matrix.lane }}
          if-no-files-found: ignore
          path: |
            deployment-smoke-diagnostics
            frontend/playwright-report
            frontend/test-results

      - name: Remove the disposable stack
        if: always()
        timeout-minutes: 3
        run: uv run --frozen --project infra python infra/tests/swarm_smoke.py cleanup --directory "$OFFKEY_REHEARSAL_DIR"

  observability:
    name: worker observability
    needs: [changes, lint]
    if: fromJSON(needs.changes.outputs.plan).observability
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ""
          sync: "false"
          cache: "false"
      - name: Install locked infrastructure tools
        run: uv sync --frozen --project infra
      - name: Rehearse worker placement, log delivery and failure isolation
        run: >-
          uv run --frozen --project infra python infra/tests/observability_smoke.py
          --evidence "$RUNNER_TEMP/observability-evidence.json"
      - name: Retain non-secret integration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observability-evidence
          path: ${{ runner.temp }}/observability-evidence.json
          if-no-files-found: ignore
          retention-days: 14

  # The one required status check. It needs every other job and passes only when
  # the changes job planned the run, every job it selected succeeded and every
  # job it did not select was skipped; its name never changes.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, lint, contracts, backend, frontend, frontend-browser, infrastructure, collection, radar, images, publish, deployment-smoke, observability, static, static-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Require every planned job to succeed and every other job to be planned out
        env:
          NEEDS: ${{ toJSON(needs) }}
          PLAN: ${{ needs.changes.outputs.plan }}
        run: python3 .github/scripts/ci_gate.py
