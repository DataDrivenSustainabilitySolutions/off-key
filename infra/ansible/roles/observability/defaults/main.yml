---
observability_source_dir: "{{ role_path }}/../../../stack"
observability_storage_host: "{{ observability_data_node }}"
observability_action: deploy
observability_files:
  - alloy-docker.cfg
  - alloy.alloy
  - loki.yml
  - grafana-datasources.yml
  - grafana-dashboards.yml
  - grafana-dashboard-logs.json
  - grafana-dashboard-overview.json
  - grafana-dashboard-collection.json
  - grafana-dashboard-radar.json
  - grafana-dashboard-access.json
observability_config_keys:
  ALLOY_DOCKER_CONFIG_HASH: alloy-docker.cfg
  ALLOY_CONFIG_HASH: alloy.alloy
  LOKI_CONFIG_HASH: loki.yml
  GRAFANA_DATASOURCES_HASH: grafana-datasources.yml
  GRAFANA_DASHBOARDS_HASH: grafana-dashboards.yml
  GRAFANA_DASHBOARD_LOGS_HASH: grafana-dashboard-logs.json
  GRAFANA_DASHBOARD_OVERVIEW_HASH: grafana-dashboard-overview.json
  GRAFANA_DASHBOARD_COLLECTION_HASH: grafana-dashboard-collection.json
  GRAFANA_DASHBOARD_RADAR_HASH: grafana-dashboard-radar.json
  GRAFANA_DASHBOARD_ACCESS_HASH: grafana-dashboard-access.json
