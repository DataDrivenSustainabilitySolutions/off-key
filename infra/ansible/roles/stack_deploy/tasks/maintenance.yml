---
- name: Inspect the existing database service
  command:
    argv: [docker, service, inspect, "{{ stack_name }}_postgres"]
  register: release_database
  changed_when: false
  failed_when: release_database.rc != 0 and 'no such service' not in release_database.stderr | lower
  no_log: true

- name: Initialize only the database on a new cluster
  when: release_database.rc != 0
  block:
    - name: Require explicit bootstrap on a new cluster
      assert:
        that: release_bootstrap | default(false) | bool
        fail_msg: A new cluster requires a controlled BOOTSTRAP=true deployment.

    - name: Save the database-only model before starting application writers
      copy:
        dest: "{{ stack_dir }}/database-bootstrap.json"
        mode: "0600"
        content: "{{ stack_compose_model | combine({'services': {'postgres': stack_compose_model.services.postgres}}) | to_nice_json }}"
      no_log: true

    - name: Start the database and attachable application network
      command:
        argv: [docker, stack, deploy, -c, "{{ stack_dir }}/database-bootstrap.json", --with-registry-auth, "{{ stack_name }}"]

- name: Locate the running production database
  include_role:
    name: swarm_task
  vars:
    svc: postgres

- name: Wait for the database before migration preflight
  command:
    argv: [docker, exec, "{{ svc_container }}", pg_isready, -U, "{{ postgres_user }}", -d, "{{ postgres_db }}"]
  delegate_to: "{{ svc_node }}"
  register: release_database_ready
  changed_when: false
  retries: 30
  delay: 2
  until: release_database_ready.rc == 0

- name: Reset the database to an empty one when the operator asks
  include_tasks: reset_database.yml
  when:
    - release_database.rc == 0
    - release_reset_database | default('') | length > 0

- name: Inspect the target schema migration requirements
  include_tasks: job.yml
  vars:
    release_job_service: db-sync
    release_job_image: "{{ db_sync_image }}"
    release_job_module: off_key_core.db.migrate
    release_job_arguments: [status]
    release_job_may_fail: true

- name: Refuse a database from before the schema baseline, changing nothing (deploy again with reset_database)
  fail:
    msg: >-
      The {{ stack_name }} database predates the schema baseline and cannot be
      upgraded. Nothing was stopped or changed. Deploy again with
      RESET_DATABASE={{ stack_name }} to back it up and start from an empty
      database.
  when: release_job_output.reset_required | default(false)

- name: Stop before any writer when the migration preflight fails
  fail:
    msg: The migration preflight failed; nothing was stopped or changed.
  when: release_job_result.rc != 0

- name: Keep the migration preflight result
  set_fact:
    release_migration_status: "{{ release_job_output }}"

- name: Initialize the monitor maintenance phase
  set_fact:
    release_monitor_phase: complete

- name: Read any existing monitor operation before retrying the bootstrap
  when: release_migration_status.pending | length == 0
  block:
    - name: Read the persisted monitor maintenance phase
      include_tasks: monitor_job.yml
      vars:
        monitor_action: status

    - name: Preserve the original cutover on a retry
      set_fact:
        release_monitor_phase: "{{ release_job_output.phase }}"

- name: Reserve maintenance before quiescing application writers
  include_tasks: monitor_job.yml
  vars:
    monitor_action: reserve

- name: Record the release before any application writer is stopped
  copy:
    dest: "{{ stack_dir }}/release-maintenance.json"
    mode: "0600"
    content: "{{ {'revision': release.application_revision} | to_nice_json }}"

- name: Stop application writers and back up before upgrading the schema
  when: release_migration_status.pending | length > 0 or ((release_bootstrap | default(false) | bool) and release_monitor_phase == 'complete')
  block:
    - name: Select the database writers to quiesce
      include_tasks: release_writers.yml

    - name: Stop writers before the database backup
      include_role:
        name: swarm_scale
      vars:
        swarm_scale_replicas: "{{ dict(release_writers | zip([0] * (release_writers | length))) }}"

    - name: Confirm every old writer has stopped
      include_role:
        name: persistence_switch
        tasks_from: wait_stopped
      vars:
        service_names: "{{ release_writers }}"

    - name: Locate the database for a private server-side backup
      include_role:
        name: swarm_task
      vars:
        svc: postgres

    - name: Create a private release backup directory on the database node
      file:
        path: "{{ stack_dir }}/.backup/releases/{{ release.application_revision }}"
        state: directory
        mode: "0700"
      delegate_to: "{{ svc_node }}"

    - name: Save and validate the original database without copying it to the runner
      shell: |
        set -euo pipefail
        umask 077
        backup={{ (stack_dir ~ '/.backup/releases/' ~ release.application_revision) | quote }}
        if [ ! -f "$backup/database.dump" ]; then
          docker exec {{ svc_container | quote }} pg_dump -U {{ postgres_user | quote }} -d {{ postgres_db | quote }} -Fc > "$backup/database.dump.pending"
          docker exec -i {{ svc_container | quote }} pg_restore --list < "$backup/database.dump.pending" > /dev/null
          mv "$backup/database.dump.pending" "$backup/database.dump"
        fi
        docker exec -i {{ svc_container | quote }} pg_restore --list < "$backup/database.dump" > /dev/null
        if [ ! -f "$backup/database.dump.sha256" ]; then
          sha256sum "$backup/database.dump" > "$backup/database.dump.sha256.pending"
          mv "$backup/database.dump.sha256.pending" "$backup/database.dump.sha256"
        fi
        sha256sum --check "$backup/database.dump.sha256" > /dev/null
      args:
        executable: /bin/bash
      delegate_to: "{{ svc_node }}"

    - name: Apply the target SQL migrations in one transaction
      include_tasks: job.yml
      vars:
        release_job_service: db-sync
        release_job_image: "{{ db_sync_image }}"
        release_job_module: off_key_core.db.migrate
        release_job_arguments: [apply]

- name: Validate the migration ledger when no upgrade is required
  include_tasks: job.yml
  vars:
    release_job_service: db-sync
    release_job_image: "{{ db_sync_image }}"
    release_job_module: off_key_core.db.migrate
    release_job_arguments: [apply]
  when: release_migration_status.pending | length == 0 and not ((release_bootstrap | default(false) | bool) and release_monitor_phase == 'complete')

# Release preflights are pinned to the target RADAR image, which the running
# pool does not run yet; a preflight-only replica of that image claims them.
- name: Preflight on the target RADAR image, then stop monitors with a durable restart plan
  block:
    - name: Assemble the preflight replica environment
      set_fact:
        release_preflight_environment_args: []
      no_log: true

    - name: Add the pool configuration to the preflight replica
      set_fact:
        release_preflight_environment_args: "{{ release_preflight_environment_args + ['--env', item.key ~ '=' ~ (item.value | string)] }}"
      loop: "{{ stack_compose_model.services['mqtt-radar'].environment | combine({'RADAR_POOL_KINDS': 'preflight'}) | dict2items }}"
      no_log: true

    - name: Start a preflight-only replica of the target RADAR image
      command:
        argv: >-
          {{ ['docker', 'run', '--detach', '--rm', '--name', stack_name ~ '-release-preflight',
              '--network', stack_name ~ '_app-network']
             + release_preflight_environment_args
             + [mqtt_radar_image, '/app/bin/python', '-m', 'off_key_mqtt_radar.pool'] }}
      no_log: true

    - name: Stop active monitors with a durable restart plan
      include_tasks: monitor_job.yml
      vars:
        monitor_action: begin
  always:
    - name: Remove the preflight-only replica
      command:
        argv: [docker, rm, --force, "{{ stack_name }}-release-preflight"]
      register: release_preflight_removed
      changed_when: release_preflight_removed.rc == 0
      failed_when: release_preflight_removed.rc != 0 and 'no such container' not in release_preflight_removed.stderr | lower
