[project]
name = "aberration-api-gateway"
version = "0.1.0"
description = "API Gateway for aberration platform"
authors = [
    { name = "Oliver Hennhoefer", email = "oliver.hennhoefer@mail.de" },
    { name = "Fernando Saba", email = "fernando.saba@gmx.de" }
]
maintainers = [
    { name = "Oliver Hennhoefer", email = "oliver.hennhoefer@mail.de" },
    { name = "Fernando Saba", email = "fernando.saba@gmx.de" }
]
keywords = ["aberration", "api", "gateway", "fastapi"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha"
]
dependencies = [
    "aberration-core[web,mail,auth]",
    "fastapi>=0.115.8",
    "slowapi>=0.1.9",
    "uvicorn>=0.25.0",
    "aiohttp>=3.14.3",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
aberration-core = { workspace = true }
