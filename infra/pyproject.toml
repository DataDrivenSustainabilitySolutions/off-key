[project]
name = "off-key-infra"
version = "0.1.0"
description = "IaC tooling — Ansible provisioning for the off-key Swarm cluster"
requires-python = ">=3.11"
dependencies = [
    "ansible>=10",        # ansible-core 2.17+; bundles community collections
    "cryptography>=42",   # ansible-vault AES256 encryption
]

# No build-system block: uv treats this as an application project (no publish needed).
# Run `uv sync` once to create .venv and install dependencies.
# All subsequent commands are invoked via `uv run <cmd>`.
