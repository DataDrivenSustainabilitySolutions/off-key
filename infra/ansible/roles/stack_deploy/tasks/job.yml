---
# CLI arguments are explicit; Compose dotenv quoting is not Docker env-file syntax.
- name: Assemble the private release job environment
  set_fact:
    release_job_environment_args: []
  no_log: true

- name: Add the service configuration to the release job
  set_fact:
    release_job_environment_args: "{{ release_job_environment_args + ['--env', item.key ~ '=' ~ (item.value | string)] }}"
  loop: "{{ stack_compose_model.services[release_job_service].environment | combine(release_job_overrides | default({})) | dict2items }}"
  no_log: true

- name: Choose the node for one-off release containers
  # A backend worker has the CPU and memory a preflight needs; the manager is
  # often the smallest node. The stack's network is attachable from any node.
  set_fact:
    release_job_node: "{{ (groups.get('swarm_backend') or [inventory_hostname]) | first }}"
  when: release_job_node is not defined

- name: Make the release job image available on its node
  include_tasks: job_image.yml
  vars:
    release_job_pull_image: "{{ release_job_image }}"
  when: release_job_node != inventory_hostname

- name: Run the release CLI against the production database
  delegate_to: "{{ release_job_node }}"
  command:
    argv: >-
      {{ ['docker', 'run', '--rm', '--network', stack_name ~ '_app-network']
         + release_job_environment_args + [release_job_image, '/app/bin/python', '-m', release_job_module]
         + release_job_arguments }}
  register: release_job_result
  changed_when: release_job_arguments[0] != 'status'
  # A preflight reports its own refusal; the caller explains it without the
  # configuration this task keeps out of the log.
  failed_when: release_job_result.rc != 0 and not (release_job_may_fail | default(false))
  no_log: true

- name: Read the release job result without exposing service configuration
  set_fact:
    release_job_output: "{{ release_job_result.stdout_lines | last | default('{}') | from_json }}"
  no_log: true
