<title id="t">Raw phase currents versus deviations from the phase mean</title>
<desc id="d">Top: three phase currents follow a normal load step at minute 30, a load-management reduction and the end-of-charge taper, while L3 reads 6 percent high from minute 55 to 75; the fault is small against the load changes. Bottom: the deviation of each phase from the mean stays flat through the load step and taper, and L3 stands out clearly during the fault.</desc>
