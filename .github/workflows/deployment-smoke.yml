name: Deployment Smoke

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: deployment-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deployment-smoke:
    name: deployment-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/infra/ansible/ansible.cfg

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read published application images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install existing E2E and infrastructure tools
        run: |
          echo "OFFKEY_REHEARSAL_DIR=$RUNNER_TEMP/offkey-rehearsal" >> "$GITHUB_ENV"
          npm ci --prefix frontend
          uv sync --project backend --all-packages --all-groups --frozen
          uv sync --project infra --frozen

      - name: Require successful image publication for this main commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 infra/scripts/wait_for_publish.py "$GITHUB_SHA"

      - name: Prepare disposable production Swarm
        timeout-minutes: 35
        run: |
          set -euo pipefail
          docker swarm init > /dev/null
          uv run --frozen --project infra python infra/tests/swarm_smoke.py prepare --directory "$OFFKEY_REHEARSAL_DIR"

      - name: Run existing browser journeys against the production frontend
        timeout-minutes: 12
        run: |
          set -euo pipefail
          playwright_version="$(node -p "require('./frontend/node_modules/@playwright/test/package.json').version")"
          docker run --rm --network host --ipc host \
            --volume "${PWD}/frontend:/work" \
            --volume "$OFFKEY_REHEARSAL_DIR:/smoke:ro" \
            --workdir /work --env-file "$OFFKEY_REHEARSAL_DIR/smoke.env" --env CI=true \
            "mcr.microsoft.com/playwright:v${playwright_version}-noble" npm run test:e2e

      - name: Verify adaptive monitoring, real backup restoration and repeated deployment
        timeout-minutes: 15
        env:
          RUN_ADAPTIVE_E2E: "1"
          OFFKEY_DEPLOYMENT_REHEARSAL: "1"
          E2E_GATEWAY_URL: http://localhost:8000
          E2E_MQTT_HOST: localhost
          E2E_MQTT_PORT: "8883"
        run: |
          set -euo pipefail
          E2E_AUTH_TOKEN="$(node -e "const state=require('./frontend/test-results/.auth/user.json'); const token=state.origins.flatMap(({localStorage=[]})=>localStorage).find(({name})=>name==='auth_token')?.value; if (!token) process.exit(1); process.stdout.write(token)")"
          echo "::add-mask::$E2E_AUTH_TOKEN"
          export E2E_AUTH_TOKEN
          export E2E_MQTT_CA_FILE="$OFFKEY_REHEARSAL_DIR/ca.crt"
          export E2E_MQTT_USERNAME=offkey-radar
          E2E_MQTT_PASSWORD="$(python3 -c 'import json, os; from pathlib import Path; print(json.loads((Path(os.environ["OFFKEY_REHEARSAL_DIR"])/"inputs.json").read_text())["mqtt_radar_password"])')"
          export E2E_MQTT_PASSWORD
          uv run --project backend python -m pytest backend/tests/test_adaptive_lane_e2e.py backend/tests/test_deployment_rehearsal.py -q --tb=short

      - name: Save the exact production images that passed the rehearsal
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release
          path: ${{ env.OFFKEY_REHEARSAL_DIR }}/production-release.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Collect rehearsal diagnostics
        if: failure()
        run: |
          mkdir -p deployment-smoke-diagnostics
          docker stack ps --no-trunc offkey-smoke > deployment-smoke-diagnostics/tasks.txt 2>&1 || true
          for service in $(docker service ls --format '{{.Name}}' --filter label=com.docker.stack.namespace=offkey-smoke); do
            docker service logs --tail 100 "$service" > "deployment-smoke-diagnostics/$service.log" 2>&1 || true
          done

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-smoke-artifacts
          if-no-files-found: ignore
          path: |
            deployment-smoke-diagnostics
            frontend/playwright-report
            frontend/test-results

      - name: Remove the disposable stack
        if: always()
        timeout-minutes: 3
        run: uv run --frozen --project infra python infra/tests/swarm_smoke.py cleanup --directory "$OFFKEY_REHEARSAL_DIR"
