[pytest]
addopts = --strict-markers
markers =
    postgres: needs TEST_SCHEMA_DATABASE_URL; applied to every test using a database fixture
    radar_integration: runs, without skips, in the RADAR production integration workflow
    collection_stack: needs the MQTT collection compose fixture (OFFKEY_COLLECTION_INTEGRATION)
    deployment: needs the deployed rehearsal stack (OFFKEY_DEPLOYMENT_REHEARSAL, RUN_ADAPTIVE_E2E)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .
testpaths =
    backend/tests
    backend/services/mqtt/proxy/tests
    backend/services/mqtt/radar/tests
